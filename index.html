<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gatos: Destinos Cruzados - Mundo Infinito</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            background-color: #050308;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        #scene-container {
            flex: 1;
            width: 100%;
            position: relative;
            background-size: cover;
            background-position: center;
            overflow: hidden;
            transition: background-image 0.4s ease-in-out;
        }

        #scene-container::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 5, 15, 0.45);
            pointer-events: none;
        }

        #gameCanvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* Controles Táctiles (Izquierda) */
        .touch-controls {
            position: absolute;
            top: 15px;
            left: 15px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            z-index: 10;
        }

        .dpad-row {
            display: flex;
            gap: 4px;
            justify-content: center;
        }

        .control-btn {
            background: rgba(80, 20, 30, 0.85);
            border: 2px solid #d4af37;
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
            user-select: none;
        }

        .control-btn:active {
            background: #d4af37;
            color: #000;
        }

        /* Panel de Acciones HUD (Derecha) */
        .action-panel-hud {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 10;
        }

        .action-hud-btn {
            background: rgba(139, 0, 0, 0.85);
            border: 2px solid #ff3333;
            color: #fff;
            padding: 6px 10px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 10px;
            border-radius: 18px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.6);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .action-hud-btn:active {
            background: #ff0000;
        }

        /* Panel Inferior */
        .ui-panel {
            background: rgba(16, 12, 18, 0.98);
            border-top: 3px solid #d4af37;
            color: #e2d9c5;
            padding: 12px 18px;
            box-sizing: border-box;
            width: 100%;
            height: 46vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.95);
            z-index: 5;
        }

        #story-title {
            color: #f3d56d;
            margin: 0;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 6px rgba(243, 213, 109, 0.5);
        }

        #story-text {
            font-size: 12px;
            line-height: 1.35;
            margin: 0;
            color: #c8bda9;
        }

        .stats-box {
            display: flex;
            gap: 10px;
            font-size: 10px;
            color: #f3d56d;
            border-bottom: 1px solid #3d2b1f;
            padding-bottom: 4px;
            flex-wrap: wrap;
        }

        .choices-container {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-top: auto;
        }

        .action-button {
            background: rgba(60, 25, 35, 0.6);
            border: 1px solid #b8973e;
            color: #f1e4c3;
            padding: 8px 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 2px;
            text-align: left;
        }

        .action-button:hover {
            background: #7a2836;
            color: #ffffff;
            border-color: #ffd700;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.7);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Escenario del Juego -->
        <div id="scene-container" style="background-image: url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1000&auto=format&fit=crop');">
            <canvas id="gameCanvas"></canvas>

            <!-- Controles Táctiles -->
            <div class="touch-controls">
                <div class="dpad-row">
                    <button class="control-btn" ontouchstart="game.startMove('UP')" onmousedown="game.startMove('UP')" onmouseup="game.stopMove()" ontouchend="game.stopMove()">⬆️</button>
                </div>
                <div class="dpad-row">
                    <button class="control-btn" ontouchstart="game.startMove('LEFT')" onmousedown="game.startMove('LEFT')" onmouseup="game.stopMove()" ontouchend="game.stopMove()">⬅️</button>
                    <button class="control-btn" ontouchstart="game.startMove('RIGHT')" onmousedown="game.startMove('RIGHT')" onmouseup="game.stopMove()" ontouchend="game.stopMove()">➡️</button>
                </div>
                <div class="dpad-row">
                    <button class="control-btn" ontouchstart="game.startMove('DOWN')" onmousedown="game.startMove('DOWN')" onmouseup="game.stopMove()" ontouchend="game.stopMove()">⬇️</button>
                </div>
            </div>

            <!-- Botones de Acción -->
            <div class="action-panel-hud">
                <button class="action-hud-btn" onclick="game.action('attack')">⚔️ Atacar</button>
                <button class="action-hud-btn" onclick="game.action('speed')">⚡ Velocidad</button>
                <button class="action-hud-btn" onclick="game.action('skill')">✨ Habilidad</button>
                <button class="action-hud-btn" onclick="game.action('search')">🔍 Buscar Pista</button>
                <button class="action-hud-btn" onclick="game.action('enterHouse')">🏠 Entrar a Casa</button>
            </div>
        </div>

        <!-- Panel Inferior -->
        <div class="ui-panel">
            <div class="stats-box">
                <span id="stat-pistas">🔍 Pistas: 0</span>
                <span id="stat-ally">🤝 Guía: Selecciona</span>
                <span id="stat-protect">🛡️ A proteger: Ninguno</span>
                <span id="stat-zona">📍 Zona: Exterior Infinito</span>
            </div>
            <h3 id="story-title">Gatos: Destinos Cruzados</h3>
            <p id="story-text">
                ¡Mundo infinito con cámara de desplazamiento! Camina largamente hacia los lados. Elige tu felino para comenzar:
            </p>
            <div class="choices-container" id="button-group">
                <button class="action-button" onclick="game.selectCat('misi', 'Misi (El Gato Naranja)', '#e67e22')">🐱 Jugar con Misi (Pueblo Industrial)</button>
                <button class="action-button" onclick="game.selectCat('luna', 'Luna (La Gata Blanca)', '#f3f4f6')">🐈‍⬛ Jugar con Luna (Aldea de la Niebla)</button>
                <button class="action-button" onclick="game.selectCat('copito', 'Copito (El Gato Gris)', '#9ca3af')">🐈 Jugar con Copito (Ciudadela de Piedra)</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight * 0.54;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Mundo virtual gigante (ancho de 3000 píxeles para simular infinito)
        const WORLD_WIDTH = 3000;

        let player = {
            x: 200,
            y: canvas.height * 0.75,
            name: 'Misi',
            color: '#e67e22',
            speed: 5,
            isMoving: null,
            boost: 1
        };

        // Cámara que sigue al jugador
        let cameraX = 0;

        let currentCat = null;
        let isInsideHouse = false;
        let pistasCount = 0;

        // Entidades distribuidas a lo largo del mapa gigante
        let villagers = [
            { x: 400, y: canvas.height * 0.7, speed: 1, dir: 1, name: 'Aldeano' },
            { x: 1200, y: canvas.height * 0.8, speed: 0.8, dir: -1, name: 'Ciudadano' },
            { x: 2200, y: canvas.height * 0.75, speed: 1.2, dir: 1, name: 'Comerciante' }
        ];

        let enemy = { x: 1600, y: canvas.height * 0.75, speed: 1.5, dir: 1, name: 'Perro Hostil', color: '#dc2626' };
        let ally = { x: 700, y: canvas.height * 0.7, name: 'Búho Guía', color: '#38bdf8' };
        let civilian = { x: 1000, y: canvas.height * 0.75, name: 'Cachorro', color: '#facc15' };

        const backgrounds = {
            exterior: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1000&auto=format&fit=crop",
            interior: "https://images.unsplash.com/photo-1513694203232-719a280e022f?q=80&w=1000&auto=format&fit=crop"
        };

        const game = {
            selectCat: function(key, name, color) {
                currentCat = key;
                player.name = name;
                player.color = color;
                player.x = 200;

                const title = document.getElementById('story-title');
                const text = document.getElementById('story-text');
                const buttons = document.getElementById('button-group');

                title.innerText = `Aventura Activa: ${name}`;
                text.innerText = `¡Explora el mundo infinito! Camina con las flechas y descubre lo que hay más adelante.`;

                document.getElementById('stat-ally').innerText = `🤝 Guía: Búho Sabio`;
                document.getElementById('stat-protect').innerText = `🛡️ A proteger: ${civilian.name}`;

                buttons.innerHTML = `
                    <button class="action-button" onclick="game.action('search')">🔍 Buscar Pista Cercana</button>
                    <button class="action-button" onclick="game.action('enterHouse')">🏠 Entrar / Salir de Casa</button>
                `;
            },

            startMove: function(dir) { player.isMoving = dir; },
            stopMove: function() { player.isMoving = null; },

            action: function(type) {
                const text = document.getElementById('story-text');
                if (type === 'attack') {
                    text.innerText = `⚔️ ¡${player.name} ataca con garras! El enemigo en el camino retrocede.`;
                } else if (type === 'speed') {
                    player.boost = 2.2;
                    text.innerText = `⚡ ¡Velocidad felina activada! Recorre el mapa a gran velocidad.`;
                    setTimeout(() => { player.boost = 1; }, 4000);
                } else if (type === 'skill') {
                    text.innerText = `✨ ¡Habilidad especial activada! Tu equipo te respalda.`;
                } else if (type === 'search') {
                    pistasCount++;
                    document.getElementById('stat-pistas').innerText = `🔍 Pistas: ${pistasCount}`;
                    text.innerText = `🔍 ¡Pista descubierta en esta zona del camino! Total: ${pistasCount}.`;
                } else if (type === 'enterHouse') {
                    isInsideHouse = !isInsideHouse;
                    const sceneContainer = document.getElementById('scene-container');
                    if (isInsideHouse) {
                        sceneContainer.style.backgroundImage = `url('${backgrounds.interior}')`;
                        document.getElementById('stat-zona').innerText = `📍 Zona: Interior Casa (Refugio)`;
                        text.innerText = `🏠 Has entrado a la casa. Los peligros del exterior han quedado afuera.`;
                    } else {
                        sceneContainer.style.backgroundImage = `url('${backgrounds.exterior}')`;
                        document.getElementById('stat-zona').innerText = `📍 Zona: Exterior Infinito`;
                        text.innerText = `🏠 Has salido al exterior. ¡Continúa tu marcha por el camino!`;
                    }
                }
            }
        };

        function updateGame() {
            if (player.isMoving === 'LEFT') player.x -= player.speed * player.boost;
            if (player.isMoving === 'RIGHT') player.x += player.speed * player.boost;
            if (player.isMoving === 'UP') player.y -= (player.speed * player.boost) * 0.7;
            if (player.isMoving === 'DOWN') player.y += (player.speed * player.boost) * 0.7;

            // Límites dentro del mundo gigante
            if (player.x < 40) player.x = 40;
            if (player.x > WORLD_WIDTH - 40) player.x = WORLD_WIDTH - 40;
            if (player.y < canvas.height * 0.45) player.y = canvas.height * 0.45;
            if (player.y > canvas.height - 30) player.y = canvas.height - 30;

            // La cámara sigue suavemente al jugador horizontalmente
            cameraX = player.x - canvas.width / 2;
            if (cameraX < 0) cameraX = 0;
            if (cameraX > WORLD_WIDTH - canvas.width) cameraX = WORLD_WIDTH - canvas.width;

            // Movimiento autónomo de los aldeanos
            villagers.forEach(v => {
                v.x += v.speed * v.dir;
                if (v.x > WORLD_WIDTH - 200 || v.x < 200) v.dir *= -1;
            });

            // Patrulla del enemigo en exteriores
            if (currentCat && !isInsideHouse) {
                enemy.x += enemy.speed * enemy.dir;
                if (enemy.x > WORLD_WIDTH - 300 || enemy.x < 500) enemy.dir *= -1;
            }
        }

        function drawScene() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            // Desplazar la cámara virtual para lograr el efecto infinito
            ctx.translate(-cameraX, 0);

            // Suelo del escenario infinito
            ctx.fillStyle = 'rgba(15, 10, 8, 0.88)';
            ctx.fillRect(0, canvas.height - 35, WORLD_WIDTH, 35);

            // Dibujar aldeanos distribuidos por el mapa largo
            villagers.forEach(v => {
                ctx.fillStyle = '#94a3b8';
                ctx.fillRect(v.x - 7, v.y - 26, 14, 22);
                ctx.beginPath();
                ctx.arc(v.x, v.y - 30, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#f1f5f9';
                ctx.font = '9px Courier New';
                ctx.fillText(v.name, v.x - 22, v.y - 40);
            });

            // Si está en el exterior, mostrar enemigos y compañeros en el mapa
            if (currentCat && !isInsideHouse) {
                ctx.fillStyle = enemy.color;
                ctx.beginPath();
                ctx.ellipse(enemy.x, enemy.y - 10, 16, 10, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.font = '10px Courier New';
                ctx.fillText(`⚠️ ${enemy.name}`, enemy.x - 35, enemy.y - 25);

                ctx.fillStyle = ally.color;
                ctx.beginPath();
                ctx.arc(ally.x, ally.y - 10, 10, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.fillText(ally.name, ally.x - 25, ally.y - 24);

                ctx.fillStyle = civilian.color;
                ctx.fillRect(civilian.x - 8, civilian.y - 14, 16, 14);
                ctx.fillStyle = '#fff';
                ctx.fillText(civilian.name, civilian.x - 25, civilian.y - 22);
            }

            // Dibujar Gato Protagonista
            let catColor = currentCat ? player.color : '#e67e22';
            let catName = currentCat ? player.name : 'Elige tu Gato';

            ctx.save();
            ctx.translate(player.x, player.y);
            
            ctx.fillStyle = catColor;
            ctx.beginPath();
            ctx.ellipse(0, 0, 20, 13, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.arc(12, -9, 10, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(7, -16); ctx.lineTo(10, -26); ctx.lineTo(15, -16);
            ctx.fillStyle = catColor;
            ctx.fill();

            ctx.fillStyle = '#00ffcc';
            ctx.fillRect(14, -12, 3, 3);

            ctx.fillStyle = '#fef3c7';
            ctx.font = '11px Courier New';
            ctx.textAlign = 'center';
            ctx.fillText(catName, 0, -38);

            ctx.restore();
            ctx.restore();
        }

        function gameLoop() {
            updateGame();
            drawScene();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
