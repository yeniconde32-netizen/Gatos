<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gatitos en Fuga: Capítulo 1 - Arcade 2D</title>
    <style>
        body {
            background-color: #090d16;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 420px;
            height: 100vh;
            padding-top: 50px;
            padding-bottom: 20px;
        }

        #game-container {
            position: relative;
            width: 95%;
            height: 56vh;
            max-height: 320px;
            background: #111827;
            border: 3px solid #38bdf8;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }

        .hud {
            position: absolute;
            top: 6px;
            left: 12px;
            right: 12px;
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            font-weight: bold;
            color: #38bdf8;
            text-shadow: 0 0 6px rgba(56, 189, 248, 0.8);
            z-index: 10;
            pointer-events: none;
        }

        /* Controles Táctiles 2D Estilo Arcade */
        .controls-container {
            width: 95%;
            max-width: 400px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 12px;
        }

        .ctrl-btn {
            background-color: #0284c7;
            color: #fff;
            border: none;
            padding: 15px 0;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(2, 132, 199, 0.4);
            user-select: none;
            -webkit-user-select: none;
        }
        .ctrl-btn:active {
            background-color: #0369a1;
            transform: translateY(2px);
        }

        .ad-banner {
            width: 100%;
            max-width: 400px;
            height: 45px;
            background-color: #111827;
            border: 1px dashed #38bdf8;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #38bdf8;
            font-size: 10px;
            margin: 4px 0;
            border-radius: 6px;
        }

        .fixed-bottom {
            margin-top: 8px;
            width: 90%;
            max-width: 380px;
        }

        .btn {
            background-color: #0284c7;
            color: #fff;
            border: none;
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 10px rgba(2, 132, 199, 0.5);
        }

        /* Pantalla Cinemática */
        #cinematic-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 10, 0.95);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 30;
            padding: 20px;
            box-sizing: border-box;
        }
        #cinematic-box {
            border: 2px solid #38bdf8;
            padding: 15px;
            background: rgba(2, 132, 199, 0.1);
            border-radius: 8px;
            max-width: 330px;
        }
        #cinematic-title {
            color: #38bdf8;
            font-size: 18px;
            margin-top: 0;
            margin-bottom: 8px;
        }
        #cinematic-text {
            color: #e5e7eb;
            font-size: 13px;
            line-height: 1.4;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="ad-banner" style="position: fixed; top: 2px;">Anuncio Superior / Monetag</div>

    <div id="game-wrapper">
        <div id="game-container">
            <div class="hud">
                <span id="score-txt">Puntos: 0</span>
                <span id="zone-txt">Zona: 1</span>
            </div>
            <canvas id="gameCanvas" width="400" height="300"></canvas>

            <!-- PANTALLA CINEMÁTICA -->
            <div id="cinematic-overlay">
                <div id="cinematic-box">
                    <h3 id="cinematic-title">ALERTA</h3>
                    <p id="cinematic-text">Mensaje...</p>
                    <button class="btn" id="cinematic-btn" onclick="handleCinematicAction()">Continuar</button>
                </div>
            </div>
        </div>

        <!-- CONTROLES TÁCTICOS 2D (IZQ, DER, SALTO, AGACHAR) -->
        <div class="controls-container">
            <button class="ctrl-btn" id="btn-left">◀</button>
            <button class="ctrl-btn" id="btn-right">▶</button>
            <button class="ctrl-btn" id="btn-jump">▲</button>
            <button class="ctrl-btn" id="btn-duck">▼</button>
        </div>

        <div class="ad-banner">Anuncio Recompensas / Banner Inferior</div>

        <div class="fixed-bottom">
            <button class="btn" onclick="window.location.href='/'">Volver al Menú Principal</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const cinematicOverlay = document.getElementById('cinematic-overlay');
        const cinematicTitle = document.getElementById('cinematic-title');
        const cinematicText = document.getElementById('cinematic-text');
        const cinematicBtn = document.getElementById('cinematic-btn');

        let stopGame = false;
        let pausedForCinematic = false;
        let isChapterEnd = false;
        let score = 0;
        let worldX = 0; // Desplazamiento del escenario 2D
        let gameSpeed = 2.5;
        let frameCount = 0;

        const CW = canvas.width;
        const CH = canvas.height;
        const GROUND_Y = CH - 50;

        let cat = {
            x: 80,
            y: GROUND_Y,
            width: 36,
            height: 28,
            vx: 0,
            dy: 0,
            jumpForce: -10,
            gravity: 0.55,
            isGrounded: true,
            isCrouched: false
        };

        let enemies = [];
        let items = [];

        let keys = { left: false, right: false, jump: false, duck: false };

        let audioCtx = null;
        function playTone(freq1, freq2, duration, type) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq1, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(freq2, audioCtx.currentTime + duration);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        function initGame() {
            stopGame = false;
            pausedForCinematic = false;
            isChapterEnd = false;
            score = 0;
            worldX = 0;
            frameCount = 0;
            enemies = [];
            items = [];
            cinematicOverlay.style.display = 'none';
            cat.x = 80;
            cat.y = GROUND_Y;
            cat.vx = 0;
            cat.dy = 0;
            cat.isGrounded = true;
            loop();
        }

        // Gestión de Controles Teclado
        window.addEventListener('keydown', e => {
            if(e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
            if(e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
            if(e.code === 'ArrowUp' || e.code === 'Space' || e.code === 'KeyW') { keys.jump = true; triggerJump(); }
            if(e.code === 'ArrowDown' || e.code === 'KeyS') keys.duck = true;
        });

        window.addEventListener('keyup', e => {
            if(e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
            if(e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
            if(e.code === 'ArrowDown' || e.code === 'KeyS') keys.duck = false;
        });

        // Gestión de Controles Táctiles (Botones Pantalla)
        function bindTouch(id, keyName, isAction = false) {
            const el = document.getElementById(id);
            el.addEventListener('touchstart', e => {
                e.preventDefault();
                keys[keyName] = true;
                if(isAction) triggerJump();
            });
            el.addEventListener('touchend', e => {
                e.preventDefault();
                if(!isAction) keys[keyName] = false;
            });
            el.addEventListener('mousedown', e => {
                keys[keyName] = true;
                if(isAction) triggerJump();
            });
            el.addEventListener('mouseup', e => {
                if(!isAction) keys[keyName] = false;
            });
        }

        bindTouch('btn-left', 'left');
        bindTouch('btn-right', 'right');
        bindTouch('btn-jump', 'jump', true);
        bindTouch('btn-duck', 'duck');

        function triggerJump() {
            if (stopGame || pausedForCinematic) return;
            if (cat.isGrounded && !cat.isCrouched) {
                cat.dy = cat.jumpForce;
                cat.isGrounded = false;
                playTone(220, 520, 0.12, 'square');
            }
        }

        const enemyTypes = [
            { name: "Cuervo Alto (Agáchate)", color: "#1f2937", heightBonus: -28, type: "high" },
            { name: "Rata de Suelo (Salta)", color: "#065f46", heightBonus: 0, type: "low" }
        ];

        function update() {
            if (stopGame || pausedForCinematic) return;
            frameCount++;
            score += 1;
            worldX += gameSpeed;

            if (frameCount % 350 === 0) gameSpeed += 0.2;
            if (score >= 1200) {
                triggerChapterComplete();
                return;
            }

            document.getElementById('score-txt').innerText = `Puntos: ${score}`;

            // Movimiento lateral 2D
            cat.vx = 0;
            if (keys.left) cat.vx = -3.5;
            if (keys.right) cat.vx = 3.5;

            cat.x += cat.vx;
            // Limitar movimiento dentro de la pantalla
            if (cat.x < 20) cat.x = 20;
            if (cat.x > CW - 50) cat.x = CW - 50;

            // Manejo de Agacharse
            cat.isCrouched = keys.duck;
            cat.height = cat.isCrouched ? 16 : 28;

            // Gravedad y salto
            cat.dy += cat.gravity;
            cat.y += cat.dy;
            
            let currentGround = GROUND_Y + (cat.isCrouched ? 12 : 0);
            if (cat.y >= currentGround) {
                cat.y = currentGround;
                cat.dy = 0;
                cat.isGrounded = true;
            }

            // Generador de obstáculos dinámicos
            if (frameCount % 90 === 0) {
                let typeIdx = Math.random() > 0.5 ? 1 : 0;
                let data = enemyTypes[typeIdx];
                enemies.push({
                    x: CW + worldX,
                    y: GROUND_Y + data.heightBonus,
                    width: 36,
                    height: data.type === 'high' ? 14 : 22,
                    data: data
                });
            }

            // Generar Pescados
            if (frameCount % 120 === 0) {
                items.push({
                    x: CW + worldX,
                    y: GROUND_Y - 10,
                    width: 20,
                    height: 12
                });
            }

            // Colisiones con Enemigos
            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                let screenEX = e.x - worldX;

                if (
                    cat.x < screenEX + e.width &&
                    cat.x + cat.width > screenEX &&
                    cat.y < e.y + e.height &&
                    cat.y + cat.height > e.y
                ) {
                    triggerCinematicEncounter(e);
                    return;
                }

                if (screenEX + e.width < -50) enemies.splice(i, 1);
            }

            // Colisiones con Ítems (Pescados)
            for (let i = items.length - 1; i >= 0; i--) {
                let itm = items[i];
                let screenIX = itm.x - worldX;

                if (
                    cat.x < screenIX + itm.width &&
                    cat.x + cat.width > screenIX &&
                    cat.y < itm.y + itm.height &&
                    cat.y + cat.height > itm.y
                ) {
                    score += 75;
                    playTone(650, 1150, 0.05, 'sine');
                    items.splice(i, 1);
                } else if (screenIX + itm.width < -50) {
                    items.splice(i, 1);
                }
            }
        }

        function triggerCinematicEncounter(enemy) {
            pausedForCinematic = true;
            stopGame = true;
            playTone(130, 45, 0.8, 'sawtooth');

            isChapterEnd = false;
            cinematicTitle.innerText = "¡COLISIÓN URBANA!";
            cinematicText.innerText = enemy.data.type === 'high' ? "¡Chocaste con el cuervo! Debías agacharte (▼) para pasar." : "¡Chocaste con la rata! Debías saltar (▲) para esquivarla.";
            cinematicBtn.innerText = "Reintentar Zona";
            cinematicOverlay.style.display = 'flex';
        }

        function triggerChapterComplete() {
            stopGame = true;
            pausedForCinematic = true;
            isChapterEnd = true;
            playTone(400, 1000, 0.5, 'triangle');

            cinematicTitle.innerText = "¡ZONA 1 SUPERADA!";
            cinematicText.innerText = "¡Excelente manejo 2D! Has dominado el salto y el sigilo agachado en los callejones.";
            cinematicBtn.innerText = "Menú Principal";
            cinematicOverlay.style.display = 'flex';
        }

        function handleCinematicAction() {
            if (isChapterEnd) {
                window.location.href = '/';
            } else {
                initGame();
            }
        }

        function draw() {
            // Fondo urbano nocturno con líneas de ladrillo
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, CW, CH);

            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 1;
            for(let i = 0; i < CH; i += 20) {
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(CW, i);
                ctx.stroke();
            }

            // Suelo Callejero con neón
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(0, GROUND_Y + 28, CW, CH - GROUND_Y);
            ctx.fillStyle = '#38bdf8';
            ctx.fillRect(0, GROUND_Y + 28, CW, 3);

            // Dibujar Gato 2D (Naranja con animación de agacharse)
            ctx.fillStyle = '#f97316';
            let renderH = cat.height;
            let renderY = cat.y;
            ctx.fillRect(cat.x, renderY + 4, cat.width - 6, renderH);
            
            // Cabeza
            ctx.fillRect(cat.x + cat.width - 14, renderY - 2, 14, 12);
            // Orejas
            ctx.fillStyle = '#ea580c';
            ctx.fillRect(cat.x + cat.width - 12, renderY - 6, 3, 5);
            ctx.fillRect(cat.x + cat.width - 4, renderY - 6, 3, 5);

            // Dibujar Enemigos
            for (let e of enemies) {
                let screenEX = e.x - worldX;
                ctx.fillStyle = e.data.color;
                ctx.fillRect(screenEX, e.y, e.width, e.height);
                // Ojos brillantes
                ctx.fillStyle = '#38bdf8';
                ctx.fillRect(screenEX + 6, e.y + 4, 3, 3);
            }

            // Dibujar Pescados
            for (let itm of items) {
                let screenIX = itm.x - worldX;
                ctx.fillStyle = '#38bdf8';
                ctx.fillRect(screenIX, itm.y + 4, 14, 8);
            }
        }

        function loop() {
            if (stopGame) return;
            update();
            draw();
            requestAnimationFrame(loop);
        }

        initGame();
    </script>
</body>
</html>
