<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gatos: Destinos Cruzados - Escenarios Propios</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            background-color: #050308;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        #scene-container {
            flex: 1;
            width: 100%;
            position: relative;
            background-size: cover;
            background-position: center;
            overflow: hidden;
            transition: background-image 0.5s ease-in-out;
        }

        #scene-container::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 5, 15, 0.4);
            pointer-events: none;
        }

        #gameCanvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* Controles Táctiles de Alta Precisión */
        .touch-controls {
            position: absolute;
            top: 15px;
            left: 15px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            z-index: 10;
        }

        .dpad-row {
            display: flex;
            gap: 4px;
            justify-content: center;
        }

        .control-btn {
            background: rgba(80, 20, 30, 0.9);
            border: 2px solid #d4af37;
            color: #fff;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.6);
            user-select: none;
            -webkit-touch-callout: none;
        }

        .control-btn.active {
            background: #ffd700 !important;
            color: #000 !important;
            transform: scale(0.92);
        }

        /* Panel de Acciones HUD (Derecha) */
        .action-panel-hud {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 10;
        }

        .action-hud-btn {
            background: rgba(139, 0, 0, 0.85);
            border: 2px solid #ff3333;
            color: #fff;
            padding: 6px 10px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 10px;
            border-radius: 18px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.6);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .action-hud-btn:active {
            background: #ff0000;
        }

        /* Panel Inferior */
        .ui-panel {
            background: rgba(16, 12, 18, 0.98);
            border-top: 3px solid #d4af37;
            color: #e2d9c5;
            padding: 12px 18px;
            box-sizing: border-box;
            width: 100%;
            height: 46vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.95);
            z-index: 5;
        }

        #story-title {
            color: #f3d56d;
            margin: 0;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 6px rgba(243, 213, 109, 0.5);
        }

        #story-text {
            font-size: 12px;
            line-height: 1.35;
            margin: 0;
            color: #c8bda9;
        }

        .stats-box {
            display: flex;
            gap: 10px;
            font-size: 10px;
            color: #f3d56d;
            border-bottom: 1px solid #3d2b1f;
            padding-bottom: 4px;
            flex-wrap: wrap;
        }

        .choices-container {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-top: auto;
        }

        .action-button {
            background: rgba(60, 25, 35, 0.6);
            border: 1px solid #b8973e;
            color: #f1e4c3;
            padding: 8px 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 2px;
            text-align: left;
        }

        .action-button:hover {
            background: #7a2836;
            color: #ffffff;
            border-color: #ffd700;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.7);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Escenario del Juego con Fondo Inicial Neutro -->
        <div id="scene-container" style="background-image: url('https://images.unsplash.com/photo-1509198397868-475647b2a1e5?q=80&w=1000&auto=format&fit=crop');">
            <canvas id="gameCanvas"></canvas>

            <!-- Controles Táctiles de Movimiento Continuo -->
            <div class="touch-controls">
                <div class="dpad-row">
                    <button class="control-btn" data-dir="UP">⬆️</button>
                </div>
                <div class="dpad-row">
                    <button class="control-btn" data-dir="LEFT">⬅️</button>
                    <button class="control-btn" data-dir="RIGHT">➡️</button>
                </div>
                <div class="dpad-row">
                    <button class="control-btn" data-dir="DOWN">⬇️</button>
                </div>
            </div>

            <!-- Botones de Acción -->
            <div class="action-panel-hud">
                <button class="action-hud-btn" onclick="game.action('attack')">⚔️ Atacar</button>
                <button class="action-hud-btn" onclick="game.action('speed')">⚡ Velocidad</button>
                <button class="action-hud-btn" onclick="game.action('skill')">✨ Habilidad</button>
                <button class="action-hud-btn" onclick="game.action('search')">🔍 Buscar Pista</button>
                <button class="action-hud-btn" onclick="game.action('enterHouse')">🏠 Entrar a Casa</button>
            </div>
        </div>

        <!-- Panel Inferior -->
        <div class="ui-panel">
            <div class="stats-box">
                <span id="stat-pistas">🔍 Pistas: 0</span>
                <span id="stat-ally">🤝 Guía: Selecciona</span>
                <span id="stat-protect">🛡️ A proteger: Ninguno</span>
                <span id="stat-zona">📍 Zona: Selección</span>
            </div>
            <h3 id="story-title">Gatos: Destinos Cruzados</h3>
            <p id="story-text">
                ¡Cada felino tiene su propio escenario exclusivo y mundo infinito! Selecciona tu personaje para comenzar:
            </p>
            <div class="choices-container" id="button-group">
                <button class="action-button" onclick="game.selectCat('misi', 'Misi (El Gato Naranja)', '#e67e22', 'industrial')">🐱 Jugar con Misi (Pueblo Industrial)</button>
                <button class="action-button" onclick="game.selectCat('luna', 'Luna (La Gata Blanca)', '#f3f4f6', 'fog')">🐈‍⬛ Jugar con Luna (Aldea de la Niebla)</button>
                <button class="action-button" onclick="game.selectCat('copito', 'Copito (El Gato Gris)', '#9ca3af', 'stone')">🐈 Jugar con Copito (Ciudadela de Piedra)</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight * 0.54;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const WORLD_WIDTH = 3500;

        let player = {
            x: 300,
            y: canvas.height * 0.75,
            name: 'Selecciona Gato',
            color: '#e67e22',
            speed: 5,
            boost: 1,
            facing: 1
        };

        // Estado de movimiento por teclas activas (Soporta múltiples toques simultáneos)
        let activeKeys = { UP: false, DOWN: false, LEFT: false, RIGHT: false };

        let cameraX = 0;
        let currentCat = null;
        let isInsideHouse = false;
        let pistasCount = 0;

        // Escenarios únicos para cada gato
        const backgrounds = {
            industrial: {
                exterior: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1000&auto=format&fit=crop",
                interior: "https://images.unsplash.com/photo-1513694203232-719a280e022f?q=80&w=1000&auto=format&fit=crop"
            },
            fog: {
                exterior: "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?q=80&w=1000&auto=format&fit=crop",
                interior: "https://images.unsplash.com/photo-1512917774080-9991f1c4c750?q=80&w=1000&auto=format&fit=crop"
            },
            stone: {
                exterior: "https://images.unsplash.com/photo-1448375240586-882707db888b?q=80&w=1000&auto=format&fit=crop",
                interior: "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?q=80&w=1000&auto=format&fit=crop"
            }
        };

        let currentTheme = 'industrial';

        let villagers = [
            { x: 600, y: canvas.height * 0.7, speed: 1, dir: 1, name: 'Aldeano' },
            { x: 1600, y: canvas.height * 0.8, speed: 0.8, dir: -1, name: 'Ciudadano' },
            { x: 2600, y: canvas.height * 0.75, speed: 1.1, dir: 1, name: 'Mercader' }
        ];

        let enemy = { x: 1900, y: canvas.height * 0.75, speed: 1.3, dir: 1, name: 'Perro Hostil', color: '#dc2626' };
        let ally = { x: 900, y: canvas.height * 0.7, name: 'Búho Guía', color: '#38bdf8' };
        let civilian = { x: 1300, y: canvas.height * 0.75, name: 'Cachorro', color: '#facc15' };

        const game = {
            selectCat: function(key, name, color, theme) {
                currentCat = key;
                currentTheme = theme;
                player.name = name;
                player.color = color;
                player.x = 300;
                isInsideHouse = false;

                // Aplicar el escenario específico del gato elegido
                document.getElementById('scene-container').style.backgroundImage = `url('${backgrounds[currentTheme].exterior}')`;

                const title = document.getElementById('story-title');
                const text = document.getElementById('story-text');
                const buttons = document.getElementById('button-group');

                title.innerText = `Aventura Activa: ${name}`;
                text.innerText = `¡Has entrado a tu escenario exclusivo! Usa el pad de flechas para explorar libremente el mapa infinito.`;

                document.getElementById('stat-ally').innerText = `🤝 Guía: Búho Sabio`;
                document.getElementById('stat-protect').innerText = `🛡️ A proteger: ${civilian.name}`;
                document.getElementById('stat-zona').innerText = `📍 Zona: Exterior Exclusivo`;

                buttons.innerHTML = `
                    <button class="action-button" onclick="game.action('search')">🔍 Buscar Pista Cercana</button>
                    <button class="action-button" onclick="game.action('enterHouse')">🏠 Entrar / Salir de Casa</button>
                `;
            },

            action: function(type) {
                if (!currentCat) {
                    alert("¡Primero debes seleccionar un gato!");
                    return;
                }
                const text = document.getElementById('story-text');
                if (type === 'attack') {
                    text.innerText = `⚔️ ¡${player.name} ataca con garras! El peligro retrocede en tu territorio.`;
                } else if (type === 'speed') {
                    player.boost = 2.2;
                    text.innerText = `⚡ ¡Velocidad felina activada! Te desplazas con máxima agilidad.`;
                    setTimeout(() => { player.boost = 1; }, 4000);
                } else if (type === 'skill') {
                    text.innerText = `✨ ¡Habilidad especial activada en tu escenario!`;
                } else if (type === 'search') {
                    pistasCount++;
                    document.getElementById('stat-pistas').innerText = `🔍 Pistas: ${pistasCount}`;
                    text.innerText = `🔍 ¡Pista hallada en tu ruta! Total: ${pistasCount}.`;
                } else if (type === 'enterHouse') {
                    isInsideHouse = !isInsideHouse;
                    const sceneContainer = document.getElementById('scene-container');
                    if (isInsideHouse) {
                        sceneContainer.style.backgroundImage = `url('${backgrounds[currentTheme].interior}')`;
                        document.getElementById('stat-zona').innerText = `📍 Zona: Refugio Interior`;
                        text.innerText = `🏠 Estás dentro de la casa en tu propio refugio privado.`;
                    } else {
                        sceneContainer.style.backgroundImage = `url('${backgrounds[currentTheme].exterior}')`;
                        document.getElementById('stat-zona').innerText = `📍 Zona: Exterior Exclusivo`;
                        text.innerText = `🏠 De vuelta al extenso exterior de tu territorio.`;
                    }
                }
            }
        };

        // Configuración de controles táctiles robustos basados en punteros (Touch + Mouse simultáneos)
        function setupTouchControls() {
            const buttons = document.querySelectorAll('.control-btn');

            buttons.forEach(btn => {
                const dir = btn.getAttribute('data-dir');

                const pressOn = (e) => {
                    e.preventDefault();
                    activeKeys[dir] = true;
                    btn.classList.add('active');
                };

                const pressOff = (e) => {
                    e.preventDefault();
                    activeKeys[dir] = false;
                    btn.classList.remove('active');
                };

                btn.addEventListener('pointerdown', pressOn);
                btn.addEventListener('pointerup', pressOff);
                btn.addEventListener('pointerleave', pressOff);
                btn.addEventListener('pointercancel', pressOff);
            });
        }

        setupTouchControls();

        function updateGame() {
            // Movimiento fluido según el estado de las teclas o botones táctiles
            let moveSpeed = player.speed * player.boost;

            if (activeKeys.LEFT) {
                player.x -= moveSpeed;
                player.facing = -1;
            }
            if (activeKeys.RIGHT) {
                player.x += moveSpeed;
                player.facing = 1;
            }
            if (activeKeys.UP) {
                player.y -= moveSpeed * 0.7;
            }
            if (activeKeys.DOWN) {
                player.y += moveSpeed * 0.7;
            }

            // Límites del mundo gigante
            if (player.x < 40) player.x = 40;
            if (player.x > WORLD_WIDTH - 40) player.x = WORLD_WIDTH - 40;
            if (player.y < canvas.height * 0.45) player.y = canvas.height * 0.45;
            if (player.y > canvas.height - 30) player.y = canvas.height - 30;

            // Cámara sigue al jugador
            cameraX = player.x - canvas.width / 2;
            if (cameraX < 0) cameraX = 0;
            if (cameraX > WORLD_WIDTH - canvas.width) cameraX = WORLD_WIDTH - canvas.width;

            // Movimiento de personajes secundarios
            villagers.forEach(v => {
                v.x += v.speed * v.dir;
                if (v.x > WORLD_WIDTH - 200 || v.x < 200) v.dir *= -1;
            });

            if (currentCat && !isInsideHouse) {
                enemy.x += enemy.speed * enemy.dir;
                if (enemy.x > WORLD_WIDTH - 300 || enemy.x < 400) enemy.dir *= -1;
            }
        }

        function drawScene() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(-cameraX, 0);

            // Suelo del mapa
            ctx.fillStyle = 'rgba(15, 10, 8, 0.88)';
            ctx.fillRect(0, canvas.height - 35, WORLD_WIDTH, 35);

            // Aldeanos
            villagers.forEach(v => {
                ctx.fillStyle = '#94a3b8';
                ctx.fillRect(v.x - 7, v.y - 26, 14, 22);
                ctx.beginPath();
                ctx.arc(v.x, v.y - 30, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#f1f5f9';
                ctx.font = '9px Courier New';
                ctx.fillText(v.name, v.x - 22, v.y - 40);
            });

            // Elementos del exterior si el gato está activo y fuera de casa
            if (currentCat && !isInsideHouse) {
                ctx.fillStyle = enemy.color;
                ctx.beginPath();
                ctx.ellipse(enemy.x, enemy.y - 10, 16, 10, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.font = '10px Courier New';
                ctx.fillText(`⚠️ ${enemy.name}`, enemy.x - 35, enemy.y - 25);

                ctx.fillStyle = ally.color;
                ctx.beginPath();
                ctx.arc(ally.x, ally.y - 10, 10, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.fillText(ally.name, ally.x - 25, ally.y - 24);

                ctx.fillStyle = civilian.color;
                ctx.fillRect(civilian.x - 8, civilian.y - 14, 16, 14);
                ctx.fillStyle = '#fff';
                ctx.fillText(civilian.name, civilian.x - 25, civilian.y - 22);
            }

            // Dibujar al Gato Protagonista
            let catColor = currentCat ? player.color : '#e67e22';
            let catName = currentCat ? player.name : 'Elige tu Gato';

            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.scale(player.facing, 1);
            
            ctx.fillStyle = catColor;
            ctx.beginPath();
            ctx.ellipse(0, 0, 20, 13, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.arc(12, -9, 10, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(7, -16); ctx.lineTo(10, -26); ctx.lineTo(15, -16);
            ctx.fillStyle = catColor;
            ctx.fill();

            ctx.fillStyle = '#00ffcc';
            ctx.fillRect(14, -12, 3, 3);
            ctx.restore();

            // Nombre flotante del gato
            ctx.fillStyle = '#fef3c7';
            ctx.font = '11px Courier New';
            ctx.textAlign = 'center';
            ctx.fillText(catName, player.x, player.y - 38);

            ctx.restore();
        }

        function gameLoop() {
            updateGame();
            drawScene();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
