<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gatos: Destinos Cruzados - 2D Adventure</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Cinzel', serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            height: 100vh;
        }
        #gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
            background: #121620;
        }
        #log-overlay {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 500px;
            background: rgba(10, 15, 22, 0.85);
            border: 1px solid #1e3a8a;
            color: #60a5fa;
            padding: 10px;
            border-radius: 8px;
            font-size: 11px;
            height: 60px;
            overflow-y: auto;
            font-family: 'Courier New', Courier, monospace;
            pointer-events: none;
            z-index: 10;
        }
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap');
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>
    
    <div id="log-overlay">
        [Sistema] ¡Bienvenido a Gatos: Destinos Cruzados! Toca los botones en pantalla para moverte y atacar.
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const logEl = document.getElementById('log-overlay');

        // Recursos con iconos y avatares web seguros
        const assets = {
            backgrounds: [
                "https://images.unsplash.com/photo-1542227072-b5317436c971?q=80&w=800&h=600&auto=format&fit=crop", 
                "https://images.unsplash.com/photo-1611532737174-0f395d1f23b0?q=80&w=800&h=600&auto=format&fit=crop"  
            ],
            players: [
                "https://cdn-icons-png.flaticon.com/512/2199/2199744.png", 
                "https://cdn-icons-png.flaticon.com/512/3069/3069194.png"  
            ],
            enemies: [
                "https://cdn-icons-png.flaticon.com/512/2414/2414615.png", 
                "https://cdn-icons-png.flaticon.com/512/4316/4316271.png"  
            ],
            fx: "https://cdn-icons-png.flaticon.com/512/6676/6676047.png"
        };

        const imgObjs = { bgs: [], players: [], enemies: [], fx: null };
        let assetsLoaded = false;

        function preloadAssets(callback) {
            let loaded = 0;
            const total = assets.backgrounds.length + assets.players.length + assets.enemies.length + 1;
            
            const onLoad = () => { 
                loaded++; 
                if(loaded >= total) {
                    assetsLoaded = true;
                    callback();
                }
            };
            
            assets.backgrounds.forEach(src => { let img = new Image(); img.onload = onLoad; img.onerror = onLoad; img.src = src; imgObjs.bgs.push(img); });
            assets.players.forEach(src => { let img = new Image(); img.onload = onLoad; img.onerror = onLoad; img.src = src; imgObjs.players.push(img); });
            assets.enemies.forEach(src => { let img = new Image(); img.onload = onLoad; img.onerror = onLoad; img.src = src; imgObjs.enemies.push(img); });
            imgObjs.fx = new Image(); imgObjs.fx.onload = onLoad; imgObjs.fx.onerror = onLoad; imgObjs.fx.src = assets.fx;
        }

        let currentCampaign = 0;
        const campaigns = [
            { name: "Misi (Gato Naranja)", zone: "Refugio Interior", eName: "Perro Mutante", pHp: 100, eHp: 100, pMaxHp: 100, eMaxHp: 100 },
            { name: "Luna (Gata Blanca)", zone: "Aldea de la Niebla", eName: "Sombra Fantasmal", pHp: 100, eHp: 120, pMaxHp: 100, eMaxHp: 120 }
        ];

        let playerPos = { x: 80, y: 300 };
        let enemyPos = { x: 300, y: 300 };
        let fxAnim = { active: false, x: 0, y: 0, timer: 0 };

        let width, height;
        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            playerPos.y = height * 0.45;
            enemyPos.y = height * 0.45;
            enemyPos.x = width - 150;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const dpadAreas = [];
        const actionAreas = [];

        function drawGame() {
            ctx.clearRect(0, 0, width, height);

            // 1. Fondo o color por defecto si carga
            if (assetsLoaded && imgObjs.bgs[currentCampaign].complete) {
                ctx.drawImage(imgObjs.bgs[currentCampaign], 0, 0, width, height);
            } else {
                ctx.fillStyle = '#1a1a2e';
                ctx.fillRect(0, 0, width, height);
            }

            // Capa oscura cinemática
            let gradient = ctx.createRadialGradient(width/2, height/2, 0, width/2, height/2, width/1.2);
            gradient.addColorStop(0, 'rgba(0,0,0,0.2)');
            gradient.addColorStop(1, 'rgba(0,0,0,0.85)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);

            // 2. Personajes
            let charSize = Math.min(width, height) * 0.22;
            if (assetsLoaded) {
                ctx.drawImage(imgObjs.players[currentCampaign], playerPos.x, playerPos.y, charSize, charSize);
                ctx.drawImage(imgObjs.enemies[currentCampaign], enemyPos.x, enemyPos.y, charSize, charSize);
            }

            // 3. HUD y Botones táctiles
            drawHUD(charSize);

            // 4. Animación de ataque
            if (fxAnim.active) {
                ctx.globalAlpha = fxAnim.timer / 15;
                if(imgObjs.fx) ctx.drawImage(imgObjs.fx, fxAnim.x, fxAnim.y, charSize/2, charSize/2);
                ctx.globalAlpha = 1;
                fxAnim.timer--;
                if(fxAnim.timer <= 0) fxAnim.active = false;
            }

            requestAnimationFrame(drawGame);
        }

        function drawHUD(cs) {
            ctx.textAlign = 'center';
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 16px Cinzel, serif';
            
            let c = campaigns[currentCampaign];
            ctx.fillText(c.name + " (" + c.zone + ")", width / 2, 40);

            // Barras de vida
            drawHealthBar(30, 60, 140, 14, c.pHp, c.pMaxHp, "#22c55e");
            drawHealthBar(width - 170, 60, 140, 14, c.eHp, c.eMaxHp, "#ef4444");
            ctx.font = '10px Courier New';
            ctx.fillText("HP Gato", 100, 88);
            ctx.fillText("HP Enemigo", width - 100, 88);

            // D-Pad táctil inferior izquierdo
            drawDPad(cs);

            // Botones de acción inferior derecho
            drawActionButtons(cs);
        }

        function drawHealthBar(x, y, w, h, current, max, color) {
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(x, y, w, h);
            ctx.fillStyle = color;
            ctx.fillRect(x, y, Math.max(0, (current / max) * w), h);
            ctx.strokeStyle = '#fff';
            ctx.strokeRect(x, y, w, h);
        }

        function drawDPad(cs) {
            const btnSize = 55;
            const startX = 30;
            const startY = height - 190;
            const gap = 60;

            const buttons = [
                { dx: 1, dy: 0, icon: '▲', id: 'up' },
                { dx: 0, dy: 1, icon: '◀', id: 'left' },
                { dx: 1, dy: 1, icon: '🔄', id: 'switch' },
                { dx: 2, dy: 1, icon: '▶', id: 'right' },
                { dx: 1, dy: 2, icon: '▼', id: 'down' }
            ];
            
            dpadAreas.length = 0; 
            buttons.forEach(b => {
                let bx = startX + b.dx * gap;
                let by = startY + b.dy * gap;
                
                ctx.fillStyle = 'rgba(30, 41, 59, 0.8)';
                ctx.fillRect(bx, by, btnSize, btnSize);
                ctx.strokeStyle = '#38bdf8';
                ctx.strokeRect(bx, by, btnSize, btnSize);
                
                ctx.fillStyle = '#fff';
                ctx.font = '18px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(b.icon, bx + btnSize/2, by + btnSize/1.6);
                
                dpadAreas.push({ x1: bx, y1: by, x2: bx+btnSize, y2: by+btnSize, id: b.id });
            });
        }

        function drawActionButtons(cs) {
            const btnWidth = 130;
            const btnHeight = 42;
            const startX = width - 150;
            const startY = height - 180;
            const gap = 50;

            const actions = [
                { text: '⚔️ Atacar', color: 'rgba(239, 68, 68, 0.7)', id: 'attack' },
                { text: '⚡ Habilidad', color: 'rgba(59, 130, 246, 0.7)', id: 'skill' },
                { text: '🔍 Investigar', color: 'rgba(234, 179, 8, 0.7)', id: 'search' }
            ];

            actionAreas.length = 0;
            actions.forEach((a, i) => {
                let ax = startX;
                let ay = startY + i * gap;
                
                ctx.fillStyle = a.color;
                ctx.fillRect(ax, ay, btnWidth, btnHeight);
                ctx.strokeStyle = '#fff';
                ctx.strokeRect(ax, ay, btnWidth, btnHeight);
                
                ctx.fillStyle = '#fff';
                ctx.font = '12px Cinzel, serif';
                ctx.textAlign = 'center';
                ctx.fillText(a.text, ax + btnWidth/2, ay + btnHeight/1.6);
                
                actionAreas.push({ x1: ax, y1: ay, x2: ax+btnWidth, y2: ay+btnHeight, id: a.id });
            });
        }

        function log(msg) {
            logEl.innerHTML += `<br>` + msg;
            logEl.scrollTop = logEl.scrollHeight;
        }

        function handleInput(id) {
            let c = campaigns[currentCampaign];
            if (id === 'switch') {
                currentCampaign = (currentCampaign + 1) % campaigns.length;
                let nc = campaigns[currentCampaign];
                log(`=== CAMPAÑA: ${nc.name} (${nc.zone}) ===`);
                return;
            }

            let step = 25;
            if (id === 'up') playerPos.y = Math.max(100, playerPos.y - step);
            if (id === 'down') playerPos.y = Math.min(height - 220, playerPos.y + step);
            if (id === 'left') playerPos.x = Math.max(20, playerPos.x - step);
            if (id === 'right') playerPos.x = Math.min(width - 120, playerPos.x + step);

            if (id === 'attack') {
                fxAnim = { active: true, x: enemyPos.x, y: enemyPos.y, timer: 15 };
                c.eHp = Math.max(0, c.eHp - 25);
                log(`[Ataque] ¡Golpe crítico a ${c.eName}! Vida enemiga: ${c.eHp}/${c.eMaxHp}`);
                if (c.eHp === 0) log(`🎉 ¡Zona despejada! El enemigo ha caído.`);
            }

            if (id === 'skill') {
                log(`[Habilidad] ¡${c.name} activa su destreza de resiliencia!`);
            }

            if (id === 'search') {
                log(`[Pista] Has descubierto una pista clave oculta en este sector.`);
            }
        }

        // Control táctil para los botones dibujados
        canvas.addEventListener('touchstart', function(e) {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            const tx = touch.clientX - rect.left;
            const ty = touch.clientY - rect.top;

            // Verificar D-Pad
            for (let b of dpadAreas) {
                if (tx >= b.x1 && tx <= b.x2 && ty >= b.y1 && ty <= b.y2) {
                    handleInput(b.id);
                    return;
                }
            }

            // Verificar Botones de Acción
            for (let a of actionAreas) {
                if (tx >= a.x1 && tx <= a.x2 && ty >= a.y1 && ty <= a.y2) {
                    handleInput(a.id);
                    return;
                }
            }
        }, { passive: false });

        preloadAssets(() => {
            drawGame();
        });
    </script>
</body>
</html>
