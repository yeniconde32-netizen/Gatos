<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saga de Gatitos en Fuga: Cap 1 - Callejón</title>
    <style>
        body {
            background-color: #090d16;
            color: #ffffff;
            font-family: 'Georgia', serif; /* Fuente clásica para narrativa */
            text-align: center;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 420px;
            height: 100vh;
            padding-top: 50px;
            padding-bottom: 20px;
        }

        #game-container {
            position: relative;
            width: 95%;
            height: 56vh;
            max-height: 320px;
            background: #111827; /* Fondo callejón */
            border: 3px solid #ea580c; /* Borde color fuego */
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(234, 88, 12, 0.4);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }

        .hud {
            position: absolute;
            top: 6px;
            left: 12px;
            right: 12px;
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            font-weight: bold;
            color: #fde68a;
            text-shadow: 2px 2px #000;
            z-index: 10;
            pointer-events: none;
        }

        /* Controles Táctiles 2D */
        .controls-container {
            width: 95%;
            max-width: 400px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 12px;
        }

        .ctrl-btn {
            background-color: #ea580c;
            color: #111827;
            border: none;
            padding: 15px 0;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(234, 88, 12, 0.4);
            user-select: none;
            -webkit-user-select: none;
        }
        .ctrl-btn:active {
            background-color: #c2410c;
            transform: translateY(2px);
        }

        .ad-banner {
            width: 100%;
            max-width: 400px;
            height: 45px;
            background-color: #111827;
            border: 1px dashed #ea580c;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ea580c;
            font-size: 10px;
            margin: 4px 0;
            border-radius: 6px;
        }

        .fixed-bottom {
            margin-top: 8px;
            width: 90%;
            max-width: 380px;
        }

        .btn {
            background-color: #ea580c;
            color: #111827;
            border: none;
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* Pantalla Cinemática / Narrativa */
        #cinematic-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 10, 0.95);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 30;
            padding: 20px;
            box-sizing: border-box;
        }
        #cinematic-box {
            border: 2px solid #ea580c;
            padding: 15px;
            background: rgba(234, 88, 12, 0.1);
            border-radius: 8px;
            max-width: 330px;
        }
        #cinematic-title {
            color: #ef4444; /* Rojo peligro */
            font-size: 18px;
            margin-top: 0;
            margin-bottom: 8px;
        }
        #cinematic-text {
            color: #e5e7eb;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 15px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="ad-banner" style="position: fixed; top: 2px;">Anuncio Superior / Monetag</div>

    <div id="game-wrapper">
        <div id="game-container">
            <div class="hud">
                <span id="score-txt">Puntos: 0</span>
                <span id="chapter-txt">Cap 1: Callejón</span>
            </div>
            <canvas id="gameCanvas" width="400" height="300"></canvas>

            <div id="cinematic-overlay">
                <div id="cinematic-box">
                    <h3 id="cinematic-title">¡ALERTA!</h3>
                    <p id="cinematic-text">Mensaje...</p>
                    <button class="btn" id="cinematic-btn" onclick="handleCinematicAction()">Continuar</button>
                </div>
            </div>
        </div>

        <div class="controls-container">
            <button class="ctrl-btn" id="btn-left">◀</button>
            <button class="ctrl-btn" id="btn-right">▶</button>
            <button class="ctrl-btn" id="btn-jump">▲</button>
            <button class="ctrl-btn" id="btn-duck">▼</button>
        </div>

        <div class="ad-banner">Anuncio Recompensas / Banner Inferior</div>

        <div class="fixed-bottom">
            <button class="btn" onclick="window.location.href='/'">Volver al Menú Principal</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const cinematicOverlay = document.getElementById('cinematic-overlay');
        const cinematicTitle = document.getElementById('cinematic-title');
        const cinematicText = document.getElementById('cinematic-text');
        const cinematicBtn = document.getElementById('cinematic-btn');

        let stopGame = false;
        let pausedForCinematic = false;
        let isChapterEnd = false;
        let score = 0;
        let worldX = 0;
        let gameSpeed = 2.5;
        let frameCount = 0;

        const CW = canvas.width;
        const CH = canvas.height;
        const GROUND_Y = CH - 55; // Suelo un poco más alto

        let cat = {
            x: 60, // Gato un poco más a la izquierda
            y: GROUND_Y,
            width: 36,
            height: 30, // Gato un bloque detallado
            vx: 0,
            dy: 0,
            jumpForce: -10,
            gravity: 0.55,
            isGrounded: true,
            isCrouched: false,
            color: '#f97316' // Naranja
        };

        let enemies = [];
        let items = [];

        let keys = { left: false, right: false, jump: false, duck: false };

        let audioCtx = null;
        function playTone(freq1, freq2, duration, type, volume = 0.1) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq1, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(freq2, audioCtx.currentTime + duration);
                gain.gain.setValueAtTime(volume, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        function initGame() {
            stopGame = false;
            pausedForCinematic = false;
            isChapterEnd = false;
            score = 0;
            worldX = 0;
            frameCount = 0;
            enemies = [];
            items = [];
            cinematicOverlay.style.display = 'none';
            cat.x = 60;
            cat.y = GROUND_Y;
            cat.vx = 0;
            cat.dy = 0;
            cat.isGrounded = true;
            cat.isCrouched = false;
            loop();
        }

        // Gestión de Controles
        window.addEventListener('keydown', e => {
            if(e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
            if(e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
            if(e.code === 'ArrowUp' || e.code === 'Space' || e.code === 'KeyW') { keys.jump = true; triggerJump(); }
            if(e.code === 'ArrowDown' || e.code === 'KeyS') keys.duck = true;
        });

        window.addEventListener('keyup', e => {
            if(e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
            if(e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
            if(e.code === 'ArrowDown' || e.code === 'KeyS') keys.duck = false;
        });

        function bindTouch(id, keyName, isAction = false) {
            const el = document.getElementById(id);
            el.addEventListener('touchstart', e => {
                e.preventDefault();
                keys[keyName] = true;
                if(isAction) triggerJump();
            });
            el.addEventListener('touchend', e => {
                e.preventDefault();
                if(!isAction) keys[keyName] = false;
            });
            el.addEventListener('mousedown', e => {
                keys[keyName] = true;
                if(isAction) triggerJump();
            });
            el.addEventListener('mouseup', e => {
                if(!isAction) keys[keyName] = false;
            });
        }
