<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gatos: Destinos Cruzados - Edición Gótica Detallada</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            background-color: #0b070c;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Lienzo superior con el castillo gótico y gatos detallados */
        #gameCanvas {
            flex: 1;
            width: 100%;
            display: block;
        }

        /* Controles táctiles flotantes para mover al gato */
        .touch-controls {
            position: absolute;
            top: 15px;
            left: 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            z-index: 10;
        }

        .dpad-row {
            display: flex;
            gap: 5px;
            justify-content: center;
        }

        .control-btn {
            background: rgba(80, 20, 30, 0.8);
            border: 2px solid #d4af37;
            color: #fff;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.4);
        }

        .control-btn:active {
            background: #d4af37;
            color: #000;
        }

        /* Panel inferior con las ideas y opciones de la narrativa */
        .ui-panel {
            background: rgba(16, 12, 18, 0.98);
            border-top: 3px solid #d4af37;
            color: #e2d9c5;
            padding: 15px 20px;
            box-sizing: border-box;
            width: 100%;
            height: 46vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.95);
        }

        #story-title {
            color: #f3d56d;
            margin: 0;
            font-size: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 6px rgba(243, 213, 109, 0.5);
        }

        #story-text {
            font-size: 13px;
            line-height: 1.4;
            margin: 0;
            color: #c8bda9;
        }

        .stats-box {
            display: flex;
            gap: 15px;
            font-size: 11px;
            color: #f3d56d;
            border-bottom: 1px solid #3d2b1f;
            padding-bottom: 4px;
        }

        .choices-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: auto;
        }

        .action-button {
            background: rgba(60, 25, 35, 0.6);
            border: 1px solid #b8973e;
            color: #f1e4c3;
            padding: 10px 14px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 2px;
            text-align: left;
        }

        .action-button:hover {
            background: #7a2836;
            color: #ffffff;
            border-color: #ffd700;
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.7);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Lienzo superior con el castillo gótico y gatos detallados -->
        <canvas id="gameCanvas"></canvas>

        <!-- Controles Táctiles -->
        <div class="touch-controls">
            <div class="dpad-row">
                <button class="control-btn" onclick="game.move('UP')">⬆️</button>
            </div>
            <div class="dpad-row">
                <button class="control-btn" onclick="game.move('LEFT')">⬅️</button>
                <button class="control-btn" onclick="game.move('RIGHT')">➡️</button>
            </div>
            <div class="dpad-row">
                <button class="control-btn" onclick="game.move('DOWN')">⬇️</button>
            </div>
        </div>

        <!-- Panel Inferior: Ideas, Estado y Opciones -->
        <div class="ui-panel">
            <div class="stats-box">
                <span id="stat-rats">🐭 Ratones: 0</span>
                <span id="stat-birds">🐦 Palomas: 0</span>
                <span id="stat-status"> estado: En las Puertas del Castillo</span>
            </div>
            <h3 id="story-title">El Reino Olvidado: Destinos Cruzados</h3>
            <p id="story-text">
                Frente al imponente castillo gótico, los felinos buscan una salida. Selecciona un personaje para guiarlo por los dominios de piedra:
            </p>
            <div class="choices-container" id="button-group">
                <button class="action-button" onclick="game.selectCat('misi', 'Misi (El Gato Naranja)', '#e67e22')">🐱 Seleccionar a Misi (Ruta del Foso)</button>
                <button class="action-button" onclick="game.selectCat('luna', 'Luna (La Gata Blanca)', '#f3f4f6')">🐈‍⬛ Seleccionar a Luna (Ruta de las Torres)</button>
                <button class="action-button" onclick="game.selectCat('copito', 'Copito (El Gato Gris)', '#9ca3af')">🐈 Seleccionar a Copito (Ruta de los Arcos)</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight * 0.54;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let player = {
            x: canvas.width / 2,
            y: canvas.height - 75,
            name: 'Misi',
            color: '#e67e22',
            type: 'orange'
        };

        let gameState = { rats: 0, birds: 0 };

        const game = {
            selectCat: function(route, name, color) {
                player.name = name;
                player.color = color;
                player.x = 100;
                player.y = canvas.height - 75;

                const title = document.getElementById('story-title');
                const text = document.getElementById('story-text');
                const buttons = document.getElementById('button-group');

                if (route === 'misi') {
                    title.innerText = "Ruta de Misi: El Foso del Castillo";
                    text.innerText = "Misi explora los cimientos oscuros. ¡Usa las flechas para mover al gato detallado por el escenario!";
                    gameState.rats += 1;
                } else if (route === 'luna') {
                    title.innerText = "Ruta de Luna: Las Torres Góticas";
                    text.innerText = "Luna avanza hacia la torre alta. ¡Usa los controles para guiarla con precisión!";
                    gameState.birds += 2;
                } else if (route === 'copito') {
                    title.innerText = "Ruta de Copito: Los Balcones";
                    text.innerText = "Copito escala los muros de piedra. ¡Muévelo con los botones táctiles!";
                    gameState.rats += 1;
                    gameState.birds += 1;
                }

                document.getElementById('stat-rats').innerText = `🐭 Ratones: ${gameState.rats}`;
                document.getElementById('stat-birds').innerText = `🐦 Palomas: ${gameState.birds}`;
                document.getElementById('stat-status').innerText = ` estado: Explorando el Castillo`;

                buttons.innerHTML = `
                    <button class="action-button" onclick="game.crossDestinies()">⚡ Unir Destinos con los Hermanos</button>
                `;
            },

            move: function(dir) {
                const speed = 25;
                if (dir === 'LEFT') player.x -= speed;
                if (dir === 'RIGHT') player.x += speed;
                if (dir === 'UP') player.y -= speed;
                if (dir === 'DOWN') player.y += speed;

                if (player.x < 35) player.x = 35;
                if (player.x > canvas.width - 35) player.x = canvas.width - 35;
                if (player.y < 70) player.y = 70;
                if (player.y > canvas.height - 45) player.y = canvas.height - 45;
            },

            crossDestinies: function() {
                const title = document.getElementById('story-title');
                const text = document.getElementById('story-text');
                const buttons = document.getElementById('button-group');

                title.innerText = "¡Convergencia en el Castillo!";
                text.innerText = "¡Los tres felinos se reúnen en la gran sala del trono, descifrando el enigma del reino oscuro!";

                buttons.innerHTML = `
                    <button class="action-button" onclick="location.reload()">🔄 Reiniciar Aventura Gótica</button>
                `;
            }
        };

        // Función para dibujar un gato con forma real y detallada en el canvas
        function drawDetailedCat(x, y, color, name) {
            ctx.save();
            ctx.translate(x, y);

            // Cuerpo del gato (óvalo estilizado)
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.ellipse(0, 0, 22, 14, 0, 0, Math.PI * 2);
            ctx.fill();

            // Cabeza del gato
            ctx.beginPath();
            ctx.arc(14, -12, 12, 0, Math.PI * 2);
            ctx.fill();

            // Orejas puntiagudas características
            ctx.beginPath();
            ctx.moveTo(7, -20);
            ctx.lineTo(11, -32);
            ctx.lineTo(17, -21);
            ctx.moveTo(15, -20);
            ctx.lineTo(21, -30);
            ctx.lineTo(23, -19);
            ctx.fillStyle = color;
            ctx.fill();

            // Cola arqueada elegante típica de gato
            ctx.strokeStyle = color;
            ctx.lineWidth = 5;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(-18, -2);
            ctx.quadraticCurveTo(-32, -18, -25, -28);
            ctx.stroke();

            // Ojos brillantes felinos
            ctx.fillStyle = '#00ffcc';
            ctx.fillRect(16, -15, 3, 3);

            // Nombre flotante encima del gato
            ctx.fillStyle = '#fef3c7';
            ctx.font = '11px Courier New';
            ctx.textAlign = 'center';
            ctx.fillText(name, 0, -42);

            ctx.restore();
        }

        // Motor principal de renderizado del escenario gótico
        function drawScene() {
            let w = canvas.width;
            let h = canvas.height;

            // 1. Cielo crepuscular del castillo
            let skyGrad = ctx.createLinearGradient(0, 0, 0, h * 0.7);
            skyGrad.addColorStop(0, '#100b16');
            skyGrad.addColorStop(0.5, '#241b2f');
            skyGrad.addColorStop(1, '#422836');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, w, h);

            // Luna mística de fondo
            ctx.fillStyle = 'rgba(245, 230, 180, 0.2)';
            ctx.beginPath();
            ctx.arc(w * 0.75, h * 0.25, 45, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#fef3c7';
            ctx.beginPath();
            ctx.arc(w * 0.75, h * 0.25, 20, 0, Math.PI * 2);
            ctx.fill();

            // 2. Castillo gótico detallado al fondo (inspirado en tu foto bonita)
            ctx.fillStyle = '#16101d';
            let castleWidth = w * 0.55;
            let castleX = w * 0.22;
            let castleY = h * 0.28;

            ctx.fillRect(castleX, castleY + 30, castleWidth, h * 0.45);

            // Torres góticas con picos
            ctx.fillRect(castleX - 12, castleY - 10, 26, h * 0.48);
            ctx.beginPath();
            ctx.moveTo(castleX - 22, castleY - 10);
            ctx.lineTo(castleX + 1, castleY - 50);
            ctx.lineTo(castleX + 24, castleY - 10);
            ctx.fillStyle = '#100a16';
            ctx.fill();

            // Torre Central
            ctx.fillRect(castleX + castleWidth * 0.4, castleY - 35, 35, h * 0.52);
            ctx.beginPath();
            ctx.moveTo(castleX + castleWidth * 0.4 - 10, castleY - 35);
            ctx.lineTo(castleX + castleWidth * 0.4 + 17, castleY - 80);
            ctx.lineTo(castleX + castleWidth * 0.4 + 44, castleY - 35);
            ctx.fillStyle = '#0a060f';
            ctx.fill();

            // Ventanas encendidas en las torres
            ctx.fillStyle = '#f59e0b';
            ctx.fillRect(castleX + 5, castleY + 15, 5, 10);
            ctx.fillRect(castleX + castleWidth * 0.4 + 15, castleY - 10, 5, 12);

            // 3. Suelo de piedra del patio
            let groundY = h - 45;
            ctx.fillStyle = '#1c1412';
            ctx.fillRect(0, groundY, w, 45);
            ctx.strokeStyle = '#38251c';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, groundY);
            ctx.lineTo(w, groundY);
            ctx.stroke();

            // 4. DIBUJAR AL GATO DETALLADO EN EL ESCENARIO
            drawDetailedCat(player.x, player.y, player.color, player.name);

            requestAnimationFrame(drawScene);
        }

        drawScene();
    </script>
</body>
</html>
