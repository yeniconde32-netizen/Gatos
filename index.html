<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gatos: Destinos Cruzados - Biohazard Edition</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            background-color: #030303;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Lienzo gráfico de juego */
        #gameCanvas {
            flex: 1;
            width: 100%;
            display: block;
        }

        /* Controles táctiles flotantes estilo consola portátil (abajo en el canvas) */
        .touch-controls {
            position: absolute;
            bottom: calc(45vh + 10px); /* Justo arriba del panel de texto */
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            pointer-events: none; /* Permite clics solo en los botones */
        }

        .dpad-group, .action-group {
            pointer-events: auto;
            display: flex;
            gap: 10px;
        }

        .control-btn {
            background: rgba(139, 0, 0, 0.7);
            border: 2px solid #ff3333;
            color: #fff;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.6);
        }

        .control-btn:active {
            background: #ff0000;
        }

        /* Panel de Historia e Interfaz Inferior */
        .ui-panel {
            background: rgba(10, 10, 14, 0.97);
            border-top: 2px solid #8b0000;
            color: #d1d1d1;
            padding: 12px 18px;
            box-sizing: border-box;
            width: 100%;
            height: 45vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.95);
        }

        #story-title {
            color: #ff3333;
            margin: 0;
            font-size: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 6px rgba(255, 0, 0, 0.6);
        }

        #story-text {
            font-size: 13px;
            line-height: 1.4;
            margin: 0;
            color: #cccccc;
        }

        .stats-box {
            display: flex;
            gap: 15px;
            font-size: 11px;
            color: #ffb347;
            border-bottom: 1px solid #330000;
            padding-bottom: 4px;
        }

        .choices-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: auto;
        }

        .action-button {
            background: rgba(139, 0, 0, 0.25);
            border: 1px solid #b22222;
            color: #ff9999;
            padding: 9px 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 2px;
            text-align: left;
        }

        .action-button:hover {
            background: #8b0000;
            color: #ffffff;
            box-shadow: 0 0 12px rgba(255, 0, 0, 0.8);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Lienzo de Gráficos -->
        <canvas id="gameCanvas"></canvas>

        <!-- Controles flotantes sobre el juego -->
        <div class="touch-controls">
            <div class="dpad-group">
                <button class="control-btn" onclick="game.moveCat('LEFT')">⬅️</button>
                <button class="control-btn" onclick="game.moveCat('RIGHT')">➡️</button>
            </div>
            <div class="action-group">
                <button class="control-btn" onclick="game.actionAlert()" style="border-color: #ffcc00; color: #ffcc00;" title="Acción">☣️</button>
            </div>
        </div>

        <!-- Panel de Historia e Interfaz -->
        <div class="ui-panel">
            <div class="stats-box">
                <span id="stat-rats">🐭 Ratones: 0</span>
                <span id="stat-birds">🐦 Palomas: 0</span>
                <span id="stat-status"> estado: En Espera</span>
            </div>
            <h3 id="story-title">Prólogo: La Caída de las Tierras Bajas</h3>
            <p id="story-text">
                Una densa niebla tóxica desciende sobre el páramo. Tres felinos intentan sobrevivir en campañas independientes, pero sus destinos están entrelazados. Selecciona tu personaje para comenzar:
            </p>
            <div class="choices-container" id="button-group">
                <button class="action-button" onclick="game.startCampaign('misi')">🐱 Campaña de Misi (Enemigo: Perro Mutante)</button>
                <button class="action-button" onclick="game.startCampaign('luna')">🐈‍⬛ Campaña de Luna (Enemigo: Gato Infectado)</button>
                <button class="action-button" onclick="game.startCampaign('copito')">🐈 Campaña de Copito (Enemigo: Cazador Humano)</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight * 0.55;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let gameData = {
            rats: 0,
            birds: 0,
            catX: canvas.width / 4,
            catY: 0,
            catName: 'Misi',
            catColor: '#ffa500',
            enemyX: canvas.width * 0.75,
            enemyType: 'Perro Mutante',
            enemyColor: '#8b0000',
            stage: 'intro'
        };

        const game = {
            startCampaign: function(cat) {
                const title = document.getElementById('story-title');
                const text = document.getElementById('story-text');
                const buttons = document.getElementById('button-group');

                if (cat === 'misi') {
                    gameData.catName = 'Misi';
                    gameData.catColor = '#ffaa00';
                    gameData.enemyType = '🐶 Perro Mutante';
                    gameData.enemyColor = '#a00000';
                    title.innerText = "Campaña de Misi: Los Canales";
                    text.innerText = "Misi avanza con sigilo entre las tuberías. Un perro mutante bloquea la salida del canal de drenaje.";
                    gameData.rats += 1;
                } else if (cat === 'luna') {
                    gameData.catName = 'Luna';
                    gameData.catColor = '#444444';
                    gameData.enemyType = '🐱 Gato Infectado';
                    gameData.enemyColor = '#551a8b';
                    title.innerText = "Campaña de Luna: El Bosque";
                    text.innerText = "Luna se adentra en la bruma. Un gato infectado por la toxina la acecha desde la maleza.";
                    gameData.birds += 2;
                } else if (cat === 'copito') {
                    gameData.catName = 'Copito';
                    gameData.catColor = '#eeeeee';
                    gameData.enemyType = '👤 Cazador Humano';
                    gameData.enemyColor = '#4682b4';
                    title.innerText = "Campaña de Copito: Las Ruinas";
                    text.innerText = "Copito trepa por los andamios metálicos. Un cazador con linterna patrulla la zona inferior.";
                    gameData.rats += 1;
                    gameData.birds += 1;
                }

                document.getElementById('stat-rats').innerText = `🐭 Ratones: ${gameData.rats}`;
                document.getElementById('stat-birds').innerText = `🐦 Palomas: ${gameData.birds}`;
                document.getElementById('stat-status').innerText = ` estado: En Marcha`;

                buttons.innerHTML = `
                    <button class="action-button" onclick="game.triggerCrossEvent()">⚡ Ejecutar Acción / Cruzar Rutas</button>
                `;
            },

            moveCat: function(dir) {
                if (dir === 'LEFT') gameData.catX -= 30;
                if (dir === 'RIGHT') gameData.catX += 30;
                if (gameData.catX < 30) gameData.catX = 30;
                if (gameData.catX > canvas.width - 50) gameData.catX = canvas.width - 50;
            },

            actionAlert: function() {
                document.getElementById('story-text').innerText = `⚠️ ¡Alerta! ${gameData.catName} detecta cercanía de ${gameData.enemyType}. ¡Muévete con las flechas para esquivar!`;
            },

            triggerCrossEvent: function() {
                const title = document.getElementById('story-title');
                const text = document.getElementById('story-text');
                const buttons = document.getElementById('button-group');

                title.innerText = "¡Cruce de Destinos (Resident Evil Style)!";
                text.innerText = `¡Las rutas colisionan! ${gameData.catName} esquiva a ${gameData.enemyType} gracias a una distracción de sus hermanos en el sector contiguo. ¡Se abre un acceso oculto!`;
                gameData.enemyColor = '#228b22'; // Se vuelve verde (superado)

                buttons.innerHTML = `
                    <button class="action-button" onclick="location.reload()">🔄 Reiniciar Campañas</button>
                `;
            }
        };

        // Renderizado gráfico avanzado en Canvas
        function drawScene() {
            // Fondo con degradado tétrico y atmósfera
            let bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            bgGrad.addColorStop(0, '#050508');
            bgGrad.addColorStop(1, '#120505');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Líneas de ambiente / rejilla industrial en el fondo
            ctx.strokeStyle = 'rgba(139, 0, 0, 0.15)';
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 40) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height - 35);
                ctx.stroke();
            }

            // Suelo del escenario con textura metálica/oscura
            ctx.fillStyle = '#0f0f14';
            ctx.fillRect(0, canvas.height - 35, canvas.width, 35);
            ctx.strokeStyle = '#ff3333';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, canvas.height - 35);
            ctx.lineTo(canvas.width, canvas.height - 35);
            ctx.stroke();

            let groundY = canvas.height - 35;

            // --- DIBUJAR GATITO PROTAGONISTA ---
            ctx.fillStyle = gameData.catColor;
            ctx.beginPath();
            ctx.arc(gameData.catX, groundY - 30, 20, 0, Math.PI * 2); // Cuerpo
            ctx.fill();
            
            // Orejas del gato
            ctx.beginPath();
            ctx.moveTo(gameData.catX - 14, groundY - 42);
            ctx.lineTo(gameData.catX - 7, groundY - 60);
            ctx.lineTo(gameData.catX, groundY - 42);
            ctx.moveTo(gameData.catX, groundY - 42);
            ctx.lineTo(gameData.catX + 7, groundY - 60);
            ctx.lineTo(gameData.catX + 14, groundY - 42);
            ctx.fillStyle = gameData.catColor;
            ctx.fill();

            // Ojos brillosos del gato (estilo felino en la oscuridad)
            ctx.fillStyle = '#00ffcc';
            ctx.fillRect(gameData.catX - 8, groundY - 35, 4, 4);
            ctx.fillRect(gameData.catX + 4, groundY - 35, 4, 4);

            // Nombre del gato
            ctx.fillStyle = '#ffffff';
            ctx.font = '12px Courier New';
            ctx.fillText(gameData.catName, gameData.catX - 18, groundY - 70);

            // --- DIBUJAR ENEMIGO ---
            ctx.fillStyle = gameData.enemyColor;
            ctx.fillRect(gameData.enemyX, groundY - 50, 45, 50);
            
            // Detalles del enemigo (ojos rojos amenazantes)
            ctx.fillStyle = '#ffff00';
            ctx.fillRect(gameData.enemyX + 10, groundY - 40, 6, 6);
            ctx.fillRect(gameData.enemyX + 28, groundY - 40, 6, 6);

            // Nombre del enemigo
            ctx.fillStyle = '#ff6666';
            ctx.font = '11px Courier New';
            ctx.fillText(gameData.enemyType, gameData.enemyX - 15, groundY - 60);

            requestAnimationFrame(drawScene);
        }

        drawScene();
    </script>
</body>
</html>
