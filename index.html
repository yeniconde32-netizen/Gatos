<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gatitos en Fuga: Capítulo 1 - La Huida del Callejón</title>
    <style>
        body {
            background-color: #0d1117;
            color: #ffffff;
            font-family: 'Georgia', serif;
            text-align: center;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 420px;
            height: 100vh;
            padding-top: 60px;
            padding-bottom: 70px;
        }

        #game-container {
            position: relative;
            width: 95%;
            height: 72vh;
            max-height: 420px;
            background: linear-gradient(to bottom, #0f172a, #1e293b);
            border: 3px solid #ea580c;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }

        .hud {
            position: absolute;
            top: 8px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            font-weight: bold;
            color: #fde68a;
            text-shadow: 2px 2px #000;
            z-index: 10;
            pointer-events: none;
        }

        .ad-banner {
            width: 100%;
            max-width: 400px;
            height: 50px;
            background-color: #161e2e;
            border: 1px dashed #ea580c;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #a3a3a3;
            font-size: 11px;
            margin: 6px 0;
            border-radius: 6px;
        }

        .fixed-bottom {
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 380px;
            z-index: 100;
        }

        .btn {
            background-color: #ea580c;
            color: #111827;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .btn:active { background-color: #c2410c; transform: translateY(2px); }

        /* Pantalla Cinemática / Diálogo */
        #cinematic-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 10, 0.94);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 30;
            padding: 25px;
            box-sizing: border-box;
        }
        #cinematic-box {
            border: 2px solid #ea580c;
            padding: 20px;
            background: rgba(234, 88, 12, 0.08);
            border-radius: 8px;
            max-width: 350px;
        }
        #cinematic-title {
            color: #f87171;
            font-size: 20px;
            margin-top: 0;
            margin-bottom: 10px;
        }
        #cinematic-text {
            color: #e5e7eb;
            font-size: 15px;
            line-height: 1.4;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="ad-banner" style="position: fixed; top: 5px;">Anuncio Superior / Monetag</div>

    <div id="game-wrapper">
        <div id="game-container">
            <div class="hud">
                <span id="score-txt">Puntos: 0</span>
                <span id="chapter-txt">Cap 1: Huida</span>
            </div>
            <canvas id="gameCanvas" width="400" height="300"></canvas>

            <div id="cinematic-overlay">
                <div id="cinematic-box">
                    <h3 id="cinematic-title">ENCUENTRO</h3>
                    <p id="cinematic-text">Mensaje cinemático...</p>
                    <button class="btn" id="cinematic-btn" onclick="handleCinematicAction()">Continuar</button>
                </div>
            </div>
        </div>
        <div class="ad-banner">Anuncio Recompensas / Banner Inferior</div>
    </div>

    <div class="fixed-bottom">
        <button class="btn" onclick="window.location.href='/'">Volver al Menú de Campañas</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const cinematicOverlay = document.getElementById('cinematic-overlay');
        const cinematicTitle = document.getElementById('cinematic-title');
        const cinematicText = document.getElementById('cinematic-text');
        const cinematicBtn = document.getElementById('cinematic-btn');

        let stopGame = false;
        let pausedForCinematic = false;
        let isChapterEnd = false;
        let score = 0;
        let gameSpeed = 3.5;
        let frameCount = 0;

        const CW = canvas.width;
        const CH = canvas.height;
        const GROUND_Y = CH - 60;

        let cat = {
            x: 50,
            y: GROUND_Y,
            width: 38,
            height: 30,
            dy: 0,
            jumpForce: -11,
            gravity: 0.6,
            isGrounded: true
        };

        let enemies = [];
        let items = [];

        let audioCtx = null;
        function playTone(freq1, freq2, duration, type) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq1, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(freq2, audioCtx.currentTime + duration);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        function initGame() {
            stopGame = false;
            pausedForCinematic = false;
            isChapterEnd = false;
            score = 0;
            gameSpeed = 3.5;
            frameCount = 0;
            enemies = [];
            items = [];
            cinematicOverlay.style.display = 'none';
            cat.y = GROUND_Y;
            cat.isGrounded = true;
            loop();
        }

        window.addEventListener('keydown', e => { if(e.code === 'Space') makeJump(); });
        canvas.addEventListener('touchstart', e => { e.preventDefault(); makeJump(); });

        function makeJump() {
            if (stopGame || pausedForCinematic) return;
            if (cat.isGrounded) {
                cat.dy = cat.jumpForce;
                cat.isGrounded = false;
                playTone(150, 400, 0.15, 'square');
            }
        }

        const enemyEncounters = [
            { name: "Cuervo Hostil", color: "#111827", heightBonus: -32, dialogue: "El cuervo despliega sus alas negras y te mira fijamente... (Silencio tenso)" },
            { name: "Rata de Cloaca", color: "#166534", heightBonus: 0, dialogue: "La rata mutante muestra sus colmillos y emite un chillido seco que te detiene..." }
        ];

        function update() {
            if (stopGame || pausedForCinematic) return;
            frameCount++;
            score += Math.floor(gameSpeed / 3);

            if (frameCount % 400 === 0) gameSpeed += 0.3;

            // META DEL CAPÍTULO 1: 1500 PUNTOS
            if (score >= 1500) {
                triggerChapterComplete();
                return;
            }

            document.getElementById('score-txt').innerText = `Puntos: ${score}`;

            cat.dy += cat.gravity;
            cat.y += cat.dy;
            if (cat.y >= GROUND_Y) {
                cat.y = GROUND_Y;
                cat.dy = 0;
                cat.isGrounded = true;
            }

            let spawnRate = score < 600 ? 100 : 75;
            if (frameCount % spawnRate === 0) {
                let typeIdx = score < 600 ? 0 : (Math.random() > 0.4 ? 1 : 0);
                let enemyData = enemyEncounters[typeIdx];
                enemies.push({
                    x: CW,
                    y: GROUND_Y + 4 + enemyData.heightBonus,
                    width: 40,
                    height: 24 - enemyData.heightBonus,
                    data: enemyData
                });
            }

            if (frameCount % 130 === 0) {
                items.push({ x: CW, y: GROUND_Y + 5, width: 22, height: 14 });
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                e.x -= gameSpeed;

                if (
                    cat.x < e.x + e.width &&
                    cat.x + cat.width > e.x &&
                    cat.y < e.y + e.height &&
                    cat.y + cat.height > e.y
                ) {
                    triggerCinematicEncounter(e);
                    return;
                }

                if (e.x + e.width < 0) enemies.splice(i, 1);
            }

            for (let i = items.length - 1; i >= 0; i--) {
                let itm = items[i];
                itm.x -= gameSpeed;
                if (
                    cat.x < itm.x + itm.width &&
                    cat.x + cat.width > itm.x &&
                    cat.y < itm.y + itm.height &&
                    cat.y + cat.height > itm.y
                ) {
                    score += 80;
                    playTone(600, 1100, 0.05, 'sine');
                    items.splice(i, 1);
                } else if (itm.x + itm.width < 0) items.splice(i, 1);
            }
        }

        function triggerCinematicEncounter(enemy) {
            pausedForCinematic = true;
            stopGame = true;
            playTone(100, 30, 0.8, 'sawtooth');

            isChapterEnd = false;
            cinematicTitle.innerText = "ENCUENTRO CERCANO";
            cinematicText.innerText = enemy.data.dialogue;
            cinematicBtn.innerText = "Reintentar Huida";
            cinematicOverlay.style.display = 'flex';
        }

        function triggerChapterComplete() {
            stopGame = true;
            pausedForCinematic = true;
            isChapterEnd = true;
            playTone(300, 900, 0.5, 'triangle');

            cinematicTitle.innerText = "¡CAPÍTULO 1 SUPERADO!";
            cinematicText.innerText = "Has atravesado los tejados oscuros esquivando los peligros. El sonido de la ciudad cambia a lo lejos... Te acercas al mercado central.";
            cinematicBtn.innerText = "Ir al Menú Principal";
            cinematicOverlay.style.display = 'flex';
        }

        function handleCinematicAction() {
            if (isChapterEnd) {
                window.location.href = '/';
            } else {
                initGame();
            }
        }

        function draw() {
            // Fondo urbano nocturno
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, CW, CH);

            // Siluetas de edificios de fondo
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(30, 70, 50, CH - 130);
            ctx.fillRect(110, 40, 65, CH - 100);
            ctx.fillRect(200, 85, 45, CH - 145);
            ctx.fillRect(280, 50, 70, CH - 110);

            // Suelo del Tejado
            ctx.fillStyle = '#7f1d1d';
            ctx.fillRect(0, GROUND_Y + cat.height, CW, CH - GROUND_Y);

            // Dibujar Gato Detallado (Bloque Naranja con orejas y cola)
            ctx.fillStyle = '#f59e0b';
            ctx.fillRect(cat.x, cat.y + 4, cat.width - 6, cat.height - 4);
            // Cabeza
            ctx.fillRect(cat.x + cat.width - 16, cat.y - 4, 16, 14);
            // Orejas
            ctx.fillStyle = '#d97706';
            ctx.fillRect(cat.x + cat.width - 14, cat.y - 8, 4, 5);
            ctx.fillRect(cat.x + cat.width - 6, cat.y - 8, 4, 5);
            // Cola
            ctx.strokeStyle = '#f59e0b';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(cat.x, cat.y + 12);
            ctx.quadraticCurveTo(cat.x - 10, cat.y - 4, cat.x - 6, cat.y - 10);
            ctx.stroke();

            // Dibujar Enemigos (Bloques agresivos)
            for (let e of enemies) {
                ctx.fillStyle = e.data.color;
                ctx.fillRect(e.x, e.y, e.width, e.height);
                // Ojos amenazantes del enemigo
                ctx.fillStyle = '#ef4444';
                ctx.fillRect(e.x + 6, e.y + 6, 4, 4);
            }

            // Dibujar Pescados (Ítems)
            for (let itm of items) {
                ctx.fillStyle = '#38bdf8'; // Azul brillante
                ctx.fillRect(itm.x, itm.y + 4, 14, 8);
                // Cola del pescado
                ctx.beginPath();
                ctx.moveTo(itm.x + 14, itm.y + 4);
                ctx.lineTo(itm.x + 20, itm.y);
                ctx.lineTo(itm.x + 20, itm.y + 12);
                ctx.fill();
            }
        }

        function loop() {
            if (stopGame) return;
            update();
            draw();
            requestAnimationFrame(loop);
        }

        initGame();
    </script>
</body>
</html>
