<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gatos: Destinos Cruzados y Rescate Estelar</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            background-color: #0b0d14;
        }

        #game-screen {
            width: 100vw;
            height: 100vh;
            /* IMAGEN DE PRUEBA EN LÍNEA TEMPORAL */
            background-image: url('https://images.unsplash.com/photo-1509316975850-ff9c5deb0cd9?q=80&w=1000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .visual-viewport {
            flex: 1;
            width: 100%;
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 15px;
            box-sizing: border-box;
        }

        .virtual-dpad {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
            padding: 8px;
            border-radius: 50%;
            border: 1px solid rgba(0, 255, 255, 0.3);
            backdrop-filter: blur(2px);
        }

        .dpad-row {
            display: flex;
            gap: 15px;
        }

        .control-btn {
            background: rgba(255, 140, 0, 0.3);
            border: 2px solid #ff8c00;
            color: #fff;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 8px rgba(255, 140, 0, 0.5);
        }

        .control-btn:active {
            background: #ff8c00;
        }

        .ui-panel {
            background: rgba(11, 13, 20, 0.88);
            border-top: 2px solid #00ffff;
            color: #e0e0e0;
            padding: 15px 20px;
            box-sizing: border-box;
            width: 100%;
            max-height: 50vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.9);
            backdrop-filter: blur(4px);
        }

        #story-title {
            color: #00ffff;
            margin: 0;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #story-text {
            font-size: 14px;
            line-height: 1.4;
            margin: 0;
            text-shadow: 0 0 5px rgba(0, 255, 255, 0.3);
        }

        .stats-box {
            display: flex;
            gap: 15px;
            font-size: 12px;
            color: #ffb347;
            border-bottom: 1px solid #1f4068;
            padding-bottom: 4px;
        }

        .choices-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .action-button {
            background: rgba(255, 140, 0, 0.15);
            border: 1px solid #ff8c00;
            color: #ffb347;
            padding: 10px 14px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 4px;
            text-align: left;
        }

        .action-button:hover {
            background: #ff8c00;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(255, 140, 0, 0.8);
        }
    </style>
</head>
<body>

    <div id="game-screen">
        <div class="visual-viewport">
            <div class="virtual-dpad">
                <button class="control-btn" onclick="gameRoute.handleControl('UP')">⬆️</button>
                <div class="dpad-row">
                    <button class="control-btn" onclick="gameRoute.handleControl('LEFT')">⬅️</button>
                    <button class="control-btn" onclick="gameRoute.handleControl('RIGHT')">➡️</button>
                </div>
                <button class="control-btn" onclick="gameRoute.handleControl('DOWN')">⬇️</button>
            </div>
            <div>
                <button class="control-btn" onclick="gameRoute.handleControl('ACTION')" style="border-color: #00ffff; color: #00ffff; background: rgba(0,255,255,0.2);">🅰️</button>
            </div>
        </div>

        <div class="ui-panel">
            <div class="stats-box">
                <span id="stat-rats">🐭 Ratones: 0</span>
                <span id="stat-birds">🐦 Palomas: 0</span>
            </div>
            <h3 id="story-title">Capítulo 1: La Gran Inundación</h3>
            <p id="story-text">
                Una marea de agua tóxica comienza a cubrir las tierras bajas. Los perros salvajes acechan. Usa los botones táctiles o elige una ruta abajo para avanzar.
            </p>
            <div class="choices-container" id="button-group">
                <button class="action-button" onclick="gameRoute.startRoute('orilla')">🐱 Ruta de Misi: Canales de agua y jaulas</button>
                <button class="action-button" onclick="gameRoute.startRoute('bosque')">🐈‍⬛ Ruta de Luna: Bosque de cristal y perros</button>
                <button class="action-button" onclick="gameRoute.startRoute('ruinas')">🐈 Ruta de Copito: Andamios y los cazadores</button>
            </div>
        </div>
    </div>

    <script>
        let gameState = { rats: 0, birds: 0 };

        const gameRoute = {
            updateStats: function() {
                document.getElementById('stat-rats').innerText = `🐭 Ratones: ${gameState.rats}`;
                document.getElementById('stat-birds').innerText = `🐦 Palomas: ${gameState.birds}`;
            },

            handleControl: function(direction) {
                const text = document.getElementById('story-text');
                if (direction === 'UP') text.innerText = "¡El gatito trepa a la cornisa alta con agilidad!";
                if (direction === 'DOWN') text.innerText = "¡El gatito se agacha sigiloso entre las sombras!";
                if (direction === 'LEFT') text.innerText = "¡Mirando hacia el sector oeste del terreno!";
                if (direction === 'RIGHT') text.innerText = "¡Avanzando hacia el este explorando el camino!";
                if (direction === 'ACTION') text.innerText = "✨ ¡Acción ejecutada! El entorno reacciona a tu presencia.";
            },

            startRoute: function(route) {
                const title = document.getElementById('story-title');
                const text = document.getElementById('story-text');
                const buttons = document.getElementById('button-group');

                if (route === 'orilla') {
                    title.innerText = "Ruta de Misi: Canales Inundados";
                    text.innerText = "Misi avanza por los tubos. Ve palomas atrapadas en una red.";
                    gameState.birds += 2;
                    this.updateStats();
                    buttons.innerHTML = `<button class="action-button" onclick="gameRoute.action()">⚡ Liberar a las palomitas</button>`;
                } else if (route === 'bosque') {
                    title.innerText = "Ruta de Luna: Bosque de Cristal";
                    text.innerText = "Luna esquiva perros salvajes cerca de los cristales luminosos.";
                    gameState.rats += 3;
                    this.updateStats();
                    buttons.innerHTML = `<button class="action-button" onclick="gameRoute.action()">⚡ Salvar a los ratoncitos</button>`;
                } else if (route === 'ruinas') {
                    title.innerText = "Ruta de Copito: Andamios";
                    text.innerText = "Copito vigila a los cazadores desde arriba.";
                    gameState.rats += 1;
                    gameState.birds += 1;
                    this.updateStats();
                    buttons.innerHTML = `<button class="action-button" onclick="gameRoute.action()">⚡ Abrir la jaula secreta</button>`;
                }
            },

            action: function() {
                document.getElementById('story-title').innerText = "¡Cruce de Caminos!";
                document.getElementById('story-text').innerText = "¡Has rescatado a los animales y te has cruzado de paso con tus hermanos!";
                document.getElementById('button-group').innerHTML = `<button class="action-button" onclick="location.reload()">🔄 Reiniciar Aventura</button>`;
            }
        };
    </script>
</body>
</html>
