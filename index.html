<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gatos: Destinos Cruzados</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            background-color: #0b0705;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Lienzo superior con la atmósfera de la ilustración */
        #gameCanvas {
            flex: 1;
            width: 100%;
            display: block;
        }

        /* Panel inferior con las ideas y opciones de la narrativa */
        .ui-panel {
            background: rgba(15, 10, 8, 0.98);
            border-top: 3px solid #8b3a2b;
            color: #d1c2b4;
            padding: 15px 20px;
            box-sizing: border-box;
            width: 100%;
            height: 48vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.95);
        }

        #story-title {
            color: #d9534f;
            margin: 0;
            font-size: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 5px rgba(217, 83, 79, 0.5);
        }

        #story-text {
            font-size: 13px;
            line-height: 1.4;
            margin: 0;
            color: #c5b5a5;
        }

        .stats-box {
            display: flex;
            gap: 15px;
            font-size: 11px;
            color: #e6b800;
            border-bottom: 1px solid #3d2218;
            padding-bottom: 5px;
        }

        .choices-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: auto;
        }

        .action-button {
            background: rgba(139, 58, 43, 0.3);
            border: 1px solid #a64d37;
            color: #ffcccc;
            padding: 10px 14px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 2px;
            text-align: left;
        }

        .action-button:hover {
            background: #8b3a2b;
            color: #ffffff;
            box-shadow: 0 0 10px rgba(139, 58, 43, 0.8);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Lienzo con la escena de los 3 gatos y el entorno estilo ilustración oscura -->
        <canvas id="gameCanvas"></canvas>

        <!-- Panel Inferior Estilo Novela Visual Oscura -->
        <div class="ui-panel">
            <div class="stats-box">
                <span id="stat-rats">🐭 Ratones: 0</span>
                <span id="stat-birds">🐦 Palomas: 0</span>
                <span id="stat-status"> estado: Destinos Entrelazados</span>
            </div>
            <h3 id="story-title">Cruzarán Destinos: La Tempestad</h3>
            <p id="story-text">
                Bajo un cielo de nubes cargadas y fábricas en ruinas, los tres felinos se separan frente a la marea tóxica. Cada uno tomará una ruta letal llena de peligros. Elige por dónde comenzar la travesía:
            </p>
            <div class="choices-container" id="button-group">
                <button class="action-button" onclick="game.startRoute('misi')">🐱 Ruta de Misi: Canales de agua y el perro en la sombra</button>
                <button class="action-button" onclick="game.startRoute('luna')">🐈‍⬛ Ruta de Luna: El bosque de la luz cenital</button>
                <button class="action-button" onclick="game.startRoute('copito')">🐈 Ruta de Copito: Andamios de hierro y la torre</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight * 0.52;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let gameState = { rats: 0, birds: 0, activeCat: 'ninguno' };

        const game = {
            startRoute: function(route) {
                const title = document.getElementById('story-title');
                const text = document.getElementById('story-text');
                const buttons = document.getElementById('button-group');

                if (route === 'misi') {
                    gameState.activeCat = 'misi';
                    gameState.rats += 1;
                    title.innerText = "Ruta de Misi: Canales Inundados";
                    text.innerText = "Misi avanza junto al muro industrial. Un perro hambriento acecha en el agua turbia mientras las tuberías vierten residuos tóxicos.";
                } else if (route === 'luna') {
                    gameState.activeCat = 'luna';
                    gameState.birds += 2;
                    title.innerText = "Ruta de Luna: El Bosque Oscuro";
                    text.innerText = "Luna se detiene bajo un haz de luz místico que cruza entre los árboles retorcidos y sin hojas, buscando refugio seguro.";
                } else if (route === 'copito') {
                    gameState.activeCat = 'copito';
                    gameState.rats += 1;
                    gameState.birds += 1;
                    title.innerText = "Ruta de Copito: Andamios Metálicos";
                    text.innerText = "Copito trepa por la estructura de hierro oxidado. Desde lo alto vigila el horizonte industrial y a sus compañeros.";
                }

                document.getElementById('stat-rats').innerText = `🐭 Ratones: ${gameState.rats}`;
                document.getElementById('stat-birds').innerText = `🐦 Palomas: ${gameState.birds}`;

                buttons.innerHTML = `
                    <button class="action-button" onclick="game.triggerCross()">⚡ Cruzar rutas e interactuar con los hermanos</button>
                `;
            },

            triggerCross: function() {
                const title = document.getElementById('story-title');
                const text = document.getElementById('story-text');
                const buttons = document.getElementById('button-group');

                title.innerText = "¡Convergencia de Destinos!";
                text.innerText = "¡Los caminos se cruzan! Las acciones de Misi, Luna y Copito resuenan juntas en la tormenta, despistando a las amenazas y uniendo fuerzas para sobrevivir.";

                buttons.innerHTML = `
                    <button class="action-button" onclick="location.reload()">🔄 Reiniciar Aventura</button>
                `;
            }
        };

        // Dibujar el arte estilo ilustración oscura (inspirado en la imagen de referencia)
        function drawIllustration() {
            let w = canvas.width;
            let h = canvas.height;

            // 1. Cielo dramático con nubes oscuras y tono vintage
            let skyGrad = ctx.createLinearGradient(0, 0, 0, h * 0.6);
            skyGrad.addColorStop(0, '#151b22');
            skyGrad.addColorStop(0.5, '#282b30');
            skyGrad.addColorStop(1, '#3b2f2f');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, w, h);

            // Haz de luz cenital (como en la ilustración)
            let lightBeam = ctx.createLinearGradient(w * 0.45, 0, w * 0.65, h);
            lightBeam.addColorStop(0, 'rgba(240, 230, 200, 0.25)');
            lightBeam.addColorStop(1, 'rgba(240, 230, 200, 0.0)');
            ctx.fillStyle = lightBeam;
            ctx.beginPath();
            ctx.moveTo(w * 0.42, 0);
            ctx.lineTo(w * 0.58, 0);
            ctx.lineTo(w * 0.72, h);
            ctx.lineTo(w * 0.45, h);
            ctx.fill();

            // 2. Fábricas y ciudad industrial al fondo (izquierda)
            ctx.fillStyle = '#111317';
            ctx.fillRect(20, h * 0.35, w * 0.35, h * 0.4);
            // Chimeneas y engranajes dibujados rústicos
            ctx.fillStyle = '#1c2026';
            ctx.fillRect(40, h * 0.2, 12, h * 0.18);
            ctx.fillRect(70, h * 0.25, 15, h * 0.13);

            // 3. Bosque de árboles secos y retorcidos (derecha)
            ctx.strokeStyle = '#181412';
            ctx.lineWidth = 4;
            let treeX = w * 0.75;
            while(treeX < w) {
                ctx.beginPath();
                ctx.moveTo(treeX, h * 0.75);
                ctx.lineTo(treeX + 10, h * 0.4);
                ctx.lineTo(treeX - 5, h * 0.25);
                ctx.stroke();
                treeX += 45;
            }

            // 4. Suelo / Río / Canales
            ctx.fillStyle = '#1f1612';
            ctx.fillRect(0, h * 0.7, w, h * 0.3);
            
            // Líneas del agua del canal
            ctx.strokeStyle = '#3a271f';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, h * 0.8);
            ctx.lineTo(w, h * 0.8);
            ctx.moveTo(0, h * 0.9);
            ctx.lineTo(w, h * 0.9);
            ctx.stroke();

            // 5. El Perro en la esquina inferior izquierda (en la sombra del canal)
            ctx.fillStyle = '#2b1a12';
            ctx.fillRect(w * 0.15, h * 0.78, 30, 16);
            ctx.beginPath();
            ctx.arc(w * 0.15 + 8, h * 0.78, 8, 0, Math.PI * 2); // Cabeza perro
            ctx.fill();

            // 6. LOS TRES GATOS EN EL ESCENARIO (como en la ilustración)
            // Gato Naranja (Izquierda - Misi)
            ctx.fillStyle = (gameState.activeCat === 'misi') ? '#ffaa00' : '#d97706';
            ctx.beginPath();
            ctx.arc(w * 0.38, h * 0.65, 15, 0, Math.PI * 2); // Cuerpo
            ctx.fill();
            ctx.fillRect(w * 0.36, h * 0.68, 6, 20); // Cola levantada

            // Gato Blanco (Centro - Luna)
            ctx.fillStyle = (gameState.activeCat === 'luna') ? '#ffffff' : '#d1d5db';
            ctx.beginPath();
            ctx.arc(w * 0.52, h * 0.62, 14, 0, Math.PI * 2);
            ctx.fill();

            // Gato Gris / Manchado (Derecha - Copito sobre andamios)
            ctx.fillStyle = (gameState.activeCat === 'copito') ? '#9ca3af' : '#6b7280';
            ctx.beginPath();
            ctx.arc(w * 0.68, h * 0.68, 14, 0, Math.PI * 2);
            ctx.fill();

            // Andamios de madera/metal bajo el gato gris
            ctx.strokeStyle = '#4a2e18';
            ctx.lineWidth = 3;
            ctx.strokeRect(w * 0.62, h * 0.72, w * 0.2, h * 0.05);

            requestAnimationFrame(drawIllustration);
        }

        drawIllustration();
    </script>
</body>
</html>
