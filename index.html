<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gatos: Destinos Cruzados - Edición Definitiva</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            background-color: #0b0610;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        #scene-container {
            flex: 1;
            width: 100%;
            position: relative;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: background-image 0.6s ease-in-out;
        }

        #scene-container::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 3, 8, 0.45);
            pointer-events: none;
        }

        #gameCanvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* Controles Táctiles estilo D-Pad */
        .touch-controls {
            position: absolute;
            top: 15px;
            left: 15px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            z-index: 10;
        }

        .dpad-row {
            display: flex;
            gap: 4px;
            justify-content: center;
        }

        .control-btn {
            background: rgba(40, 20, 50, 0.85);
            border: 2px solid #f3d56d;
            color: #fff;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 10px rgba(243, 213, 109, 0.4);
            user-select: none;
            -webkit-touch-callout: none;
        }

        .control-btn.active {
            background: #f3d56d !important;
            color: #000 !important;
            transform: scale(0.9);
        }

        /* Panel de Acciones HUD Superior Derecho */
        .action-panel-hud {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 10;
        }

        .action-hud-btn {
            background: rgba(120, 20, 20, 0.85);
            border: 2px solid #ff4444;
            color: #fff;
            padding: 6px 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 10px;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(255, 68, 68, 0.5);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .action-hud-btn:active {
            background: #ff2222;
        }

        /* Panel de Historia y Opciones Inferior */
        .ui-panel {
            background: rgba(14, 10, 18, 0.98);
            border-top: 3px solid #f3d56d;
            color: #e2d9c5;
            padding: 12px 18px;
            box-sizing: border-box;
            width: 100%;
            height: 45vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.9);
            z-index: 5;
        }

        #story-title {
            color: #f3d56d;
            margin: 0;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #story-text {
            font-size: 11px;
            line-height: 1.4;
            margin: 0;
            color: #c8bda9;
        }

        .stats-box {
            display: flex;
            gap: 12px;
            font-size: 10px;
            color: #f3d56d;
            border-bottom: 1px solid #3d2b1f;
            padding-bottom: 4px;
            flex-wrap: wrap;
        }

        .choices-container {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-top: auto;
        }

        .action-button {
            background: rgba(50, 25, 45, 0.7);
            border: 1px solid #c8a242;
            color: #f1e4c3;
            padding: 8px 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 11px;
            cursor: pointer;
            border-radius: 4px;
            text-align: left;
            transition: 0.2s;
        }

        .action-button:hover {
            background: #7a2846;
            color: #ffffff;
            border-color: #f3d56d;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="scene-container" style="background-image: url('https://images.unsplash.com/photo-1509198397868-475647b2a1e5?q=80&w=1000&auto=format&fit=crop');">
            <canvas id="gameCanvas"></canvas>

            <div class="touch-controls">
                <div class="dpad-row">
                    <button class="control-btn" data-dir="UP">⬆️</button>
                </div>
                <div class="dpad-row">
                    <button class="control-btn" data-dir="LEFT">⬅️</button>
                    <button class="control-btn" data-dir="RIGHT">➡️</button>
                </div>
                <div class="dpad-row">
                    <button class="control-btn" data-dir="DOWN">⬇️</button>
                </div>
            </div>

            <div class="action-panel-hud">
                <button class="action-hud-btn" onclick="game.action('attack')">⚔️ Atacar Enemigo</button>
                <button class="action-hud-btn" onclick="game.action('speed')">⚡ Súper Agilidad</button>
                <button class="action-hud-btn" onclick="game.action('search')">🔍 Buscar Pista</button>
                <button class="action-hud-btn" onclick="game.action('house')">🏠 Refugio / Casa</button>
            </div>
        </div>

        <div class="ui-panel">
            <div class="stats-box">
                <span id="stat-pistas">🔍 Pistas: 0</span>
                <span id="stat-cat">🐱 Gato: Ninguno</span>
                <span id="stat-enemy">⚠️ Amenaza: Ninguna</span>
                <span id="stat-zone">📍 Zona: Menú Principal</span>
            </div>
            <h3 id="story-title">Gatos: Destinos Cruzados</h3>
            <p id="story-text">
                Elige tu felino para desplegar su escenario exclusivo, sus enemigos específicos y su campaña argumental:
            </p>
            <div class="choices-container" id="button-group">
                <button class="action-button" onclick="game.selectCat('misi', 'Misi (El Gato Naranja)', '#e67e22', 'industrial', 'Perros Mutantes del Canal')">🐱 Campaña de Misi - Pueblo Industrial y Canales</button>
                <button class="action-button" onclick="game.selectCat('luna', 'Luna (La Gata Blanca)', '#f3f4f6', 'fog', 'Sombras y Gatos Infectados')">🐈‍⬛ Campaña de Luna - Aldea de la Niebla y Torres</button>
                <button class="action-button" onclick="game.selectCat('copito', 'Copito (El Gato Gris)', '#9ca3af', 'stone', 'Bestias del Páramo de Piedra')">🐈 Campaña de Copito - Ciudadela de Piedra Antigua</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight * 0.55;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const WORLD_WIDTH = 3000;

        let player = {
            x: 300,
            y: canvas.height * 0.75,
            name: 'Ninguno',
            color: '#e67e22',
            speed: 4.5,
            boost: 1,
            facing: 1
        };

        let activeKeys = { UP: false, DOWN: false, LEFT: false, RIGHT: false };
        let cameraX = 0;
        let currentCatKey = null;
        let isInside = false;
        let pistas = 0;
        let currentEnemyName = 'Ninguno';

        // Fondos reales exclusivos para cada campaña
        const themes = {
            industrial: {
                bg: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1000&auto=format&fit=crop",
                enemyColor: "#dc2626",
                enemyType: "Perro Mutante"
            },
            fog: {
                bg: "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?q=80&w=1000&auto=format&fit=crop",
                enemyColor: "#9333ea",
                enemyType: "Sombra Fantasmal"
            },
            stone: {
                bg: "https://images.unsplash.com/photo-1448375240586-882707db888b?q=80&w=1000&auto=format&fit=crop",
                enemyColor: "#ea580c",
                enemyType: "Bestia de Piedra"
            }
        };

        let activeTheme = themes.industrial;

        let enemies = [
            { x: 1200, y: canvas.height * 0.75, dir: 1, speed: 1.2 },
            { x: 2200, y: canvas.height * 0.75, dir: -1, speed: 1.0 }
        ];

        const game = {
            selectCat: function(key, name, color, themeKey, enemyDesc) {
                currentCatKey = key;
                player.name = name;
                player.color = color;
                activeTheme = themes[themeKey];
                currentEnemyName = enemyDesc;
                player.x = 250;
                isInside = false;

                // Cambiar el fondo del escenario inmediatamente
                document.getElementById('scene-container').style.backgroundImage = `url('${activeTheme.bg}')`;

                document.getElementById('stat-cat').innerText = `🐱 Gato: ${name.split(' ')[0]}`;
                document.getElementById('stat-enemy').innerText = `⚠️ Amenaza: ${activeTheme.enemyType}`;
                document.getElementById('stat-zone').innerText = `📍 Zona: Exterior Exclusivo`;

                document.getElementById('story-title').innerText = `Campaña Activa: ${name}`;
                document.getElementById('story-text').innerText = `¡Has entrado a tu escenario único! Te enfrentas a: ${enemyDesc}. Usa las flechas táctiles arriba para moverte y los botones laterales para interactuar.`;

                document.getElementById('button-group').innerHTML = `
                    <button class="action-button" onclick="game.action('search')">🔍 Investigar Entorno en Busca de Pistas</button>
                    <button class="action-button" onclick="game.action('house')">🏠 Entrar al Refugio Seguro</button>
                `;
            },

            action: function(type) {
                if (!currentCatKey) {
                    alert("¡Selecciona un gato primero en el menú inferior!");
                    return;
                }
                const text = document.getElementById('story-text');
                if (type === 'attack') {
                    text.innerText = `⚔️ ¡${player.name} ataca con ferocidad a los enemigos de su territorio! El peligro retrocede.`;
                } else if (type === 'speed') {
                    player.boost = 2.0;
                    text.innerText = `⚡ ¡Agilidad extrema activada! Te mueves a gran velocidad por el escenario.`;
                    setTimeout(() => { player.boost = 1; }, 4000);
                } else if (type === 'search') {
                    pistas++;
                    document.getElementById('stat-pistas').innerText = `🔍 Pistas: ${pistas}`;
                    text.innerText = `🔍 ¡Pista descubierta en tu territorio! Llevas ${pistas} pistas acumuladas.`;
                } else if (type === 'house') {
                    isInside = !isInside;
                    if (isInside) {
                        document.getElementById('stat-zone').innerText = `📍 Zona: Refugio Interior`;
                        text.innerText = `🏠 Has entrado a un refugio seguro dentro de tu escenario. Aquí estás a salvo de los enemigos.`;
                    } else {
                        document.getElementById('stat-zone').innerText = `📍 Zona: Exterior Exclusivo`;
                        text.innerText = `🏠 Has salido al exterior de tu territorio. ¡Mantente alerta!`;
                    }
                }
            }
        };

        // Controles Táctiles Continuos de Alta Precisión
        function setupTouch() {
            document.querySelectorAll('.control-btn').forEach(btn => {
                const dir = btn.getAttribute('data-dir');
                const start = (e) => { e.preventDefault(); activeKeys[dir] = true; btn.classList.add('active'); };
                const end = (e) => { e.preventDefault(); activeKeys[dir] = false; btn.classList.remove('active'); };

                btn.addEventListener('pointerdown', start);
                btn.addEventListener('pointerup', end);
                btn.addEventListener('pointerleave', end);
                btn.addEventListener('pointercancel', end);
            });
        }
        setupTouch();

        function update() {
            let spd = player.speed * player.boost;
            if (activeKeys.LEFT) { player.x -= spd; player.facing = -1; }
            if (activeKeys.RIGHT) { player.x += spd; player.facing = 1; }
            if (activeKeys.UP) { player.y -= spd * 0.7; }
            if (activeKeys.DOWN) { player.y += spd * 0.7; }

            // Límites del mapa
            if (player.x < 30) player.x = 30;
            if (player.x > WORLD_WIDTH - 30) player.x = WORLD_WIDTH - 30;
            if (player.y < canvas.height * 0.4) player.y = canvas.height * 0.4;
            if (player.y > canvas.height - 25) player.y = canvas.height - 25;

            // Cámara sigue al jugador
            cameraX = player.x - canvas.width / 2;
            if (cameraX < 0) cameraX = 0;
            if (cameraX > WORLD_WIDTH - canvas.width) cameraX = WORLD_WIDTH - canvas.width;

            // Movimiento de enemigos en el exterior
            if (currentCatKey && !isInside) {
                enemies.forEach(en => {
                    en.x += en.dir * en.speed;
                    if (en.x > WORLD_WIDTH - 200 || en.x < 300) en.dir *= -1;
                });
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(-cameraX, 0);

            // Suelo del nivel
            ctx.fillStyle = 'rgba(10, 6, 12, 0.85)';
            ctx.fillRect(0, canvas.height - 30, WORLD_WIDTH, 30);

            // Dibujar Enemigos si estamos en el exterior
            if (currentCatKey && !isInside) {
                enemies.forEach(en => {
                    ctx.fillStyle = activeTheme.enemyColor;
                    ctx.beginPath();
                    ctx.ellipse(en.x, en.y - 12, 18, 12, 0, 0, Math.PI * 2);
                    ctx.fill();
                    // Ojos amenazantes del enemigo
                    ctx.fillStyle = '#ffff00';
                    ctx.fillRect(en.x + (en.dir > 0 ? 5 : -10), en.y - 16, 3, 3);

                    ctx.fillStyle = '#ffffff';
                    ctx.font = '10px Courier New';
                    ctx.fillText(`⚠️ ${activeTheme.enemyType}`, en.x - 35, en.y - 30);
                });
            }

            // Dibujar al Gato Protagonista con más detalle visual
            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.scale(player.facing, 1);

            // Cuerpo del gato
            ctx.fillStyle = currentCatKey ? player.color : '#e67e22';
            ctx.beginPath();
            ctx.ellipse(0, -4, 22, 14, 0, 0, Math.PI * 2);
            ctx.fill();

            // Cabeza
            ctx.beginPath();
            ctx.arc(12, -12, 11, 0, Math.PI * 2);
            ctx.fill();

            // Orejas puntiagudas
            ctx.beginPath();
            ctx.moveTo(7, -20); ctx.lineTo(10, -28); ctx.lineTo(15, -20);
            ctx.fill();

            // Ojos brillantes del gato
            ctx.fillStyle = '#00ffcc';
            ctx.fillRect(14, -14, 3, 3);
            ctx.restore();

            // Nombre flotante del personaje
            ctx.fillStyle = '#fef3c7';
            ctx.font = '11px Courier New';
            ctx.textAlign = 'center';
            ctx.fillText(player.name, player.x, player.y - 42);

            ctx.restore();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
