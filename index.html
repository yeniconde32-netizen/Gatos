<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gatos: Destinos Cruzados - Miniserie</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body {
            background-color: #050508;
            color: #f8fafc;
            font-family: 'Cinzel', serif, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap');

        /* CONTENEDOR PRINCIPAL TIPO CINEMÁTICA */
        #app-container {
            width: 100%;
            max-width: 420px;
            height: 100%;
            max-height: 750px;
            background: linear-gradient(180deg, #0f172a 0%, #020617 100%);
            border: 2px solid #1e293b;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.7);
        }

        /* CABECERA DE EPISODIO */
        .header-ep {
            background: rgba(15, 23, 42, 0.9);
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #334155;
        }
        .header-ep h3 { margin: 0; font-size: 14px; color: #38bdf8; letter-spacing: 1px; }
        .header-ep h1 { margin: 5px 0 0; font-size: 18px; color: #f1f5f9; }

        /* PANTALLA VISUAL / ESCENA */
        .scene-screen {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle, #1e293b 0%, #0f172a 100%);
            overflow: hidden;
        }

        /* AVATAR / ILUSTRACIÓN CENTRAL (VECTORIAL Y SEGURA) */
        .character-art {
            font-size: 85px;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5));
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* CAJA DE DIÁLOGO / HISTORIA (ESTILO NOVELA VISUAL) */
        .story-box {
            background: rgba(15, 23, 42, 0.95);
            border-top: 2px solid #38bdf8;
            padding: 15px;
            min-height: 130px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .story-text {
            font-size: 13px;
            line-height: 1.5;
            color: #cbd5e1;
            font-family: 'Courier New', Courier, monospace;
            height: 60px;
            overflow-y: auto;
        }

        /* BOTONES DE DECISIÓN / ACCIÓN */
        .choices-area {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 12px;
            background: #020617;
            border-top: 1px solid #1e293b;
        }
        .btn-choice {
            background: linear-gradient(90deg, #1e40af 0%, #1d4ed8 100%);
            border: 1px solid #60a5fa;
            color: white;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 13px;
            text-align: center;
            cursor: pointer;
            font-family: 'Cinzel', serif, sans-serif;
            transition: 0.2s;
        }
        .btn-choice:active { background: #2563eb; transform: scale(0.98); }
        .btn-ad {
            background: linear-gradient(90deg, #b45309 0%, #d97706 100%);
            border: 1px solid #fbbf24;
        }
    </style>
</head>
<body>

    <div id="app-container">
        <!-- CABECERA -->
        <div class="header-ep">
            <h3 id="ep-tag">EPISODIO 1: EL DESPERTAR</h3>
            <h1 id="ep-title">Misi y el Refugio Interior</h1>
        </div>

        <!-- ESCENA VISUAL -->
        <div class="scene-screen">
            <div id="char-icon" class="character-art">🐱</div>
        </div>

        <!-- DIÁLOGO / NARRATIVA -->
        <div class="story-box">
            <div id="story-text" class="story-text">
                La tormenta azota las afueras. Misi abre los ojos entre escombros metálicos; el peligro del Perro Mutante acecha cerca del perímetro. La resiliencia será su única salida.
            </div>
        </div>

        <!-- OPCIONES Y MONETIZACIÓN (ANUNCIOS RECOMPENSADOS) -->
        <div id="choices-container" class="choices-area">
            <button class="btn-choice" onclick="makeChoice(1)">⚔️ Enfrentar al enemigo con garras</button>
            <button class="btn-choice" onclick="makeChoice(2)">⚡ Usar agilidad para huir y buscar pistas</button>
            <button class="btn-choice btn-ad" onclick="watchAdReward()">📺 Ver Anuncio (Desbloquear Episodio Especial)</button>
        </div>
    </div>

    <script>
        // Estructura de la Miniserie Interactiva
        let currentScene = 1;

        const episodes = {
            1: {
                tag: "EPISODIO 1: EL DESPERTAR",
                title: "Misi y el Refugio Interior",
                icon: "🐱",
                text: "La tormenta azota las afueras. Misi abre los ojos entre escombros metálicos; el peligro del Perro Mutante acecha cerca del perímetro. La resiliencia será su única salida.",
                c1: "⚔️ Enfrentar al enemigo con garras",
                c2: "⚡ Usar agilidad para huir y buscar pistas"
            },
            2: {
                tag: "EPISODIO 2: LA ALDEA OCULTA",
                title: "El Camino de Luna",
                icon: "🐈‍⬛",
                text: "Luna cruza la niebla espesa. Las sombras amenazan con atraparla, pero una luz misteriosa al fondo de las torres abandona el silencio.",
                c1: "🔍 Investigar las ruinas de las torres",
                c2: "🐾 Seguir el rastro del Gato Naranja"
            },
            3: {
                tag: "EPISODIO 3: CRUCE DE DESTINOS",
                title: "La Unión de las Sombras",
                icon: "🐾",
                text: "Los caminos convergen. Las pistas recolectadas revelan al verdadero responsable detrás de la amenaza mutante. Es hora de la batalla final.",
                c1: "🔥 Preparar el ataque definitivo en equipo",
                c2: "🛡️ Activar el escudo de resiliencia grupal"
            }
        };

        function makeChoice(option) {
            if (currentScene < 3) {
                currentScene++;
                loadEpisode(currentScene);
            } else {
                alert("¡Has completado el arco principal de la miniserie! Preparando el siguiente capítulo...");
                currentScene = 1;
                loadEpisode(currentScene);
            }
        }

        function loadEpisode(id) {
            let ep = episodes[id];
            document.getElementById('ep-tag').innerText = ep.tag;
            document.getElementById('ep-title').innerText = ep.title;
            document.getElementById('char-icon').innerText = ep.icon;
            document.getElementById('story-text').innerText = ep.text;
            
            // Actualizar botones de opción
            const container = document.getElementById('choices-container');
            container.innerHTML = `
                <button class="btn-choice" onclick="makeChoice(1)">${ep.c1}</button>
                <button class="btn-choice" onclick="makeChoice(2)">${ep.c2}</button>
                <button class="btn-choice btn-ad" onclick="watchAdReward()">📺 Ver Anuncio (Desbloquear Recompensa)</button>
            `;
        }

        function watchAdReward() {
            // Simulación de integración de red de anuncios recompensados (AdMob / Monetización)
            alert("[Simulación de Anuncio] Reproduciendo video publicitario de 15 segundos para monetización... \n\n¡Recompensa obtenida: +1 Pista Maestra desbloqueada!");
        }
    </script>
</body>
</html>
