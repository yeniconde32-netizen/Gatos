<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gatos: Destinos Cruzados (Biohazard Style)</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            background-color: #050505;
        }

        #game-screen {
            width: 100vw;
            height: 100vh;
            background-image: linear-gradient(rgba(5, 5, 8, 0.65), rgba(5, 5, 8, 0.9)), url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .visual-viewport {
            flex: 1;
            width: 100%;
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 15px;
            box-sizing: border-box;
        }

        .virtual-dpad {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(20, 0, 0, 0.7);
            padding: 8px;
            border-radius: 50%;
            border: 1px solid rgba(180, 0, 0, 0.6);
            backdrop-filter: blur(3px);
        }

        .dpad-row {
            display: flex;
            gap: 15px;
        }

        .control-btn {
            background: rgba(139, 0, 0, 0.5);
            border: 2px solid #b22222;
            color: #fff;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
        }

        .control-btn:active {
            background: #ff0000;
        }

        .ui-panel {
            background: rgba(10, 10, 14, 0.96);
            border-top: 2px solid #8b0000;
            color: #d1d1d1;
            padding: 15px 20px;
            box-sizing: border-box;
            width: 100%;
            max-height: 52vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.95);
            backdrop-filter: blur(4px);
        }

        #story-title {
            color: #ff3333;
            margin: 0;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 8px rgba(255, 0, 0, 0.6);
        }

        #story-text {
            font-size: 14px;
            line-height: 1.4;
            margin: 0;
            color: #cccccc;
        }

        .stats-box {
            display: flex;
            gap: 15px;
            font-size: 12px;
            color: #ffb347;
            border-bottom: 1px solid #330000;
            padding-bottom: 4px;
        }

        .choices-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .action-button {
            background: rgba(139, 0, 0, 0.25);
            border: 1px solid #b22222;
            color: #ff9999;
            padding: 10px 14px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 2px;
            text-align: left;
        }

        .action-button:hover {
            background: #8b0000;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.8);
        }
    </style>
</head>
<body>

    <div id="game-screen">
        <div class="visual-viewport">
            <div class="virtual-dpad" title="Control de Movimiento">
                <button class="control-btn" onclick="gameRoute.handleControl('UP')">⬆️</button>
                <div class="dpad-row">
                    <button class="control-btn" onclick="gameRoute.handleControl('LEFT')">⬅️</button>
                    <button class="control-btn" onclick="gameRoute.handleControl('RIGHT')">➡️</button>
                </div>
                <button class="control-btn" onclick="gameRoute.handleControl('DOWN')">⬇️</button>
            </div>
            <div>
                <button class="control-btn" onclick="gameRoute.handleControl('ACTION')" style="border-color: #ff3333; color: #ff3333; background: rgba(255,0,0,0.2);">☣️</button>
            </div>
        </div>

        <div class="ui-panel">
            <div class="stats-box">
                <span id="stat-rats">🐭 Ratones: 0</span>
                <span id="stat-birds">🐦 Palomas: 0</span>
            </div>
            <h3 id="story-title">Expedición: Elección de Campaña</h3>
            <p id="story-text">
                La marea tóxica ha fracturado al grupo. Cada gato se adentra en su propia pesadilla. Selecciona con qué personaje deseas iniciar la investigación:
            </p>
            <div class="choices-container" id="button-group">
                <button class="action-button" onclick="gameRoute.selectCat('misi')">🐱 Campaña de Misi (Amenaza: Perros Mutantes en los Canales)</button>
                <button class="action-button" onclick="gameRoute.selectCat('luna')">🐈‍⬛ Campaña de Luna (Amenaza: Gatos Infectados en el Bosque)</button>
                <button class="action-button" onclick="gameRoute.selectCat('copito')">🐈 Campaña de Copito (Amenaza: Cazadores en las Ruinas)</button>
            </div>
        </div>
    </div>

    <script>
        let gameState = { rats: 0, birds: 0, currentCat: '' };

        const gameRoute = {
            updateStats: function() {
                document.getElementById('stat-rats').innerText = `🐭 Ratones: ${gameState.rats}`;
                document.getElementById('stat-birds').innerText = `🐦 Palomas: ${gameState.birds}`;
            },

            handleControl: function(direction) {
                const text = document.getElementById('story-text');
                if (direction === 'UP') text.innerText = "¡Avanzas con precaución por el pasaje oscuro analizando el entorno!";
                if (direction === 'DOWN') text.innerText = "¡Te agachas esquivando los ruidos de una criatura al acecho!";
                if (direction === 'LEFT') text.innerText = "¡Revisando la esquina oeste en busca de munición o refugio!";
                if (direction === 'RIGHT') text.innerText = "¡Inspeccionando una puerta bloqueada por escombros!";
                if (direction === 'ACTION') text.innerText = "☣️ ¡Alerta de peligro! Sientes que alguien (o algo) te vigila de cerca.";
            },

            selectCat: function(cat) {
                gameState.currentCat = cat;
                const title = document.getElementById('story-title');
                const text = document.getElementById('story-text');
                const buttons = document.getElementById('button-group');

                if (cat === 'misi') {
                    title.innerText = "Campaña de Misi: Los Canales Subterráneos";
                    text.innerText = "Misi nada entre aguas negras. De repente, escucha gruñidos mecánicos: un perro mutante patrulla la compuerta. A lo lejos, ve una jaula con palomas y destellos de luz de la linterna de Luna en un túnel superior.";
                    gameState.birds += 2;
                    this.updateStats();
                    buttons.innerHTML = `
                        <button class="action-button" onclick="gameRoute.crossEvent('misi')">⚡ Distraer al perro mutante y cruzar ruta con Luna</button>
                    `;
                } else if (cat === 'luna') {
                    title.innerText = "Campaña de Luna: El Bosque Infectado";
                    text.innerText = "Luna avanza entre árboles muertos. Oye pasos extraños: un grupo de gatos infectados por el virus toxico bloquean el camino. A lo alto de una torre de radio, atisba las bengalas de Copito.";
                    gameState.rats += 3;
                    this.updateStats();
                    buttons.innerHTML = `
                        <button class="action-button" onclick="gameRoute.crossEvent('luna')">⚡ Evadir a los infectados y conectar con la ruta de Copito</button>
                    `;
                } else if (cat === 'copito') {
                    title.innerText = "Campaña de Copito: Zona de Cazadores";
                    text.innerText = "Copito trepa por los andamios. Los cazadores humanos armados vigilan el perímetro con trampas láser. Al fondo, a través de una ventana rota, ve a Misi luchando en el agua.";
                    gameState.rats += 1;
                    gameState.birds += 1;
                    this.updateStats();
                    buttons.innerHTML = `
                        <button class="action-button" onclick="gameRoute.crossEvent('copito')">⚡ Desactivar trampa láser y lanzar señal a Misi</button>
                    `;
                }
            },

            crossEvent: function(cat) {
                const title = document.getElementById('story-title');
                const text = document.getElementById('story-text');
                const buttons = document.getElementById('button-group');

                title.innerText = "¡Punto de Convergencia (Cruce de Destinos)!";
                if (cat === 'misi') {
                    text.innerText = "Misi activa una válvula de vapor para ahuyentar al perro mutante. En ese preciso instante, Luna cae desde el conducto superior esquivando a los infectados, dejándote una llave de acceso antes de desaparecer en la niebla.";
                } else if (cat === 'luna') {
                    text.innerText = "Luna utiliza los cristales luminosos para cegar a los gatos infectados. Al saltar una cerca, choca de frente con Copito, quien venía huyendo de los cazadores. ¡Ambos comparten información vital y se separan!";
                } else {
                    text.innerText = "Copito desactiva la red láser de los cazadores. El cortocircuito ilumina el canal inferior, permitiendo que Misi escape de la emboscada del perro mutante. ¡Una alianza perfecta a distancia!";
                }

                buttons.innerHTML = `
                    <button class="action-button" onclick="location.reload()">🔄 Elegir Otra Campaña / Reiniciar</button>
                `;
            }
        };
    </script>
</body>
</html>
