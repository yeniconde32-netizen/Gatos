<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gatos: Destinos Cruzados - Acción 2D</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Cinzel', serif, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap');

        #app-container {
            width: 100%;
            max-width: 450px;
            height: 100%;
            max-height: 800px;
            background: #090d16;
            border: 2px solid #1e293b;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
        }

        /* LATA/CABECERA DE ESTADO */
        .game-header {
            background: rgba(15, 23, 42, 0.9);
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            z-index: 10;
        }
        .game-header h2 { margin: 0; font-size: 13px; color: #38bdf8; }
        .stats-box { font-size: 11px; font-family: monospace; color: #cbd5e1; }

        /* LIENZO DE JUEGO 2D (ESCENARIOS Y ACCIÓN) */
        #gameCanvas {
            flex: 1;
            display: block;
            background: #121826;
            width: 100%;
        }

        /* PANEL DE CONTROLES TÁCTILES Y ACCIÓN */
        .control-panel {
            background: #020617;
            padding: 12px;
            border-top: 1px solid #1e293b;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 10;
        }
        .action-row {
            display: flex;
            gap: 8px;
            justify-content: space-between;
        }
        .btn-game {
            flex: 1;
            background: linear-gradient(180deg, #1e40af 0%, #1d4ed8 100%);
            border: 1px solid #60a5fa;
            color: white;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 12px;
            text-align: center;
            cursor: pointer;
            font-family: 'Cinzel', serif;
        }
        .btn-game:active { background: #2563eb; transform: scale(0.97); }
        .btn-attack { background: linear-gradient(180deg, #991b1b 0%, #b91c1c 100%); border-color: #ef4444; }
        .btn-special { background: linear-gradient(180deg, #854d0e 0%, #a16207 100%); border-color: #facc15; }

        /* MODAL DE SELECCIÓN DE CAPÍTULOS / ESCENARIOS */
        #stage-modal {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 6, 23, 0.95);
            z-index: 50;
            display: flex;
            flex-direction: column;
            padding: 20px;
            justify-content: center;
            align-items: center;
        }
        #stage-modal h1 { color: #38bdf8; font-size: 20px; margin-bottom: 5px; text-align: center; }
        #stage-modal p { color: #94a3b8; font-size: 12px; margin-bottom: 20px; text-align: center; }
        .stage-card {
            background: #1e293b;
            border: 1px solid #475569;
            width: 100%;
            max-width: 320px;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
            text-align: center;
            font-weight: bold;
        }
        .stage-card:active { background: #334155; }
    </style>
</head>
<body>

    <div id="app-container">
        <!-- SELECCIÓN DE ESCENARIO / NIVEL -->
        <div id="stage-modal">
            <h1>GATOS: DESTINOS CRUZADOS</h1>
            <p>Selecciona tu escenario de combate y aventura</p>
            <div class="stage-card" onclick="selectStage(0)">🐾 Escenario 1: Refugio Interior (Misi)</div>
            <div class="stage-card" onclick="selectStage(1)">🐈‍⬛ Escenario 2: Aldea de la Niebla (Luna)</div>
        </div>

        <!-- CABECERA -->
        <div class="game-header">
            <h2 id="stage-title-hud">ESCENARIO 1</h2>
            <div class="stats-box" id="stats-hud">HP: 100 | ENERGÍA: 100</div>
        </div>

        <!-- CANVAS DE JUEGO (MOVIMIENTO DE PERSONAJES Y ESCENARIOS) -->
        <canvas id="gameCanvas"></canvas>

        <!-- CONTROLES TÁCTILES INFERIORES -->
        <div class="control-panel">
            <div class="action-row">
                <button class="btn-game" onclick="movePlayer(-20)">◀ Izquierda</button>
                <button class="btn-game" onclick="movePlayer(20)">Derecha ▶</button>
            </div>
            <div class="action-row">
                <button class="btn-game btn-attack" onclick="playerAttack()">⚔️ Atacar Enemigo</button>
                <button class="btn-game btn-special" onclick="playerSpecial()">⚡ Habilidad Especial</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        function resize() {
            width = canvas.width = canvas.clientWidth;
            height = canvas.height = canvas.clientHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Datos del juego
        let currentStage = 0;
        let player = { x: 50, y: 180, size: 70, hp: 100, maxHp: 100, animFrame: 0 };
        let enemy = { x: 280, y: 180, size: 70, hp: 100, maxHp: 100, name: "Perro Mutante" };
        let fxEffect = { active: false, timer: 0, text: "" };

        const stages = [
            { name: "Refugio Interior", pIcon: "🐱", eIcon: "🐕", eName: "Perro Mutante", bgCol: "#0f172a" },
            { name: "Aldea de la Niebla", pIcon: "🐈‍⬛", eIcon: "👻", eName: "Sombra Fantasmal", bgCol: "#18182b" }
        ];

        function selectStage(index) {
            currentStage = index;
            let st = stages[currentStage];
            document.getElementById('stage-title-hud').innerText = "ESCENARIO: " + st.name;
            enemy.name = st.eName;
            enemy.hp = 100;
            player.hp = 100;
            document.getElementById('stage-modal').style.display = 'none';
        }

        function movePlayer(dir) {
            player.x = Math.max(10, Math.min(width - 90, player.x + dir));
        }

        function playerAttack() {
            enemy.hp = Math.max(0, enemy.hp - 25);
            fxEffect = { active: true, timer: 20, text: "-25 ⚔️" };
            if(enemy.hp === 0) {
                setTimeout(() => {
                    alert("¡Victoria! Has superado este sector del escenario.");
                    enemy.hp = 100;
                }, 200);
            }
        }

        function playerSpecial() {
            player.hp = Math.min(player.maxHp, player.hp + 20);
            fxEffect = { active: true, timer: 20, text: "+20 ⚡ Resiliencia" };
        }

        // Bucle principal de renderizado gráfico 2D en tiempo real
        function gameLoop() {
            ctx.clearRect(0, 0, width, height);

            let st = stages[currentStage];

            // 1. Dibujar escenario dinámico de fondo (estilo desplazamiento)
            ctx.fillStyle = st.bgCol;
            ctx.fillRect(0, 0, width, height);

            // Suelo del escenario
            ctx.fillStyle = "#1e293b";
            ctx.fillRect(0, height - 80, width, 80);
            ctx.strokeStyle = "#38bdf8";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, height - 80);
            ctx.lineTo(width, height - 80);
            ctx.stroke();

            // 2. Dibujar Elementos del Escenario (Árboles / Edificios Vectoriales de fondo)
            ctx.fillStyle = "rgba(56, 189, 248, 0.05)";
            ctx.fillRect(60, height - 220, 50, 140);
            ctx.fillRect(220, height - 260, 70, 180);

            // 3. Renderizar Personaje y Enemigo con efectos flotantes
            player.y = (height - 150) + Math.sin(Date.now() / 200) * 4;
            enemy.y = (height - 150) + Math.cos(Date.now() / 200) * 4;

            ctx.font = "60px sans-serif";
            ctx.textAlign = "center";
            
            // Personaje Jugador
            ctx.fillText(st.pIcon, player.x + 35, player.y + 50);
            // Enemigo
            ctx.fillText(st.eIcon, enemy.x + 35, enemy.y + 50);

            // 4. Barras de Vida sobre los personajes
            drawHUDBar(player.x, player.y - 15, 70, player.hp, player.maxHp, "#22c55e");
            drawHUDBar(enemy.x, enemy.y - 15, 70, enemy.hp, enemy.maxHp, "#ef4444");

            // 5. Efectos Visuales de Combate flotantes
            if (fxEffect.active) {
                ctx.fillStyle = "#facc15";
                ctx.font = "bold 18px Cinzel, monospace";
                ctx.fillText(fxEffect.text, width / 2, height / 2 - 50);
                fxEffect.timer--;
                if (fxEffect.timer <= 0) fxEffect.active = false;
            }

            // Actualizar texto del HUD inferior
            document.getElementById('stats-hud').innerText = `HP: ${player.hp} | Enemigo HP: ${enemy.hp}`;

            requestAnimationFrame(gameLoop);
        }

        function drawHUDBar(x, y, w, current, max, color) {
            ctx.fillStyle = "rgba(0,0,0,0.6)";
            ctx.fillRect(x, y, w, 8);
            ctx.fillStyle = color;
            ctx.fillRect(x, y, (current / max) * w, 8);
            ctx.strokeStyle = "#fff";
            ctx.strokeRect(x, y, w, 8);
        }

        // Iniciar motor de renderizado
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
