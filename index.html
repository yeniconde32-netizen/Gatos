<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gatitos en Fuga: Capítulo 1 - La Huida del Callejón</title>
    <style>
        body {
            background-color: #0d1117; /* Fondo oscuro tipo cine */
            color: #ffffff;
            font-family: 'Georgia', serif; /* Fuente clásica para narrativa */
            text-align: center;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 420px;
            height: 100vh;
            padding-top: 60px; /* Espacio para anuncio superior */
            padding-bottom: 70px; /* Espacio para menú inferior */
        }

        #game-container {
            position: relative;
            width: 95%;
            height: 72vh; /* Juego ocupa gran parte de la pantalla */
            max-height: 420px;
            background: linear-gradient(to bottom, #0f172a, #1e293b); /* Cielo nocturno */
            border: 3px solid #ea580c; /* Borde color fuego */
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated; /* Mantener estética cuadrito nítida */
        }

        .hud {
            position: absolute;
            top: 8px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            font-weight: bold;
            color: #fde68a; /* Amarillo dorado */
            text-shadow: 2px 2px #000;
            z-index: 10;
            pointer-events: none;
        }

        .ad-banner {
            width: 100%;
            max-width: 400px;
            height: 50px;
            background-color: #161e2e;
            border: 1px dashed #ea580c;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #a3a3a3;
            font-size: 11px;
            margin: 6px 0;
            border-radius: 6px;
        }

        .fixed-bottom {
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 380px;
            z-index: 100;
        }

        .btn {
            background-color: #ea580c;
            color: #111827;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .btn:active { background-color: #c2410c; transform: translateY(2px); }

        /* Pantalla de Narrativa / Cinemática */
        #narrative-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92);
            display: none; /* Oculto por defecto */
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 30;
            padding: 30px;
            box-sizing: border-box;
        }
        #narrative-title {
            color: #ef4444; /* Rojo peligro */
            font-size: 24px;
            margin-bottom: 15px;
            font-weight: bold;
        }
        #narrative-text {
            color: #e5e7eb;
            font-size: 18px;
            line-height: 1.5;
            margin-bottom: 25px;
            max-width: 350px;
        }
        #narrative-btn {
            width: 70%;
        }
    </style>
</head>
<body>

    <div class="ad-banner" style="position: fixed; top: 5px;">Anuncio Superior / Monetag</div>

    <div id="game-wrapper">
        <div id="game-container">
            <div class="hud">
                <span id="score-txt">Puntos: 0</span>
                <span id="chapter-txt">Cap 1: Huida</span>
            </div>
            <canvas id="gameCanvas" width="400" height="300"></canvas>

            <div id="narrative-overlay">
                <p id="narrative-title">¡CAPÍTULO 1 COMPLETADO!</p>
                <p id="narrative-text">Has dejado el camión de pescado atrás. El perro guardián ya no te persigue. Estás a salvo en el tejado. ¿Es ese... el maullido de tu hermano?</p>
                <button id="narrative-btn" class="btn" onclick="backToMenu()">Continuar al Capítulo 2</button>
            </div>
        </div>
        <div class="ad-banner">Anuncio Recompensas / Banner Inferior</div>
    </div>

    <div class="fixed-bottom">
        <button class="btn" onclick="window.location.href='/'">Volver al Menú de Campañas</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const narrativeOverlay = document.getElementById('narrative-overlay');
        const narrativeTitle = document.getElementById('narrative-title');
        const narrativeText = document.getElementById('narrative-text');
        const narrativeBtn = document.getElementById('narrative-btn');

        let stopGame = false;
        let pausedForCinematic = false;
        let score = 0;
        let gameSpeed = 3.5;
        let frameCount = 0;
        let chapterComplete = false;

        const CW = canvas.width;
        const CH = canvas.height;
        const GROUND_Y = CH - 60;

        // El Gato 1 (El Ágil - Bloque Naranja)
        let cat = {
            x: 50,
            y: GROUND_Y,
            width: 38,
            height: 30,
            dy: 0,
            jumpForce: -11,
            gravity: 0.6,
            isGrounded: true,
            legAnim: 0
        };

        let enemies = [];
        let items = [];
        let particles = [];

        // Audio Sintetizado Cinemático
        let audioCtx = null;
        function playTone(freq1, freq2, duration, type) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq1, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(freq2, audioCtx.currentTime + duration);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        function initGame() {
            stopGame = false;
            pausedForCinematic = false;
            chapterComplete = false;
            score = 0;
            gameSpeed = 3.5;
            frameCount = 0;
            enemies = [];
            items = [];
            particles = [];
            narrativeOverlay.style.display = 'none';
            cat.y = GROUND_Y;
            cat.isGrounded = true;
            loop();
        }

        // Controles
        window.addEventListener('keydown', e => { if(e.code === 'Space') makeJump(); });
        canvas.addEventListener('touchstart', e => { e.preventDefault(); makeJump(); });

        function makeJump() {
            if (stopGame || pausedForCinematic || chapterComplete) return;
            if (cat.isGrounded) {
                cat.dy = cat.jumpForce;
                cat.isGrounded = false;
                playTone(150, 400, 0.15, 'square'); // Sonido de salto felino
                // Estela de movimiento
                particles.push({x: cat.x, y: cat.y, alpha: 1, color: '#fdba74'});
            }
        }

        // ENEMIGOS DRAMÁTICOS (CAP 1)
        const enemyEncounters = [
            { name: "Cuervo Hostil", color: "#111827", heightBonus: -32, msg: "¡Un cuervo gigante te bloquea el paso!" },
            { name: "Rata de Cloaca", color: "#166534", heightBonus: 0, msg: "¡Una rata mutante te corta el paso!" },
            { name: "Perro Guardián (Lejos)", color: "#991b1b", heightBonus: 0, msg: "El perro guardián aún te sigue la pista..." }
        ];

        function update() {
            if (stopGame || pausedForCinematic || chapterComplete) return;
            frameCount++;
            score += Math.floor(gameSpeed / 3);

            // Aceleración gradual
            if (frameCount % 400 === 0) gameSpeed += 0.3;

            // CONDICIÓN DE FIN DEL CAPÍTULO 1 (Al llegar a 2000 puntos)
            if (score >= 2000) {
                triggerChapterEnd();
                return;
            }

            document.getElementById('score-txt').innerText = `Puntos: ${score}`;

            // Física del gato
            cat.dy += cat.gravity;
            cat.y += cat.dy;
            if (cat.y >= GROUND_Y) {
                cat.y = GROUND_Y;
                cat.dy = 0;
                cat.isGrounded = true;
            }

            // Generador de Enemigos (Dramáticos)
            let spawnRate = score < 500 ? 100 : (score < 1500 ? 80 : 60);
            if (frameCount % spawnRate === 0) {
                let typeIdx = score < 500 ? 0 : (Math.random() > 0.5 ? 1 : 0); // Aparecen ratas luego de 500pts
                let enemyData = enemyEncounters[typeIdx];
                enemies.push({
                    x: CW,
                    y: GROUND_Y + 4 + enemyData.heightBonus,
                    width: 40,
                    height: 24 - enemyData.heightBonus,
                    data: enemyData
                });
            }

            // Generador de Comida (Ítem)
            if (frameCount % 130 === 0) {
                items.push({ x: CW, y: GROUND_Y + 5, width: 22, height: 14 });
            }

            // Mover enemigos
            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                e.x -= gameSpeed;

                // Colisión Gato-Enemigo (Encuentro Cinemático)
                if (
                    cat.x < e.x + e.width &&
                    cat.x + cat.width > e.x &&
                    cat.y < e.y + e.height &&
                    cat.y + cat.height > e.y
                ) {
                    triggerCinematicEncounter(e);
                    return;
                }

                if (e.x + e.width < 0) enemies.splice(i, 1);
            }

            // Mover ítems
            for (let i = items.length - 1; i >= 0; i--) {
                let itm = items[i];
                itm.x -= gameSpeed;
                if (
                    cat.x < itm.x + itm.width &&
                    cat.x + cat.width > itm.x &&
                    cat.y < itm.y + itm.height &&
                    cat.y + cat.height > itm.y
                ) {
                    score += 80;
                    playTone(600, 1100, 0.05, 'sine'); // Sonido de éxito
                    items.splice(i, 1);
                } else if (itm.x + itm.width < 0) items.splice(i, 1);
            }

            // Actualizar partículas
            for(let p of particles) p.alpha -= 0.02;
            particles = particles.filter(p => p.alpha > 0);
        }

        // FUNCIÓN DE ENCUENTRO CINEMÁTICO (Pausa Dramática)
        function triggerCinematicEncounter(enemy) {
            pausedForCinematic = true;
            stopGame = true;

            // Sonido grave de suspenso
            playTone(100, 30, 0.8, 'sawtooth');

            // Colocar al enemigo en primer plano sobre el gato para la toma
            enemy.x = cat.x - 10;
            enemy.y = cat.y - 5;
            draw(); // Redibujar con el enemigo sobre el gato

            // Mostrar cuadro de diálogo
            // Usaremos un alert() simple por ahora para garantizar que detiene el juego en el móvil,
            // pero lo ideal es el overlay que preparamos. Usemos el overlay.
            // Modifiquemos el overlay para usarlo aquí.
            
            // REEMPLAZO DE DIÁLOGO:
            // Asumiendo que el usuario quiere algo tipo "película de terror indie"
            // Vamos a usar
