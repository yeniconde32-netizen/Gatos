<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gatos: Destinos Cruzados - 2D Adventure</title>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body {
            background-color: #0b0e14;
            color: #cbd5e1;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }
        h2 { color: #00f2ff; margin: 5px 0; font-size: 16px; text-align: center; }
        
        /* CONTENEDOR DEL JUEGO / CANVAS */
        #game-container {
            width: 100%;
            max-width: 450px;
            height: 260px;
            background: #121620;
            border: 2px solid #1e2533;
            border-radius: 10px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        /* ENTIDADES 2D */
        .entity {
            position: absolute;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            transition: transform 0.1s;
        }
        #player { background: #ff7a00; border: 2px solid #fff; z-index: 5; }
        #enemy { background: #ff2a2a; border: 2px solid #555; z-index: 4; }

        /* HUD Y BARRAS DE VIDA */
        .hud-top {
            width: 100%;
            max-width: 450px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-bottom: 5px;
            background: #161b26;
            padding: 8px;
            border-radius: 6px;
        }
        .health-bar {
            width: 100px;
            height: 10px;
            background: #333;
            border-radius: 5px;
            overflow: hidden;
            display: inline-block;
            vertical-align: middle;
        }
        .health-fill {
            height: 100%;
            background: #00ff66;
            width: 100%;
            transition: width 0.3s;
        }

        /* PANEL DE ACCIONES Y CONTROLES */
        .controls-panel {
            width: 100%;
            max-width: 450px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }
        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            justify-items: center;
            align-items: center;
            background: #121620;
            padding: 10px;
            border-radius: 8px;
        }
        .btn {
            background: #1e2533;
            color: #fff;
            border: 1px solid #334155;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            text-align: center;
            cursor: pointer;
        }
        .btn:active { background: #00f2ff; color: #000; }
        
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .btn-action {
            background: #9900ff;
            border: none;
            color: white;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
        }
        .btn-action:active { background: #b84dff; }

        /* LOG DE HISTORIA */
        .log-box {
            width: 100%;
            max-width: 450px;
            background: #121620;
            border: 1px solid #1e2533;
            padding: 10px;
            border-radius: 6px;
            margin-top: 8px;
            font-size: 11px;
            height: 60px;
            overflow-y: auto;
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <h2 id="campaign-title">Campaña: Misi (Gato Naranja)</h2>

    <div class="hud-top">
        <div>HP Gato: <div class="health-bar"><div id="player-hp" class="health-fill"></div></div></div>
        <div>HP Enemigo: <div class="health-bar"><div id="enemy-hp" class="health-fill" style="background:#ff3333;"></div></div></div>
    </div>

    <div id="game-container">
        <div id="player" class="entity" style="top: 100px; left: 50px;">🐱</div>
        <div id="enemy" class="entity" style="top: 100px; left: 300px;">🐶</div>
    </div>

    <div class="controls-panel">
        <div class="dpad">
            <div></div>
            <div class="btn" onclick="movePlayer(0, -15)">⬆️</div>
            <div></div>
            <div class="btn" onclick="movePlayer(-15, 0)">⬅️</div>
            <div class="btn" onclick="switchCampaign()">🔄</div>
            <div class="btn" onclick="movePlayer(15, 0)">➡️</div>
            <div></div>
            <div class="btn" onclick="movePlayer(0, 15)">⬇️</div>
            <div></div>
        </div>

        <div class="action-buttons">
            <button class="btn-action" style="background:#ff3333;" onclick="playerAttack()">⚔️ Atacar</button>
            <button class="btn-action" style="background:#00a2ff;" onclick="playerSpecial()">⚡ Habilidad</button>
            <button class="btn-action" style="background:#eab308;" onclick="searchZone()">🔍 Investigar</button>
        </div>
    </div>

    <div id="log" class="log-box">
        [Sistema] ¡Bienvenido a Gatos: Destinos Cruzados! Acérquate al enemigo y presiona Atacar.
    </div>

    <script>
        let currentCampaign = 0;
        const campaigns = [
            { name: "Misi (Gato Naranja)", zone: "Refugio Interior", pIcon: "🐱", eIcon: "🐶", eName: "Perro Mutante", pHp: 100, eHp: 100 },
            { name: "Luna (Gata Blanca)", zone: "Aldea de la Niebla", pIcon: "🐈‍⬛", eIcon: "👻", eName: "Sombra Fantasmal", pHp: 100, eHp: 120 }
        ];

        let playerX = 50, playerY = 100;
        let enemyX = 300, enemyY = 100;
        let pHealth = 100, eHealth = 100;

        const playerEl = document.getElementById('player');
        const enemyEl = document.getElementById('enemy');
        const logEl = document.getElementById('log');

        function updatePositions() {
            playerEl.style.left = playerX + 'px';
            playerEl.style.top = playerY + 'px';
            enemyEl.style.left = enemyX + 'px';
            enemyEl.style.top = enemyY + 'px';
        }

        function log(msg) {
            logEl.innerHTML += `<br>` + msg;
            logEl.scrollTop = logEl.scrollHeight;
        }

        function movePlayer(dx, dy) {
            playerX = Math.max(10, Math.min(390, playerX + dx));
            playerY = Math.max(10, Math.min(205, playerY + dy));
            updatePositions();
            checkProximity();
        }

        function checkProximity() {
            let dist = Math.abs(playerX - enemyX);
            if(dist < 50) {
                log("[Alerta] ¡El enemigo reacciona y te acecha de cerca!");
            }
        }

        function playerAttack() {
            let dist = Math.abs(playerX - enemyX);
            if(dist < 70) {
                eHealth -= 25;
                if(eHealth < 0) eHealth = 0;
                document.getElementById('enemy-hp').style.width = eHealth + '%';
                log(`[Ataque] ¡Golpe directo al ${campaigns[currentCampaign].eName}! Vida enemiga: ${eHealth}%`);
                
                // Efecto visual de daño en el enemigo
                enemyEl.style.transform = "scale(1.3)";
                setTimeout(() => enemyEl.style.transform = "scale(1)", 150);

                if(eHealth === 0) {
                    log(`🎉 ¡Has derrotado a la amenaza de la zona! Camino libre.`);
                }
            } else {
                log(`[Fallido] Estás muy lejos para atacar. ¡Acércate con las flechas!`);
            }
        }

        function playerSpecial() {
            log(`[Habilidad] ¡${campaigns[currentCampaign].name} usa su agilidad de resiliencia esquivando el peligro!`);
        }

        function searchZone() {
            log(`[Investigación] Has encontrado una pista secreta sobre el destino de los otros gatos.`);
        }

        function switchCampaign() {
            currentCampaign = (currentCampaign + 1) % campaigns.length;
            let c = campaigns[currentCampaign];
            document.getElementById('campaign-title').innerText = "Campaña: " + c.name;
            playerEl.innerText = c.pIcon;
            enemyEl.innerText = c.eIcon;
            pHealth = c.pHp;
            eHealth = c.eHp;
            document.getElementById('player-hp').style.width = pHealth + '%';
            document.getElementById('enemy-hp').style.width = eHealth + '%';
            playerX = 50; playerY = 100;
            enemyX = 300; enemyY = 100;
            updatePositions();
            log(`=== CAMBIO DE CAMPAÑA: ${c.zone} (${c.name}) ===`);
        }

        updatePositions();
    </script>
</body>
</html>
