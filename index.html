<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gatos: Destinos Cruzados - Biohazard Edition</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            background-color: #030303;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Lienzo gráfico donde actúan los gatos y enemigos */
        #gameCanvas {
            flex: 1;
            width: 100%;
            background-color: #0b0b0f;
            display: block;
        }

        /* Panel de control y narrativa inferior */
        .ui-panel {
            background: rgba(10, 10, 14, 0.96);
            border-top: 2px solid #8b0000;
            color: #d1d1d1;
            padding: 12px 18px;
            box-sizing: border-box;
            width: 100%;
            max-height: 48vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.95);
        }

        #story-title {
            color: #ff3333;
            margin: 0;
            font-size: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 6px rgba(255, 0, 0, 0.6);
        }

        #story-text {
            font-size: 13px;
            line-height: 1.4;
            margin: 0;
            color: #cccccc;
        }

        .stats-box {
            display: flex;
            gap: 15px;
            font-size: 11px;
            color: #ffb347;
            border-bottom: 1px solid #330000;
            padding-bottom: 4px;
        }

        .choices-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .action-button {
            background: rgba(139, 0, 0, 0.25);
            border: 1px solid #b22222;
            color: #ff9999;
            padding: 8px 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 2px;
            text-align: left;
        }

        .action-button:hover {
            background: #8b0000;
            color: #ffffff;
            box-shadow: 0 0 12px rgba(255, 0, 0, 0.8);
        }

        /* Controles táctiles flotantes sobre el canvas */
        .overlay-controls {
            position: absolute;
            top: 15px;
            left: 15px;
            display: flex;
            gap: 10px;
            z-index: 10;
        }

        .control-btn {
            background: rgba(139, 0, 0, 0.6);
            border: 2px solid #b22222;
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 8px rgba(255, 0, 0, 0.5);
        }

        .control-btn:active {
            background: #ff0000;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Controles flotantes rápidos -->
        <div class="overlay-controls">
            <button class="control-btn" onclick="game.moveCat('LEFT')">⬅️</button>
            <button class="control-btn" onclick="game.moveCat('RIGHT')">➡️</button>
            <button class="control-btn" onclick="game.actionAlert()" title="Acción de Alerta">☣️</button>
        </div>

        <!-- Lienzo de Gráficos (Canvas) -->
        <canvas id="gameCanvas"></canvas>

        <!-- Panel de Historia e Interfaz -->
        <div class="ui-panel">
            <div class="stats-box">
                <span id="stat-rats">🐭 Ratones: 0</span>
                <span id="stat-birds">🐦 Palomas: 0</span>
                <span id="stat-status"> estado: En Espera</span>
            </div>
            <h3 id="story-title">Prólogo: La Caída de las Tierras Bajas</h3>
            <p id="story-text">
                Una densa niebla tóxica desciende sobre el páramo. Tres felinos intentan sobrevivir en campañas independientes, pero sus destinos están entrelazados por una amenaza común. Selecciona tu personaje:
            </p>
            <div class="choices-container" id="button-group">
                <button class="action-button" onclick="game.startCampaign('misi')">🐱 Campaña de Misi (Enemigo: Perro Mutante)</button>
                <button class="action-button" onclick="game.startCampaign('luna')">🐈‍⬛ Campaña de Luna (Enemigo: Gato Infectado)</button>
                <button class="action-button" onclick="game.startCampaign('copito')">🐈 Campaña de Copito (Enemigo: Cazador Humano)</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Ajustar tamaño del canvas automáticamente
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight * 0.52;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Estado del juego y personajes gráficos
        let gameData = {
            rats: 0,
            birds: 0,
            catX: canvas.width / 2 - 40,
            catY: canvas.height / 2,
            catName: 'Misi',
            catColor: '#ffa500',
            enemyX: canvas.width - 120,
            enemyY: canvas.height / 2,
            enemyType: 'Perro Mutante',
            enemyColor: '#8b0000',
            stage: 'intro'
        };

        const game = {
            startCampaign: function(cat) {
                const title = document.getElementById('story-title');
                const text = document.getElementById('story-text');
                const buttons = document.getElementById('button-group');

                if (cat === 'misi') {
                    gameData.catName = 'Misi';
                    gameData.catColor = '#ffaa00'; // Naranja
                    gameData.enemyType = '🐶 Perro Mutante';
                    gameData.enemyColor = '#a00000';
                    title.innerText = "Campaña de Misi: Los Canales";
                    text.innerText = "Misi avanza con sigilo entre las tuberías. Un perro mutante bloquea la salida del canal de drenaje.";
                    gameData.rats += 1;
                } else if (cat === 'luna') {
                    gameData.catName = 'Luna';
                    gameData.catColor = '#333333'; // Negro oscuro
                    gameData.enemyType = '🐱 Gato Infectado';
                    gameData.enemyColor = '#551a8b';
                    title.innerText = "Campaña de Luna: El Bosque";
                    text.innerText = "Luna se adentra en la bruma. Un gato infectado por la toxina la acecha desde la maleza.";
                    gameData.birds += 2;
                } else if (cat === 'copito') {
                    gameData.catName = 'Copito';
                    gameData.catColor = '#eeeeee'; // Blanco
                    gameData.enemyType = '👤 Cazador Humano';
                    gameData.enemyColor = '#4682b4';
                    title.innerText = "Campaña de Copito: Las Ruinas";
                    text.innerText = "Copito trepa por los andamios metálicos. Un cazador con linterna patrulla la zona inferior.";
                    gameData.rats += 1;
                    gameData.birds += 1;
                }

                document.getElementById('stat-rats').innerText = `🐭 Ratones: ${gameData.rats}`;
                document.getElementById('stat-birds').innerText = `🐦 Palomas: ${gameData.birds}`;
                document.getElementById('stat-status').innerText = ` estado: En Marcha`;

                buttons.innerHTML = `
                    <button class="action-button" onclick="game.triggerCrossEvent()">⚡ Ejecutar Acción / Cruzar Rutas</button>
                `;
            },

            moveCat: function(dir) {
                if (dir === 'LEFT') gameData.catX -= 25;
                if (dir === 'RIGHT') gameData.catX += 25;
                // Limitar movimiento dentro de la pantalla
                if (gameData.catX < 30) gameData.catX = 30;
                if (gameData.catX > canvas.width - 80) gameData.catX = canvas.width - 80;
            },

            actionAlert: function() {
                document.getElementById('story-text').innerText = `⚠️ ¡Alerta! ${gameData.catName} advierte la presencia de ${gameData.enemyType}. ¡Prepárate para esquivar!`;
            },

            triggerCrossEvent: function() {
                const title = document.getElementById('story-title');
                const text = document.getElementById('story-text');
                const buttons = document.getElementById('button-group');

                title.innerText = "¡Cruce de Destinos Estilo Resident Evil!";
                text.innerText = `¡Las rutas colisionan! ${gameData.catName} logra evadir a ${gameData.enemyType} gracias a una distracción provocada por el resto del grupo en el sector adyacente. ¡Se abre un nuevo pasaje secreto!`;
                
                // Cambiar color del enemigo para indicar victoria/evasión
                gameData.enemyColor = '#228b22'; 

                buttons.innerHTML = `
                    <button class="action-button" onclick="location.reload()">🔄 Reiniciar Campañas</button>
                `;
            }
        };

        // Bucle de renderizado gráfico en el Canvas (animación en vivo)
        function drawScene() {
            // Fondo oscuro estilo tétrico
            ctx.fillStyle = '#07070b';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Dibujar suelo del escenario
            ctx.fillStyle = '#14141c';
            ctx.fillRect(0, canvas.height - 40, canvas.width, 40);

            // Líneas de perspectiva o cuadrícula del entorno
            ctx.strokeStyle = '#220000';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(0, canvas.height - 40);
            ctx.lineTo(canvas.width, canvas.height - 40);
            ctx.stroke();

            // --- DIBUJAR GATITO PROTAGONISTA ---
            ctx.fillStyle = gameData.catColor;
            ctx.beginPath();
            ctx.arc(gameData.catX, canvas.height - 70, 22, 0, Math.PI * 2); // Cuerpo
            ctx.fill();
            // Orejas del gato
            ctx.beginPath();
            ctx.moveTo(gameData.catX - 16, canvas.height - 85);
            ctx.lineTo(gameData.catX - 8, canvas.height - 105);
            ctx.lineTo(gameData.catX, canvas.height - 85);
            ctx.moveTo(gameData.catX, canvas.height - 85);
            ctx.lineTo(gameData.catX + 8, canvas.height - 105);
            ctx.lineTo(gameData.catX + 16, canvas.height - 85);
            ctx.fillStyle = gameData.catColor;
            ctx.fill();

            // Nombre del gato flotando
            ctx.fillStyle = '#ffffff';
            ctx.font = '11px Courier New';
            ctx.fillText(gameData.catName, gameData.catX - 18, canvas.height - 115);

            // --- DIBUJAR ENEMIGO ---
            ctx.fillStyle = gameData.enemyColor;
            ctx.fillRect(gameData.enemyX, canvas.height - 85, 45, 45); // Forma del enemigo
            ctx.fillStyle = '#ff3333';
            ctx.font = '10px Courier New';
            ctx.fillText(gameData.enemyType, gameData.enemyX - 10, canvas.height - 95);

            requestAnimationFrame(drawScene);
        }

        drawScene();
    </script>
</body>
</html>
