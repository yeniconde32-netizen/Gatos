<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gatos: Destinos en la Oscuridad (Berserk Style)</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            background-color: #050505;
        }

        #game-screen {
            width: 100vw;
            height: 100vh;
            background-image: url('https://images.unsplash.com/photo-1509316975850-ff9c5deb0cd9?q=80&w=1000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .visual-viewport {
            flex: 1;
            width: 100%;
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 15px;
            box-sizing: border-box;
        }

        /* D-Pad Estilo Berserk (Rojo sangre y oscuro) */
        .virtual-dpad {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(20, 0, 0, 0.6);
            padding: 8px;
            border-radius: 50%;
            border: 1px solid rgba(180, 0, 0, 0.5);
            backdrop-filter: blur(2px);
        }

        .dpad-row {
            display: flex;
            gap: 15px;
        }

        .control-btn {
            background: rgba(139, 0, 0, 0.4);
            border: 2px solid #b22222;
            color: #fff;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.4);
        }

        .control-btn:active {
            background: #ff0000;
        }

        /* Panel de interfaz inferior con estética gótica/oscura */
        .ui-panel {
            background: rgba(10, 10, 12, 0.95);
            border-top: 2px solid #8b0000;
            color: #d1d1d1;
            padding: 15px 20px;
            box-sizing: border-box;
            width: 100%;
            max-height: 50vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.95);
            backdrop-filter: blur(4px);
        }

        #story-title {
            color: #ff3333;
            margin: 0;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 8px rgba(255, 0, 0, 0.6);
        }

        #story-text {
            font-size: 14px;
            line-height: 1.4;
            margin: 0;
            color: #cccccc;
        }

        .stats-box {
            display: flex;
            gap: 15px;
            font-size: 12px;
            color: #ffb347;
            border-bottom: 1px solid #330000;
            padding-bottom: 4px;
        }

        .choices-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .action-button {
            background: rgba(139, 0, 0, 0.2);
            border: 1px solid #b22222;
            color: #ff9999;
            padding: 10px 14px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 2px;
            text-align: left;
        }

        .action-button:hover {
            background: #8b0000;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.8);
        }
    </style>
</head>
<body>

    <div id="game-screen">
        <!-- CONTROLES TÁCTILES FLOTANTES -->
        <div class="visual-viewport">
            <div class="virtual-dpad" title="Moverse por el páramo">
                <button class="control-btn" onclick="gameRoute.handleControl('UP')">⬆️</button>
                <div class="dpad-row">
                    <button class="control-btn" onclick="gameRoute.handleControl('LEFT')">⬅️</button>
                    <button class="control-btn" onclick="gameRoute.handleControl('RIGHT')">➡️</button>
                </div>
                <button class="control-btn" onclick="gameRoute.handleControl('DOWN')">⬇️</button>
            </div>
            <div>
                <button class="control-btn" onclick="gameRoute.handleControl('ACTION')" style="border-color: #ff3333; color: #ff3333; background: rgba(255,0,0,0.2);" title="Acción felina">🐾</button>
            </div>
        </div>

        <!-- PANEL DE NARRATIVA ORIGINAL DE LOS GATOS -->
        <div class="ui-panel">
            <div class="stats-box">
                <span id="stat-rats">🐭 Ratones: 0</span>
                <span id="stat-birds">🐦 Palomas: 0</span>
            </div>
            <h3 id="story-title">Capítulo 1: La Gran Inundación</h3>
            <p id="story-text">
                Una marea de agua tóxica comienza a cubrir las tierras bajas bajo un cielo carmesí. Los perros salvajes acechan en la penumbra. Usa los controles o elige una ruta para avanzar.
            </p>
            <div class="choices-container" id="button-group">
                <button class="action-button" onclick="gameRoute.startRoute('orilla')">🐱 Ruta de Misi: Canales de agua y jaulas</button>
                <button class="action-button" onclick="gameRoute.startRoute('bosque')">🐈‍⬛ Ruta de Luna: Bosque de cristal y perros</button>
                <button class="action-button" onclick="gameRoute.startRoute('ruinas')">🐈 Ruta de Copito: Andamios y los cazadores</button>
            </div>
        </div>
    </div>

    <script>
        let gameState = { rats: 0, birds: 0 };

        const gameRoute = {
            updateStats: function() {
                document.getElementById('stat-rats').innerText = `🐭 Ratones: ${gameState.rats}`;
                document.getElementById('stat-birds').innerText = `🐦 Palomas: ${gameState.birds}`;
            },

            handleControl: function(direction) {
                const text = document.getElementById('story-text');
                if (direction === 'UP') text.innerText = "¡El valiente felino trepa con agilidad esquivando las sombras del páramo!";
                if (direction === 'DOWN') text.innerText = "¡El gatito se agacha sigiloso, fundiéndose con la oscuridad del terreno!";
                if (direction === 'LEFT') text.innerText = "¡Oteando el horizonte carmesí hacia el oeste en busca de aliados!";
                if (direction === 'RIGHT') text.innerText = "¡Avanzando con cautela por el sendero rocoso y hostil!";
                if (direction === 'ACTION') text.innerText = "🐾 ¡Zarpazo felino! Las tinieblas ceden temporalmente ante tu resistencia.";
            },

            startRoute: function(route) {
                const title = document.getElementById('story-title');
                const text = document.getElementById('story-text');
                const buttons = document.getElementById('button-group');

                if (route === 'orilla') {
                    title.innerText = "Ruta de Misi: Canales Inundados";
                    text.innerText = "Misi avanza por los oscuros tubos de drenaje. Ve palomas atrapadas bajo una red entre las aguas turbias.";
                    gameState.birds += 2;
                    this.updateStats();
                    buttons.innerHTML = `
                        <button class="action-button" onclick="gameRoute.action()">⚡ Liberar a las palomitas</button>
                    `;
                } else if (route === 'bosque') {
                    title.innerText = "Ruta de Luna: Bosque de Cristal";
                    text.innerText = "Luna esquiva a los perros salvajes que aúllan cerca de los cristales luminosos en la niebla.";
                    gameState.rats += 3;
                    this.updateStats();
                    buttons.innerHTML = `
                        <button class="action-button" onclick="gameRoute.action()">⚡ Salvar a los ratoncitos</button>
                    `;
                } else if (route === 'ruinas') {
                    title.innerText = "Ruta de Copito: Andamios";
                    text.innerText = "Copito vigila desde las alturas a los cazadores apostados entre los andamios metálicos.";
                    gameState.rats += 1;
                    gameState.birds += 1;
                    this.updateStats();
                    buttons.innerHTML = `
                        <button class="action-button" onclick="gameRoute.action()">⚡ Abrir la jaula secreta</button>
                    `;
                }
            },

            action: function() {
                document.getElementById('story-title').innerText = "¡Cruce de Caminos!";
                document.getElementById('story-text').innerText = "¡Has rescatado a los animales de la tormenta y te has reunido de paso con tus hermanos en el camino!";
                document.getElementById('button-group').innerHTML = `<button class="action-button" onclick="location.reload()">🔄 Reiniciar Aventura</button>`;
            }
        };
    </script>
</body>
</html>
