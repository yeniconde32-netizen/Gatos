<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gatitos en Fuga: Crónicas Callejeras - Edición Realista</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #090a0f;
            color: #ffffff;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 420px;
            height: 100vh;
            padding-top: 60px;
            padding-bottom: 70px;
        }

        #game-container {
            position: relative;
            width: 95%;
            height: 68vh;
            max-height: 420px;
            background: linear-gradient(to bottom, #111827, #1f2937);
            border: 3px solid #f59e0b;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 12px 30px rgba(0,0,0,0.8), inset 0 0 20px rgba(245, 158, 11, 0.2);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .hud {
            position: absolute;
            top: 10px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            font-weight: 800;
            color: #fbd38d;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
            z-index: 10;
            pointer-events: none;
        }

        .ad-banner {
            width: 100%;
            max-width: 400px;
            height: 50px;
            background-color: #161e2e;
            border: 1px dashed #f59e0b;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
            font-size: 11px;
            margin: 6px 0;
            border-radius: 8px;
        }

        .fixed-bottom {
            position: fixed;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 380px;
            z-index: 100;
        }

        .btn {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #111827;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 800;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
            transition: transform 0.1s ease;
        }
        .btn:active { transform: scale(0.97); }

        #game-over-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 15, 0.85);
            backdrop-filter: blur(5px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 30;
        }
    </style>
</head>
<body>

    <div class="ad-banner" style="position: fixed; top: 5px;">Anuncio Superior / Monetag</div>

    <div id="game-wrapper">
        <div id="game-container">
            <div class="hud">
                <span id="score-txt">Puntos: 0</span>
                <span id="mice-txt">Ratones: 0</span>
            </div>
            <canvas id="gameCanvas" width="400" height="300"></canvas>

            <div id="game-over-overlay">
                <h2 style="color: #ef4444; font-size: 28px; margin: 0 0 5px 0;">¡Atrapado!</h2>
                <p id="final-score-txt" style="color: #e2e8f0; font-size: 16px; margin: 0 0 20px 0;">Puntuación: 0</p>
                <button class="btn" style="width: 80%;" onclick="initGame()">Reintentar Huida</button>
            </div>
        </div>
        <div class="ad-banner">Anuncio Recompensas / Banner Inferior</div>
    </div>

    <div class="fixed-bottom">
        <button class="btn" onclick="window.location.href='/'">Volver al Menú de Campañas</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gameOverOverlay = document.getElementById('game-over-overlay');

        let stopGame = false;
        let score = 0;
        let miceCount = 0;
        let gameSpeed = 3.5;
        let frameCount = 0;

        const CW = canvas.width;
        const CH = canvas.height;
        const GROUND_Y = CH - 60;

        // Entidad Gato con animación procedural realista
        let cat = {
            x: 50,
            y: GROUND_Y,
            width: 42,
            height: 32,
            dy: 0,
            jumpForce: -10.5,
            gravity: 0.55,
            isGrounded: true,
            legAnim: 0
        };

        let obstacles = []; // Palomas y obstáculos urbanos
        let items = [];     // Ratones callejeros
        let particles = []; // Efectos de polvo y plumas

        // Audio Sintetizado de alta fidelidad
        let audioCtx = null;
        function playTone(freq1, freq2, duration, type) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq1, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(freq2, audioCtx.currentTime + duration);
                gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        function initGame() {
            gameOverOverlay.style.display = 'none';
            stopGame = false;
            score = 0;
            miceCount = 0;
            gameSpeed = 3.8;
            obstacles = [];
            items = [];
            particles = [];
            cat.y = GROUND_Y;
            cat.dy = 0;
            cat.isGrounded = true;
            loop();
        }

        // Controles táctiles y teclado optimizados
        window.addEventListener('keydown', e => { if(e.code === 'Space') makeJump(); });
        canvas.addEventListener('touchstart', e => { e.preventDefault(); makeJump(); });
        canvas.addEventListener('mousedown', e => { e.preventDefault(); makeJump(); });

        function makeJump() {
            if (stopGame) return;
            if (cat.isGrounded) {
                cat.dy = cat.jumpForce;
                cat.isGrounded = false;
                playTone(180, 450, 0.15, 'triangle');
                // Generar partículas de polvo al saltar
                for(let i=0; i<5; i++) {
                    particles.push({x: cat.x + 15, y: GROUND_Y + cat.height, vx: (Math.random()-0.5)*3, vy: -Math.random()*2, size: 4, alpha: 1, color: '#cbd5e1'});
                }
            }
        }

        function update() {
            if (stopGame) return;
            frameCount++;
            score += Math.floor(gameSpeed / 3);

            // Aceleración gradual de la dificultad
            if (frameCount % 600 === 0) gameSpeed += 0.4;

            document.getElementById('score-txt').innerText = `Puntos: ${score}`;
            document.getElementById('mice-txt').innerText = `Ratones: ${miceCount}`;

            // Física del gato
            cat.dy += cat.gravity;
            cat.y += cat.dy;

            if (cat.y >= GROUND_Y) {
                cat.y = GROUND_Y;
                cat.dy = 0;
                cat.isGrounded = true;
            } else {
                cat.legAnim += 0.2;
            }

            // Generador de Palomas Obstáculo
            if (frameCount % 85 === 0) {
                let pHeight = Math.random() > 0.5 ? 24 : 18;
                let pY = pHeight === 24 ? GROUND_Y + 8 : GROUND_Y - 22; // Variación baja o alta
                obstacles.push({
                    x: CW,
                    y: pY,
                    width: 30,
                    height: pHeight,
                    wingState: 0
                });
            }

            // Generador de Ratones (Ítems)
            if (frameCount % 120 === 0) {
                items.push({
                    x: CW,
                    y: GROUND_Y - 4,
                    width: 22,
                    height: 14
                });
            }

            // Mover obstáculos (Palomas)
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.x -= gameSpeed;
                obs.wingState += 0.15; // Animación de aleteo

                // Colisión precisa con el gato (Caja de impacto ajustada)
                if (
                    cat.x + 6 < obs.x + obs.width - 4 &&
                    cat.x + cat.width - 6 > obs.x + 4 &&
                    cat.y + 4 < obs.y + obs.height &&
                    cat.y + cat.height > obs.y + 4
                ) {
                    stopGame = true;
                    playTone(300, 80, 0.35, 'sawtooth');
                    document.getElementById('final-score-txt').innerText = `Puntuación Final: ${score}`;
                    gameOverOverlay.style.display = 'flex';
                    return;
                }

                if (obs.x + obs.width < 0) obstacles.splice(i, 1);
            }

            // Mover ítems (Ratones)
            for (let i = items.length - 1; i >= 0; i--) {
                let itm = items[i];
                itm.x -= gameSpeed;

                if (
                    cat.x < itm.x + itm.width &&
                    cat.x + cat.width > itm.x &&
                    cat.y < itm.y + itm.height &&
                    cat.y + cat.height > itm.y
                ) {
                    miceCount++;
                    score += 120;
                    playTone(600, 1100, 0.08, 'sine');
                    // Partículas de éxito al recolectar
                    for(let p=0; p<4; p++) {
                        particles.push({x: itm.x+10, y: itm.y, vx: (Math.random()-0.5)*4, vy: -Math.random()*3, size: 3, alpha: 1, color: '#f59e0b'});
                    }
                    items.splice(i, 1);
                } else if (itm.x + itm.width < 0) {
                    items.splice(i, 1);
                }
            }

            // Actualizar partículas
            for (let i = particles.length - 1; i >= 0; i--) {
                let pt = particles[i];
                pt.x += pt.vx;
                pt.y += pt.vy;
                pt.alpha -= 0.03;
                if (pt.alpha <= 0) particles.splice(i, 1);
            }
        }

        function draw() {
            // Fondo urbano nocturno con detalles realistas
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, CW, CH);

            // Edificios lejanos de fondo (Parallax simple)
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(20, 80, 50, CH - 140);
            ctx.fillRect(90, 50, 60, CH - 110);
            ctx.fillRect(180, 100, 45, CH - 160);
            ctx.fillRect(250, 40, 70, CH - 100);
            ctx.fillRect(340, 70, 55, CH - 130);

            // Suelo del Tejado Texturizado
            ctx.fillStyle = '#7f1d1d'; // Teja roja arcilla
            ctx.fillRect(0, GROUND_Y + cat.height, CW, CH - GROUND_Y);
            ctx.fillStyle = '#991b1b';
            ctx.fillRect(0, GROUND_Y + cat.height, CW, 8);
            // Detalles de separación de tejas
            ctx.strokeStyle = '#450a0a';
            ctx.lineWidth = 2;
            for(let x=0; x<CW; x+=30) {
                ctx.beginPath();
                ctx.moveTo(x, GROUND_Y + cat.height + 8);
                ctx.lineTo(x, CH);
                ctx.stroke();
            }

            // Dibujar Partículas
            for(let pt of particles) {
                ctx.fillStyle = pt.color;
                ctx.globalAlpha = pt.alpha;
                ctx.fillRect(pt.x, pt.y, pt.size, pt.size);
                ctx.globalAlpha = 1.0;
            }

            // Dibujar Gato Realista Estilizado (Silueta con detalles felinos dinámicos)
            ctx.fillStyle = '#f59e0b'; // Pelaje naranja cálido
            ctx.fillRect(cat.x, cat.y + 6, cat.width - 6, cat.height - 6);
            // Cabeza del gato
            ctx.fillRect(cat.x + cat.width - 16, cat.y - 4, 18, 16);
            // Orejas puntiagudas
            ctx.beginPath();
            ctx.moveTo(cat.x + cat.width - 14, cat.y - 4);
            ctx.lineTo(cat.x + cat.width - 10, cat.y - 13);
            ctx.lineTo(cat.x + cat.width - 6, cat.y - 4);
            ctx.moveTo(cat.x + cat.width - 4, cat.y - 4);
            ctx.lineTo(cat.x, cat.y - 13); // segunda oreja
            ctx.lineTo(cat.x + cat.width - 16, cat.y - 4); // Ajuste
            ctx.fillStyle = '#d97706';
            ctx.fill();
            // Cola dinámica
            ctx.strokeStyle = '#f59e0b';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(cat.x, cat.y + 12);
            ctx.quadraticCurveTo(cat.x - 12, cat.y - 5, cat.x - 8, cat.y - 12);
            ctx.stroke();

            // Dibujar Palomas (Obstáculos hostiles con alas animadas)
            for (let obs of obstacles) {
                ctx.fillStyle = '#94a3b8'; // Gris paloma
                ctx.fillRect(obs.x, obs.y + 6, obs.width, obs.height - 6);
                // Cabeza de paloma
                ctx.fillStyle = '#64748b';
                ctx.fillRect(obs.x + 2, obs.y + 2, 10, 10);
                // Pico amarillo
                ctx.fillStyle = '#fbbf24';
                ctx.fillRect(obs.x - 2, obs.y + 5, 4, 3);
                // Alas aleteando
                ctx.fillStyle = '#cbd5e1';
                let wingOffset = Math.sin(obs.wingState) * 6;
                ctx.fillRect(obs.x + 10, obs.y - 4 + wingOffset, 12, 8);
            }

            // Dibujar Ratones (Ítems recolectables)
            for (let itm of items) {
                // Cuerpo del ratón
                ctx.fillStyle = '#cbd5e1';
                ctx.fillRect(itm.x + 4, itm.y + 4, 14, 9);
                // Hocico y orejas
                ctx.fillRect(itm.x, itm.y + 6, 5, 5);
                // Cola delgada
                ctx.strokeStyle = '#94a3b8';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(itm.x + 18, itm.y + 8);
                ctx.quadraticCurveTo(itm.x + 26, itm.y + 14, window.innerWidth > 0 ? itm.x + 24 : 0, itm.y + 12);
                ctx.stroke();
            }
        }

        function loop() {
            if (stopGame) return;
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // Arrancar al cargar
        initGame();
    </script>
</body>
</html>
