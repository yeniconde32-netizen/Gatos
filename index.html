<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gatos: Destinos Cruzados - Edición Castillo Gótico</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            background-color: #0b070c;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Lienzo superior con la ilustración hermosa de castillos y torres góticas */
        #gameCanvas {
            flex: 1;
            width: 100%;
            display: block;
        }

        /* Controles táctiles flotantes para mover al gato en el escenario */
        .touch-controls {
            position: absolute;
            top: 15px;
            left: 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            z-index: 10;
        }

        .dpad-row {
            display: flex;
            gap: 5px;
            justify-content: center;
        }

        .control-btn {
            background: rgba(80, 20, 30, 0.8);
            border: 2px solid #d4af37; /* Borde dorado antiguo */
            color: #fff;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.4);
        }

        .control-btn:active {
            background: #d4af37;
            color: #000;
        }

        /* Panel inferior con las ideas y opciones de la narrativa */
        .ui-panel {
            background: rgba(16, 12, 18, 0.98);
            border-top: 3px solid #d4af37;
            color: #e2d9c5;
            padding: 15px 20px;
            box-sizing: border-box;
            width: 100%;
            height: 46vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.95);
        }

        #story-title {
            color: #f3d56d;
            margin: 0;
            font-size: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 6px rgba(243, 213, 109, 0.5);
        }

        #story-text {
            font-size: 13px;
            line-height: 1.4;
            margin: 0;
            color: #c8bda9;
        }

        .stats-box {
            display: flex;
            gap: 15px;
            font-size: 11px;
            color: #f3d56d;
            border-bottom: 1px solid #3d2b1f;
            padding-bottom: 4px;
        }

        .choices-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: auto;
        }

        .action-button {
            background: rgba(60, 25, 35, 0.6);
            border: 1px solid #b8973e;
            color: #f1e4c3;
            padding: 10px 14px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 2px;
            text-align: left;
        }

        .action-button:hover {
            background: #7a2836;
            color: #ffffff;
            border-color: #ffd700;
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.7);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Lienzo superior con arte de castillo gótico e ilustración oscura -->
        <canvas id="gameCanvas"></canvas>

        <!-- Controles Táctiles de Movimiento -->
        <div class="touch-controls">
            <div class="dpad-row">
                <button class="control-btn" onclick="game.move('UP')">⬆️</button>
            </div>
            <div class="dpad-row">
                <button class="control-btn" onclick="game.move('LEFT')">⬅️</button>
                <button class="control-btn" onclick="game.move('RIGHT')">➡️</button>
            </div>
            <div class="dpad-row">
                <button class="control-btn" onclick="game.move('DOWN')">⬇️</button>
            </div>
        </div>

        <!-- Panel Inferior: Ideas, Estado y Opciones -->
        <div class="ui-panel">
            <div class="stats-box">
                <span id="stat-rats">🐭 Ratones: 0</span>
                <span id="stat-birds">🐦 Palomas: 0</span>
                <span id="stat-status"> estado: En las Puertas del Castillo</span>
            </div>
            <h3 id="story-title">El Reino Olvidado: Destinos Cruzados</h3>
            <p id="story-text">
                Frente a las imponentes murallas y torres góticas del antiguo castillo, los tres felinos contemplan el horizonte de piedra y niebla. Selecciona un personaje para guiarlo a través del reino:
            </p>
            <div class="choices-container" id="button-group">
                <button class="action-button" onclick="game.selectCat('misi', 'Misi (Guardián del Foso)', '#ff9900')">🐱 Seleccionar a Misi (Ruta del Foso y Murallas)</button>
                <button class="action-button" onclick="game.selectCat('luna', 'Luna (Sombra del Salón)', '#f0f0f0')">🐈‍⬛ Seleccionar a Luna (Ruta de las Torres Altas)</button>
                <button class="action-button" onclick="game.selectCat('copito', 'Copito (Escalador de Piedra)', '#a0a0a0')">🐈 Seleccionar a Copito (Ruta de los Arcos Góticos)</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight * 0.54;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let player = {
            x: canvas.width / 2,
            y: canvas.height - 75,
            name: 'Misi',
            color: '#ff9900',
            active: false
        };

        let gameState = { rats: 0, birds: 0 };

        const game = {
            selectCat: function(route, name, color) {
                player.name = name;
                player.color = color;
                player.active = true;
                player.x = 90;
                player.y = canvas.height - 75;

                const title = document.getElementById('story-title');
                const text = document.getElementById('story-text');
                const buttons = document.getElementById('button-group');

                if (route === 'misi') {
                    title.innerText = "Ruta de Misi: El Foso del Castillo";
                    text.innerText = "Misi recorre los cimientos de piedra antigua. ¡Usa las flechas para explorar los oscuros arcos del castillo!";
                    gameState.rats += 1;
                } else if (route === 'luna') {
                    title.innerText = "Ruta de Luna: Las Torres Góticas";
                    text.innerText = "Luna escala hacia las alturas donde la luz de la luna atraviesa los vitrales rotos. ¡Muévela con precaución!";
                    gameState.birds += 2;
                } else if (route === 'copito') {
                    title.innerText = "Ruta de Copito: Los Balcones de Piedra";
                    text.innerText = "Copito camina sobre las cornisas del palacio abandonado. ¡Usa los controles para sortear los abismos!";
                    gameState.rats += 1;
                    gameState.birds += 1;
                }

                document.getElementById('stat-rats').innerText = `🐭 Ratones: ${gameState.rats}`;
                document.getElementById('stat-birds').innerText = `🐦 Palomas: ${gameState.birds}`;
                document.getElementById('stat-status').innerText = ` estado: Explorando el Castillo`;

                buttons.innerHTML = `
                    <button class="action-button" onclick="game.crossDestinies()">⚡ Unir Destinos con los Hermanos</button>
                `;
            },

            move: function(dir) {
                const speed = 25;
                if (dir === 'LEFT') player.x -= speed;
                if (dir === 'RIGHT') player.x += speed;
                if (dir === 'UP') player.y -= speed;
                if (dir === 'DOWN') player.y += speed;

                if (player.x < 30) player.x = 30;
                if (player.x > canvas.width - 30) player.x = canvas.width - 30;
                if (player.y < 60) player.y = 60;
                if (player.y > canvas.height - 45) player.y > canvas.height - 45;
            },

            crossDestinies: function() {
                const title = document.getElementById('story-title');
                const text = document.getElementById('story-text');
                const buttons = document.getElementById('button-group');

                title.innerText = "¡Convergencia en el Castillo!";
                text.innerText = "¡Los tres gatos se encuentran en la gran sala del trono! Juntos descubren un pasadizo secreto que ilumina todo el castillo y resuelve la aventura.";

                buttons.innerHTML = `
                    <button class="action-button" onclick="location.reload()">🔄 Reiniciar Aventura Gótica</button>
                `;
            }
        };

        // Motor de renderizado con la ilustración hermosa del castillo gótico y torres
        function drawCastleScene() {
            let w = canvas.width;
            let h = canvas.height;

            // 1. Cielo crepuscular de fantasía oscura y mística
            let skyGrad = ctx.createLinearGradient(0, 0, 0, h * 0.7);
            skyGrad.addColorStop(0, '#100b16');
            skyGrad.addColorStop(0.4, '#241b2f');
            skyGrad.addColorStop(1, '#422836');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, w, h);

            // Luna llena mística brillando suavemente
            ctx.fillStyle = 'rgba(245, 230, 180, 0.2)';
            ctx.beginPath();
            ctx.arc(w * 0.75, h * 0.25, 45, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#fef3c7';
            ctx.beginPath();
            ctx.arc(w * 0.75, h * 0.25, 22, 0, Math.PI * 2);
            ctx.fill();

            // 2. Siluetas de los Castillos y Torres Góticas al fondo (Inspirado en la imagen bonita)
            ctx.fillStyle = '#181120';
            let castleWidth = w * 0.55;
            let castleX = w * 0.22;
            let castleY = h * 0.28;

            // Muralla principal del castillo
            ctx.fillRect(castleX, castleY + 40, castleWidth, h * 0.45);

            // Torres góticas con techos cónicos puntiagudos
            // Torre Izquierda
            ctx.fillRect(castleX - 15, castleY - 10, 30, h * 0.5);
            ctx.beginPath();
            ctx.moveTo(castleX - 25, castleY - 10);
            ctx.lineTo(castleX, castleY - 50);
            ctx.lineTo(castleX + 25, castleY - 10);
            ctx.fillStyle = '#120c18';
            ctx.fill();

            // Torre Central Alta
            ctx.fillRect(castleX + castleWidth * 0.4, castleY - 35, 38, h * 0.55);
            ctx.beginPath();
            ctx.moveTo(castleX + castleWidth * 0.4 - 10, castleY - 35);
            ctx.lineTo(castleX + castleWidth * 0.4 + 19, castleY - 85);
            ctx.lineTo(castleX + castleWidth * 0.4 + 48, castleY - 35);
            ctx.fillStyle = '#0d0812';
            ctx.fill();

            // Torre Derecha
            ctx.fillRect(castleX + castleWidth - 15, castleY + 10, 30, h * 0.4);
            ctx.beginPath();
            ctx.moveTo(castleX + castleWidth - 25, castleY + 10);
            ctx.lineTo(castleX + castleWidth, castleY - 25);
            ctx.lineTo(castleX + castleWidth + 25, castleY + 10);
            ctx.fillStyle = '#150f1c';
            ctx.fill();

            // Ventanas brillantes en las torres del castillo
            ctx.fillStyle = '#f59e0b';
            ctx.fillRect(castleX + 5, castleY + 20, 6, 12);
            ctx.fillRect(castleX + castleWidth * 0.4 + 16, castleY - 10, 6, 14);
            ctx.fillRect(castleX + castleWidth - 8, castleY + 30, 5, 10);

            // 3. Suelo de piedra del patio del castillo
            let groundY = h - 45;
            ctx.fillStyle = '#1c1412';
            ctx.fillRect(0, groundY, w, 45);

            // Detalles de adoquines en el suelo
            ctx.strokeStyle = '#38251c';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, groundY);
            ctx.lineTo(w, groundY);
            ctx.stroke();

            // 4. EL GATO JUGADOR EN EL ESCENARIO 2D
            ctx.fillStyle = player.color;
            ctx.beginPath();
            ctx.arc(player.x, player.y, 17, 0, Math.PI * 2); // Cuerpo
            ctx.fill();

            // Orejas puntiagudas del gatito
            ctx.beginPath();
            ctx.moveTo(player.x - 11, player.y - 25);
            ctx.lineTo(player.x - 5, player.y - 42);
            ctx.lineTo(player.x, player.y - 25);
            ctx.moveTo(player.x, player.y - 25);
            ctx.lineTo(player.x + 5, player.y - 42);
            ctx.lineTo(player.x + 11, player.y - 25);
            ctx.fillStyle = player.color;
            ctx.fill();

            // Nombre flotante del personaje activo
            ctx.fillStyle = '#fef3c7';
            ctx.font = '11px Courier New';
            ctx.fillText(player.name, player.x - 28, player.y - 50);

            requestAnimationFrame(drawCastleScene);
        }

        drawCastleScene();
    </script>
</body>
</html>
