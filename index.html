<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gatitos en Fuga: Capítulo 1 - Edición Urbana</title>
    <style>
        body {
            background-color: #090d16;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 420px;
            height: 100vh;
            padding-top: 60px;
            padding-bottom: 70px;
        }

        #game-container {
            position: relative;
            width: 95%;
            height: 72vh;
            max-height: 420px;
            /* Fondo estilo muro de concreto callejero nocturno */
            background: #111827;
            border: 3px solid #38bdf8; /* Neón Azul */
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }

        .hud {
            position: absolute;
            top: 8px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            font-weight: bold;
            color: #38bdf8;
            text-shadow: 0 0 8px rgba(56, 189, 248, 0.8);
            z-index: 10;
            pointer-events: none;
        }

        .ad-banner {
            width: 100%;
            max-width: 400px;
            height: 50px;
            background-color: #111827;
            border: 1px dashed #38bdf8;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #38bdf8;
            font-size: 11px;
            margin: 6px 0;
            border-radius: 6px;
        }

        .fixed-bottom {
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 380px;
            z-index: 100;
        }

        .btn {
            background-color: #0284c7;
            color: #fff;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.5);
        }
        .btn:active { background-color: #0369a1; transform: translateY(2px); }

        /* Pantalla Cinemática / Diálogo Estilo Spray */
        #cinematic-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 10, 0.95);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 30;
            padding: 25px;
            box-sizing: border-box;
        }
        #cinematic-box {
            border: 2px solid #38bdf8;
            padding: 20px;
            background: rgba(2, 132, 199, 0.1);
            border-radius: 8px;
            max-width: 350px;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
        }
        #cinematic-title {
            color: #38bdf8;
            font-size: 20px;
            margin-top: 0;
            margin-bottom: 10px;
        }
        #cinematic-text {
            color: #e5e7eb;
            font-size: 15px;
            line-height: 1.4;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="ad-banner" style="position: fixed; top: 5px;">Anuncio Superior / Monetag</div>

    <div id="game-wrapper">
        <div id="game-container">
            <div class="hud">
                <span id="score-txt">Puntos: 0</span>
                <span id="chapter-txt">Zona Urbana: 1</span>
            </div>
            <canvas id="gameCanvas" width="400" height="300"></canvas>

            <!-- PANTALLA CINEMÁTICA -->
            <div id="cinematic-overlay">
                <div id="cinematic-box">
                    <h3 id="cinematic-title">ALERTA CALLEJERA</h3>
                    <p id="cinematic-text">Mensaje...</p>
                    <button class="btn" id="cinematic-btn" onclick="handleCinematicAction()">Continuar</button>
                </div>
            </div>
        </div>
        <div class="ad-banner">Anuncio Recompensas / Banner Inferior</div>
    </div>

    <div class="fixed-bottom">
        <button class="btn" onclick="window.location.href='/'">Volver al Menú de Campañas</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const cinematicOverlay = document.getElementById('cinematic-overlay');
        const cinematicTitle = document.getElementById('cinematic-title');
        const cinematicText = document.getElementById('cinematic-text');
        const cinematicBtn = document.getElementById('cinematic-btn');

        let stopGame = false;
        let pausedForCinematic = false;
        let isChapterEnd = false;
        let score = 0;
        let gameSpeed = 3.8;
        let frameCount = 0;

        const CW = canvas.width;
        const CH = canvas.height;
        const GROUND_Y = CH - 60;

        let cat = {
            x: 50,
            y: GROUND_Y,
            width: 38,
            height: 30,
            dy: 0,
            jumpForce: -11.5,
            gravity: 0.6,
            isGrounded: true
        };

        let enemies = [];
        let items = [];

        let audioCtx = null;
        function playTone(freq1, freq2, duration, type) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq1, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(freq2, audioCtx.currentTime + duration);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        function initGame() {
            stopGame = false;
            pausedForCinematic = false;
            isChapterEnd = false;
            score = 0;
            gameSpeed = 3.8;
            frameCount = 0;
            enemies = [];
            items = [];
            cinematicOverlay.style.display = 'none';
            cat.y = GROUND_Y;
            cat.isGrounded = true;
            loop();
        }

        window.addEventListener('keydown', e => { if(e.code === 'Space') makeJump(); });
        canvas.addEventListener('touchstart', e => { e.preventDefault(); makeJump(); });

        function makeJump() {
            if (stopGame || pausedForCinematic) return;
            if (cat.isGrounded) {
                cat.dy = cat.jumpForce;
                cat.isGrounded = false;
                playTone(200, 500, 0.12, 'square');
            }
        }

        const enemyEncounters = [
            { name: "Cuervo Callejero", color: "#1f2937", heightBonus: -32, dialogue: "Un cuervo de losas oscuras despliega sus alas y te bloquea el callejón con una mirada amenazante." },
            { name: "Rata Subterránea", color: "#065f46", heightBonus: 0, dialogue: "Una rata gigante sale de una alcantarilla abierta y te muestra los colmillos lista para atacar." }
        ];

        function update() {
            if (stopGame || pausedForCinematic) return;
            frameCount++;
            score += Math.floor(gameSpeed / 3);

            if (frameCount % 400 === 0) gameSpeed += 0.3;

            if (score >= 1500) {
                triggerChapterComplete();
                return;
            }

            document.getElementById('score-txt').innerText = `Puntos: ${score}`;

            cat.dy += cat.gravity;
            cat.y += cat.dy;
            if (cat.y >= GROUND_Y) {
                cat.y = GROUND_Y;
                cat.dy = 0;
                cat.isGrounded = true;
            }

            let spawnRate = score < 600 ? 95 : 70;
            if (frameCount % spawnRate === 0) {
                let typeIdx = score < 600 ? 0 : (Math.random() > 0.4 ? 1 : 0);
                let enemyData = enemyEncounters[typeIdx];
                enemies.push({
                    x: CW,
                    y: GROUND_Y + 4 + enemyData.heightBonus,
                    width: 40,
                    height: 24 - enemyData.heightBonus,
                    data: enemyData
                });
            }

            if (frameCount % 130 === 0) {
                items.push({ x: CW, y: GROUND_Y + 5, width: 22, height: 14 });
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                e.x -= gameSpeed;

                if (
                    cat.x < e.x + e.width &&
                    cat.x + cat.width > e.x &&
                    cat.y < e.y + e.height &&
                    cat.y + cat.height > e.y
                ) {
                    triggerCinematicEncounter(e);
                    return;
                }

                if (e.x + e.width < 0) enemies.splice(i, 1);
            }

            for (let i = items.length - 1; i >= 0; i--) {
                let itm = items[i];
                itm.x -= gameSpeed;
                if (
                    cat.x < itm.x + itm.width &&
                    cat.x + cat.width > itm.x &&
                    cat.y < itm.y + itm.height &&
                    cat.y + cat.height > itm.y
                ) {
                    score += 90;
                    playTone(700, 1200, 0.05, 'sine');
                    items.splice(i, 1);
                } else if (itm.x + itm.width < 0) items.splice(i, 1);
            }
        }

        function triggerCinematicEncounter(enemy) {
            pausedForCinematic = true;
            stopGame = true;
            playTone(120, 40, 0.8, 'sawtooth');

            isChapterEnd = false;
            cinematicTitle.innerText = "¡EMBOSCADA URBANA!";
            cinematicText.innerText = enemy.data.dialogue;
            cinematicBtn.innerText = "Volver a Intentar";
            cinematicOverlay.style.display = 'flex';
        }

        function triggerChapterComplete() {
            stopGame = true;
            pausedForCinematic = true;
            isChapterEnd = true;
            playTone(350, 950, 0.5, 'triangle');

            cinematicTitle.innerText = "¡ZONA 1 SUPERADA!";
            cinematicText.innerText = "Has cruzado los callejones oscuros esquivando el peligro. El distrito comercial te espera en el siguiente nivel.";
            cinematicBtn.innerText = "Volver al Menú";
            cinematicOverlay.style.display = 'flex';
        }

        function handleCinematicAction() {
            if (isChapterEnd) {
                window.location.href = '/';
            } else {
                initGame();
            }
        }

        function draw() {
            // Fondo con textura de ladrillo / concreto urbano nocturno
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, CW, CH);

            // Patrón de líneas simulando bloques de ladrillo en el fondo
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 1;
            for(let i = 0; i < CH; i += 20) {
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(CW, i);
                ctx.stroke();
            }

            // Grafitis y carteles de neón simulados al fondo
            ctx.fillStyle = '#38bdf822';
            ctx.fillRect(50, 60, 80, 50);
            ctx.fillStyle = '#f43f5e22';
            ctx.fillRect(240, 90, 70, 40);

            // Suelo Callejero con borde de luz de neón
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(0, GROUND_Y + cat.height, CW, CH - GROUND_Y);
            ctx.fillStyle = '#38bdf8';
            ctx.fillRect(0, GROUND_Y + cat.height, CW, 3); // Línea de neón en el suelo

            // GATO ESTILO STENCIL URBANO (Con brillo de neón naranja/spray)
            ctx.fillStyle = '#f97316'; // Naranja brillante aerosol
            ctx.fillRect(cat.x, cat.y + 4, cat.width - 6, cat.height - 4);
            // Cabeza
            ctx.fillRect(cat.x + cat.width - 16, cat.y - 4, 16, 14);
            // Orejas con spray
            ctx.fillStyle = '#ea580c';
            ctx.fillRect(cat.x + cat.width - 14, cat.y - 8, 4, 5);
            ctx.fillRect(cat.x + cat.width - 6, cat.y - 8, 4, 5);
            // Cola en curva de spray
            ctx.strokeStyle = '#fdba74';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(cat.x, cat.y + 12);
            ctx.quadraticCurveTo(cat.x - 12, cat.y - 6, cat.x - 6, cat.y - 12);
            ctx.stroke();

            // ENEMIGOS ESTILO URBANO
            for (let e of enemies) {
                ctx.fillStyle = e.data.color;
                ctx.fillRect(e.x, e.y, e.width, e.height);
                // Ojos brillantes del enemigo en la oscuridad
                ctx.fillStyle = '#38bdf8';
                ctx.fillRect(e.x + 6, e.y + 6, 4, 4);
            }

            // PESCADOS (Ítems de neón)
            for (let itm of items) {
                ctx.fillStyle = '#38bdf8';
                ctx.fillRect(itm.x, itm.y + 4, 14, 8);
                ctx.beginPath();
                ctx.moveTo(itm.x + 14, itm.y + 4);
                ctx.lineTo(itm.x + 20, itm.y);
                ctx.lineTo(itm.x + 20, itm.y + 12);
                ctx.fill();
            }
        }

        function loop() {
            if (stopGame) return;
            update();
            draw();
            requestAnimationFrame(loop);
        }

        initGame();
    </script>
</body>
</html>
